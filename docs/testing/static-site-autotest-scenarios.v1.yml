schema: static_site_autotest_scenarios.v1
status: canonical_strategy_seed
updated_at: '2026-08-03'
strategy: docs/operations/static-site-autotest-strategy.md
release_gates: docs/features/static-site-pages/release-autotest-gates.md
auth_session_fixture: docs/testing/static-site-auth-session-fixture.md
implementation_prompt: docs/testing/static-site-autotest-codex-prompt.md

outcomes:
  - PASS
  - FAIL
  - BLOCKED
  - STARTED_BACKGROUND
  - SKIPPED_NOT_APPLICABLE
  - NOT_IMPLEMENTED

platforms:
  browser:
    layer: L1
    runner: playwright
  android:
    layer: L2
    runner: appium_uiautomator2_android_emulator
  ios:
    layer: L2
    runner: appium_xcuitest_ios_simulator

auth_modes:
  anonymous:
    real_jwt: false
    product_otp_issue: forbidden
    external_mail: forbidden
  anonymous_session:
    real_jwt: true
    identity: supabase_anonymous_is_anonymous_true
    product_otp_issue: forbidden
    external_mail: forbidden
    raffle_eligibility: false
  mocked_ui:
    real_jwt: false
    backend_claims: forbidden
    product_otp_issue: forbidden
    external_mail: forbidden
  session_fixture:
    real_jwt: true
    credential: fresh_admin_issued_one_time
    default_scope: worker
    product_otp_issue: forbidden
    external_mail: forbidden
    real_mail_fallback: forbidden
  admin_otp_ui:
    real_jwt: true
    credential: fresh_admin_issued_one_time
    product_otp_issue: forbidden
    external_mail: forbidden
  real_mail_otp:
    real_jwt: true
    product_otp_issue: exactly_one_per_full_journey
    external_mail: exactly_one_matching_message
  yandex_oauth:
    real_jwt: true
    external_mail: forbidden

auth_fixture_contract:
  fixed_allowlisted_personas: required
  new_unique_identity_per_routine_run: forbidden
  session_state_in_github_secret: forbidden
  auth_state_artifact_or_cache_upload: forbidden
  service_or_admin_key_in_browser: forbidden
  fixed_otp_or_production_bypass: forbidden
  self_issued_jwt: forbidden
  refresh_token_shared_between_parallel_workers: forbidden
  session_fixture_real_mail_fallback: forbidden
  unexpected_session_fixture_product_otp: FAIL_AUTH_FIXTURE_UNEXPECTED_OTP
  unexpected_session_fixture_mail: FAIL_AUTH_FIXTURE_UNEXPECTED_MAIL
  fixture_unavailable: BLOCKED_AUTH_FIXTURE

suites:
  pr-fast:
    mode: blocking
    default_platforms: [browser]
  feature:
    mode: selector_defined
  catalog:
    mode: background_advisory
  mobile-critical:
    mode: selector_defined
  release:
    mode: blocking
  post-deploy:
    mode: selector_defined

