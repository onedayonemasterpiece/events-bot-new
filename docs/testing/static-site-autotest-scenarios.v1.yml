schema: static_site_autotest_scenarios.v1
status: canonical_strategy_seed
updated_at: '2026-08-02'
strategy: docs/operations/static-site-autotest-strategy.md
release_gates: docs/features/static-site-pages/release-autotest-gates.md
implementation_prompt: docs/testing/static-site-autotest-codex-prompt.md

outcomes:
  - PASS
  - FAIL
  - BLOCKED
  - STARTED_BACKGROUND
  - SKIPPED_NOT_APPLICABLE
  - NOT_IMPLEMENTED

platforms:
  browser:
    layer: L1
    runner: playwright
  android:
    layer: L2
    runner: appium_uiautomator2_android_emulator
  ios:
    layer: L2
    runner: appium_xcuitest_ios_simulator

suites:
  pr-fast:
    mode: blocking
    default_platforms: [browser]
  feature:
    mode: selector_defined
  catalog:
    mode: background_advisory
  mobile-critical:
    mode: selector_defined
  release:
    mode: blocking
  post-deploy:
    mode: selector_defined

scenarios:
  artifact.route_manifest_integrity:
    title: Static artifact, routes and manifest are internally consistent
    status: implemented_existing
    layers: [L0]
    platforms: []
    trigger_tags: [static-data, static-route, release-publisher]
    cost: low
    side_effects: none
    evidence: structured_summary
    blocking:
      pull_request: true
      release: true

  browser.generated_release_gate:
    title: Generated event candidate browser release journeys
    status: implemented_existing
    layers: [L1]
    platforms: [browser]
    trigger_tags: [static-route, visual-layout, release-publisher]
    cost: medium
    side_effects: none
    evidence: screenshots_and_report
    blocking:
      pull_request: affected_scope
      release: true

  browser.route_health:
