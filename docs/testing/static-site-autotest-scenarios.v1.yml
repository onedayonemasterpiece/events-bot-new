  focus.otp.browser_tab:
    title: Real focus-group email OTP in browser tab
    status:
      browser: implemented_terminal_live_acceptance
      android: implemented_terminal_live_acceptance
      ios: implemented_terminal_live_acceptance
    layers: [L1, L2]
    platforms: [browser, android, ios]
    trigger_tags: [auth-otp, mobile-input, supabase-connectivity, yandex-relay]
    cost: high
    side_effects: protected_real_email_and_idempotent_membership
    target: deployed_https_exact_repo_sha
    isolation: external-focus-email-otp
    execution: sequential_while_one_mailbox_is_shared
    evidence: restricted_no_video_no_trace_no_har
    transport_contract:
      capabilities: [auth, data]
      operations:
        - name: auth.otp
          semantics: selected-once
          max_dispatches: 1
          max_durable_effects: 1
        - name: auth.verify
          semantics: selected-once
          max_dispatches: 1
          max_durable_effects: 1
        - name: rpc.register_focus_group_participant_v1
          semantics: idempotent-replay
          max_durable_effects: 1
      required_profiles:
        pr_browser: [client_supabase_direct_unreachable, client_yandex_relay_unreachable]
        mobile_release: [normal, client_supabase_direct_unreachable, client_yandex_relay_unreachable]
      both_routes_down_expectation:
        selected_once_dispatches: 0
    acceptance_receipts:
      browser: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30745526613
      browser_control_issue: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30755922643
      android: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30747598046
      ios_blocked_safari_first_run_ui: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30754894934
      android_client_supabase_direct_unreachable: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30772062840
      ios_client_supabase_direct_unreachable: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30772233868
      android_client_yandex_relay_unreachable: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30772957771
      ios_client_yandex_relay_unreachable: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30773125445
    blocking:
      pull_request: direct_contract_change_only
      release: true_for_auth_onboarding_or_mail_route_changes

