policies:
  full_catalog_on_emulators: forbidden
  mobile_viewport_substitutes_android_or_ios: false
  playwright_webkit_substitutes_native_ios: false
  real_otp_video_trace_har: forbidden
  real_otp_parallel_on_single_mailbox: forbidden
  fixed_test_identity_for_routine_otp: required
  fresh_user_otp: protected_manual_only
  background_outcome_may_be_reported_as_pass: false
  mandatory_background_must_be_terminal_before_release: true
  planned_scenario_blocks_release: false
