      - access.placeholder_first_paint
      - access.main_ui_hidden_without_marker
      - access.invite_sets_marker
      - access.marker_survives_reload
      - access.fixed_cutoff
      - page_score.route_matrix
      - page_score.visible_before_footer
      - page_score.exact_scale
      - page_score.immediate_save
      - page_score.numeric_saved_state
      - page_score.same_revision_persists
      - page_score.revision_changed_message
      - page_score.new_revision_submission
      - page_score.cross_family_independent
      - page_score.optional_details
      - page_score.offline_idempotency
      - service_nps.hub_visible
      - service_nps.immediate_save
      - service_nps.independent_from_page_score
      - service_nps.optional_general_comment
      - auth.browser_identity
      - auth.android_identity
      - auth.iphone_supported_identity
      - auth.yandex_identity
      - auth.unverified_ineligible
      - pwa.android_relaunch
      - pwa.iphone_home_screen
      - use.share
      - use.calendar
      - use.not_interested
      - use.for_me
      - artifacts.exact_collection
      - artifacts.server_receipt
      - artifacts.threshold
      - stats.queryable
      - stats.no_pii
      - raffle.chances
      - raffle.rules_versioned
      - raffle.dry_draw
      - release.full_rehearsal

  expand_to_80:
    required:
      - seed
      - operations.no_mass_p0
      - operations.feedback_queue_manageable
      - stats.counts_consistent

  expand_to_200:
    required:
      - expand_to_80
      - auth.cap_boundary
      - artifacts.receipt_integrity
      - raffle.snapshot_rehearsal

