schema: kenigevents.focus_group_release_scenarios.v3
updated_at: '2026-08-02'

canonical_docs:
  owner_brief: docs/features/static-site-pages/focus-group.md
  strategy: docs/features/static-site-pages/focus-group-release/README.md
  status: docs/features/static-site-pages/focus-group-release/status.md
  nps_ui: docs/features/static-site-pages/focus-group-release/nps-ui.md
  testing: docs/features/static-site-pages/focus-group-release/testing.md
  prize_rules: docs/features/static-site-pages/focus-group-release/prize-rules.md

programme:
  id: static-site-focus-group-2026
  site_kind: static_astro_site
  eligibility_cutoff: '2026-08-31T18:00:00+02:00'
  timezone: Europe/Kaliningrad
  access:
    kind: soft_local_marker_gate
    default_state: locked_placeholder
    main_ui_visible_without_marker: false
    security_boundary: none
    technical_bypass_is_incident: false
  artifacts:
    collection_version: focus-eggs-v1
    total: 12
    required: 10
  raffle:
    verified_identity_required: true
    nps_required: true
    base_chances: 1
    text_feedback_bonus: 1
    screenshot_feedback_bonus: 1
    maximum_chances: 3
    winner_response_days: 3
    prize: two_partner_theatre_tickets
    delivery: in_person
    all_verified_participants_receive_final_email: true

outcomes:
  - PASS
  - FAIL
  - BLOCKED
  - NOT_IMPLEMENTED
  - SKIPPED_NOT_APPLICABLE

states:
  - ready
  - partial
  - missing
  - blocked
  - optional
  - not_required

workflows:
  focus_group_contract:
    file: .github/workflows/focus-group-contract.yml
    state: missing
    trigger: pull_request_and_main
    secrets: none

  external_focus_email_otp:
    file: .github/workflows/external-focus-email-otp.yml
    state: partial
    trigger: protected_manual_and_workflow_call
    secrets: external-e2e
    evidence:
      browser_pass: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30745526613
      android_pass: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30747598046
      ios_non_acceptance: https://github.com/onedayonemasterpiece/events-bot-new/actions/runs/30754894934

  focus_group_live:
    file: .github/workflows/focus-group-live.yml
    state: missing
    trigger: protected_manual_and_workflow_call
    secrets: focus-e2e

  focus_group_draw:
    file: .github/workflows/focus-group-draw.yml
    state: missing
    trigger: protected_manual
    secrets: focus-draw

  focus_group_report:
    state: not_required
    reason: statistics_are_queried_read_only_on_demand

policies:
  exact_deployed_sha_required: true
  open_pr_is_pass: false
  background_started_is_pass: false
  local_marker_is_security_boundary: false
  interface_visible_without_marker: false
  unverified_user_can_test_site: true
  unverified_user_can_enter_raffle: false
  nps_scale_exactly_0_to_10: true
  nps_hidden_behind_button: false
  nps_comment_required: false
  selected_score_must_be_displayed_as_number: true
  raw_feedback_in_actions_artifact: false
  github_artifact_contains_pii: false
  daily_statistics_report_required: false
  whole_catalog_on_mobile_emulators: false
  playwright_webkit_replaces_native_ios: false
  real_otp_parallel_on_one_mailbox: false
  real_otp_trace_har_video: forbidden

release_sets:
  seed:
    required:
      - access.placeholder_first_paint
      - access.main_ui_hidden_without_marker
      - access.invite_sets_marker
      - access.marker_survives_reload
      - access.fixed_cutoff
      - nps.visible_before_footer
      - nps.exact_scale
      - nps.immediate_save
      - nps.numeric_saved_state
      - nps.optional_details
      - nps.offline_idempotency
      - nps.page_revision
      - auth.browser_identity
      - auth.android_identity
      - auth.iphone_supported_identity
      - auth.yandex_identity
      - auth.unverified_ineligible
      - pwa.android_relaunch
      - pwa.iphone_home_screen
      - use.share
      - use.calendar
      - use.not_interested
      - use.for_me
      - artifacts.exact_collection
      - artifacts.server_receipt
      - artifacts.threshold
      - stats.queryable
      - stats.no_pii
      - raffle.chances
      - raffle.rules_versioned
      - raffle.dry_draw
      - release.full_rehearsal

  expand_to_80:
    required:
      - seed
      - operations.no_mass_p0
      - operations.feedback_queue_manageable
      - stats.counts_consistent

  expand_to_200:
    required:
      - expand_to_80
      - auth.cap_boundary
      - artifacts.receipt_integrity
      - raffle.snapshot_rehearsal

