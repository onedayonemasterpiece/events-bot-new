schema_version: 2
contract_id: private-events-mcp-event-operations-v2
status: to_be_release_blocking
canonical_doc: docs/operations/private-events-mcp-event-operations-to-be.md
audit_doc: docs/reports/private-events-mcp-event-operations-to-be-audit-20260902.md
owner: events-bot-new

release_policy:
  ci_required: true
  every_scenario_id_must_map_to_automated_test: true
  missing_mapping_blocks_merge: true
  isolated_live_acceptance_required: true
  production_provider_targets_forbidden: true
  provider_calls_forbidden_in_unit_and_integration: true
  outcome_unknown_may_not_be_retried_blindly: true
  docs_runtime_tools_list_and_tests_must_match: true

layers:
  unit: pure schemas, normalization, fact comparison and policy
  integration: temp SQLite with real application services and Smart Update facade
  protocol: MCP tools, OAuth resources, scopes, idempotency and tenant policy
  worker: JobOutbox claim, supersession, reconciliation and fake providers
  render: deterministic lifecycle-notice asset generation
  site: static projection and public event UI
  isolated_live: real MCP/auth/queue/worker path on private test destinations

invariants:
  - Every canonical create passes full Smart Update.
  - Every reschedule, postpone and cancellation targets an explicit event_id.
  - Exact or generated public text conflicting with accepted facts is never committable.
  - Organizer rationale is durable and private unless a separate public_notice is supplied.
  - Event changes have append-only before and after structured evidence.
  - Publication age and applied revision come from authoritative publication receipts.
  - Old jobs cannot publish a stale event revision.
  - Partner rows are tenant-filtered before serialization.
  - Lifecycle notices and badges use the existing JobOutbox and Event Media boundaries.

