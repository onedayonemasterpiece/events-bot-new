<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Prelaunch mosaic prototype</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="scene">
      <div class="background"><img src="../../../../../../site/public/assets/pwa/announcements-brand-v2-512.png" alt=""></div>
      <div class="mosaic" id="mosaic" aria-hidden="true"></div>
      <div class="atmosphere" aria-hidden="true"></div>
      <div class="foreground">
        <header><span class="mini"></span><b>Полюбить<br>Калининград<br>Анонсы</b></header>
        <section><h1>Запуск 1 сентября</h1><p>Персонализированный сервис анонсов и навигатор по культурным и просветительским событиям Калининградской области</p></section>
        <form onsubmit="event.preventDefault()"><label>Напомнить о запуске</label><div><input type="email" placeholder="E-mail"><button>Напомнить о запуске</button></div></form>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
