mode: worktree_worker_then_serial_integrator
repo: onedayonemasterpiece/events-bot-new
base_ref: origin/main
base_sha: 384f58166cb3f9cd6095564da6a8fc02003e8167
base_branch: main
integration_branch: integration/private-events-mcp-universal-social
global_constraints:
  - no production deploy, restart, or secret mutation during implementation
  - preserve current ChatGPT and Codex OAuth resource isolation
  - Codex retains exactly seven event/incident/operations tools and no social provider scopes
  - ChatGPT receives a broad analyst/copywriter/editor social workspace
  - no raw provider method-name passthrough; high-level tools must still cover real workflows
  - TELEGRAM_AUTH_BUNDLE_EVENTS_BOT_MCP remains the only Telegram role for this MCP
  - secrets, sessions, access tokens, raw provider errors, and private target internals never enter Git or tool output
  - code changes require canonical docs and CHANGELOG Unreleased sync
  - targeted editorial sampling is bounded to one resolved target and at most 80 items; no background harvesting or durable content index
  - Telegram/VK AI read features require an explicit per-target consent/purpose policy before production enablement
verification_owner: root integrator
stop_conditions:
  - current production MCP health or active user request regresses
  - provider capability requires an unavailable credential scope or unsupported provider contract
  - any lane would need to reuse E2E or S22 Telegram sessions
  - destructive live E2E lacks explicit per-action operator approval
requirements:
  R01: Telegram dialog/channel/Saved history and keyword/global search over every entity accessible to the dedicated session
  R02: Telegram target resolution plus Saved Messages, user DMs, channel/group publication, replies/comments/reactions, rich formatting, custom emoji, media/albums, forward/edit/delete, drafts and scheduling
  R03: Telegram stories, story/media lifecycle, channel/message/story statistics and similar-channel recommendations
  R04: VK user/group/wall/newsfeed/message reading, keyword search and community discovery for every surface allowed by the configured credential
  R05: VK target resolution plus user/community messages, wall/community publication, comments/reactions, rich text, media/albums/video, edit/delete and scheduling
  R06: VK stories, story/media lifecycle, community/post/story statistics and related-community discovery
  R07: ChatGPT social catalog, granular scopes, dynamic target descriptors, preparation/approval/commit receipts, idempotency, audit, rate/egress/media budgets and truthful annotations
  R08: Preserve Codex event/incident MCP behavior and seven-tool read-only catalog; Codex uses local Telegram/VK tools instead of social MCP
  R09: Fake-provider contract tests, OAuth/catalog isolation, full MCP suite, CI gate, non-destructive live E2E and webhook/health regression checks
  R10: Canonical docs, env/credential generator, connection instructions, rollout/rollback and production acceptance receipts
  R11: Bounded editorial sample of 50-80 posts from one explicitly resolved channel/community for tone, topics and description drafting; no mass collection
lanes:
  - id: L0-core-contract
    role: worker
    requirement_ids: [R07, R08, R11]
    target: provider-neutral workspace contracts, tool catalog, target descriptors, grants, approvals, budgets and OAuth visibility
    depends_on: []
    execution_mode: serial_after_read_only_mapping
    branch: agent/mcp-universal-social/core-contract
    worktree: /home/dev/.codex/worktrees/events-bot-new/mcp-universal-social-core
    writable_files:
      - private_events_mcp/social_workspace.py
      - private_events_mcp/access_policy.py
      - private_events_mcp/protocol.py
      - private_events_mcp/server.py
      - private_events_mcp/auth_store.py
      - private_events_mcp/config.py
    forbidden_files: [main_part2.py, private_events_mcp_provider_adapters.py, docs, CHANGELOG.md]
    expected_output: committed provider-neutral contract and focused core tests
    verification_scope: targeted
    effort: high
    status: planned
  - id: L1-telegram-workspace
    role: worker
    requirement_ids: [R01, R02, R03]
    target: comprehensive Telethon adapter behind the stable workspace contract
    depends_on: [L0-core-contract]
    execution_mode: parallel_after_dependency
    branch: agent/mcp-universal-social/telegram
    worktree: /home/dev/.codex/worktrees/events-bot-new/mcp-universal-social-telegram
    writable_files:
      - private_events_mcp_telegram_adapter.py
      - tests/test_private_events_mcp_telegram_workspace.py
    forbidden_files: [private_events_mcp/social_workspace.py, private_events_mcp/oauth.py, main_part2.py, docs, CHANGELOG.md]
