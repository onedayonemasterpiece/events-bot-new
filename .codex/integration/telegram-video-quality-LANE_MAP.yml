global_constraints:
  - Analyze only posts with at least one confirmed extracted event.
  - Analyze only videos smaller than 10 MB.
  - All Gemini calls use GoogleAIClient with Supabase reserve/finalize; no bypass.
  - Dedicated normal key pool with safety margins; no unrelated key widening.
  - Never rescan a sha256 with cached analysis, including rejected videos.
  - Upload accepted videos only to Yandex CDN with content-addressed keys.
  - No static-site UI in this project; export contract only.
verification_owner: /root
stop_conditions:
  - missing strict limiter registry members
  - unavailable Yandex credentials
  - concurrent TELEGRAM_AUTH_BUNDLE_S22 remote run
