global_constraints:
  - preserve existing eventsBot endpoint, OAuth identity/resource/signing state and connector name
  - fileParams-only ingress; no path, arbitrary URL, base64, direct Telethon acceptance, or new connector
  - Telegram send_message only; exactly one document; no mixed media
  - source default off; exact-main deploy; live ChatGPT upload acceptance required
  - never expose signed URL, file_id, original name/path, access hash/native ids, tokens, or provider kwargs
