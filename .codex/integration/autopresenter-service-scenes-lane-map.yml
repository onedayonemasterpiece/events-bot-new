global_constraints:
  - Preserve accepted seven-scene behavior and visuals unless a new explicit correction targets them.
  - Freeze accepted scenes by contract; use targeted tests during iteration and one final full regression gate.
  - Keep one persistent Chromium context/page; only Shutdown may close it.
  - Add explicit scenes only; no generic DSL/editor or new infrastructure.
  - Use the existing Fly app and existing Yandex CDN resources.
  - Never modify tools/autopresenter/m0/**.
  - Source scenario document remains user-authored; append only the requested consolidated Telegram requirements section.
verification_owner: INT
stop_conditions:
  - A change would require new production infrastructure or destructive data changes.
  - Approved Telegram E2E session is unavailable.
  - A requested dynamic scene cannot be implemented without an unapproved security/auth boundary.
requirements:
  - id: R01
    text: Analyze Telegram remarks around message 803, consolidate actionable requirements at the bottom of scenario-30072026-base.md, and retain message traceability.
  - id: R02
    text: Implement an agreement/freeze principle so accepted scenes are not redesigned or fully retested on each draft iteration.
  - id: R03
    text: Make intro typing behavior match the historical Hero Talk more closely without redesigning accepted composition/content.
  - id: R04
    text: Replace the demonstrated live-site target with the focus-group site version represented by the supplied invitation preview URL.
  - id: R05
    text: Add the kinetic Announcements wordmark scene with exaggerated stretched o and ease-in-out settling.
  - id: R06
    text: Add the three user-needs presentation beats with animated share and calendar icons.
  - id: R07
    text: Add medallion explanation plus one real desktop and one real mobile medallion example.
  - id: R08
    text: Add the typed Maxim joke beat with a seven-second pause and follow-up line.
  - id: R09
    text: Add the Smart Search concept and a phone-search demo whose query is entered and confirmed from the PWA control.
  - id: R10
    text: Add presentation beats for failure, taste, feedback, focus group, NPS, and future celebrity-like capability.
  - id: R11
    text: Extend explicit runtime/PWA/Windows contracts for the new service presentation while preserving single-window lifecycle.
  - id: R12
    text: Optimize verification: targeted new-scope tests during iteration, immutable accepted-scene freeze checks, then one final full build/E2E before handoff.
  - id: R13
    text: Stabilize the PWA status/detail geometry during polling.
  - id: R14
    text: Split lecture into seven separately controlled held scenes.
  - id: R15
    text: Add sticky elapsed/countdown timing and periodic intro countdown copy.
  - id: R16
    text: Vary lecture layouts/themes and make the Znanie mark transparent and contrast-aware.
  - id: R17
    text: Preserve space for meaning and make desktop live demonstrations meaning-first and two-phase.
