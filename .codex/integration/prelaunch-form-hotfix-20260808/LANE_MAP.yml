    depends_on: [L5-implementation]
    execution_mode: serial_after_dependency
    branch: integration/prelaunch-form-hotfix-20260808
    worktree: /dev/shm/prelaunch-form-integration
    writable_files:
      - integration resolutions and reports
    forbidden_files:
