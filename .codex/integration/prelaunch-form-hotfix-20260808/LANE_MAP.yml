    role: planner
    requirement_ids: [R1]
    target: production browser Network/console and root-cause evidence
    depends_on: []
    execution_mode: parallel
    branch: null
    worktree: null
    writable_files: []
    forbidden_files: ['**/*']
    expected_output: redacted reproduction and actual failing boundary
    verification_scope: inspection_only
    effort: medium
    status: completed
  - id: L2-protected-db-audit
    role: planner
    requirement_ids: [R4]
    target: production Supabase catalog and masked record read
    depends_on: []
    execution_mode: parallel
    branch: null
    worktree: null
    writable_files: []
    forbidden_files: ['**/*']
    expected_output: masked operator evidence and safe SQL
    verification_scope: inspection_only
    effort: high
    status: completed
  - id: L3-release-map
    role: planner
    requirement_ids: []
    target: release ancestry and GitHub Actions mapping
    depends_on: []
    execution_mode: parallel
    branch: null
    worktree: null
    writable_files: []
    forbidden_files: ['**/*']
    expected_output: main-based release path
    verification_scope: inspection_only
    effort: high
    status: completed
  - id: L4-incident-map
    role: reviewer
    requirement_ids: []
    target: incident contract and regression checklist
    depends_on: []
    execution_mode: parallel
    branch: null
    worktree: null
    writable_files: []
    forbidden_files: ['**/*']
    expected_output: incident record requirements
    verification_scope: inspection_only
    effort: high
    status: completed
  - id: L5-implementation
    role: worker
    requirement_ids: [R2, R3]
    target: main-based prelaunch runtime reconciliation, RPC/client fix, tests, docs, incident, release control
    depends_on: [L1-production-reproduction, L2-protected-db-audit, L3-release-map, L4-incident-map]
    execution_mode: serial_after_dependency
    branch: agent/prelaunch-form-hotfix/l5-implementation
    worktree: /dev/shm/prelaunch-form-l5
    writable_files:
      - site/src/components/PrelaunchPage.astro
