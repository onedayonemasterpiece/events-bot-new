mode: serial_integrator
repo: onedayonemasterpiece/events-bot-new
base_ref: origin/main
base_sha: 60eda72a497042c68ab86a1d56dcca2703833398
base_branch: main
integration_branch: integration/prelaunch-form-hotfix-20260808
global_constraints:
  - form-only behavior; no visual/background/SEO/GEO changes
  - no full emails in GitHub logs or artifacts
  - existing personalization table and RPC only
  - production release source must be origin/main
verification_owner: /root
stop_conditions:
  - unmasked customer email would be emitted
  - production tree is dirty or deploy SHA is not exact origin/main
  - visual/background/SEO diff is detected
lanes:
