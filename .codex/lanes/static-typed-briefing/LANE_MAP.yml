    requirement: Scope only to home/general listing lab; no event detail, production routes, deploy.
    primary_lane: lab_ui
  - id: R07
    requirement: Add bounded telemetry contract for briefing and downstream discovery events.
    primary_lane: telemetry_review
  - id: R08
    requirement: Primary metric event_detail_open / eligible_session.
    primary_lane: telemetry_review
  - id: R09
    requirement: Split acceptance into 8 P0 blockers and P1/P2 appendix.
    primary_lane: docs_integration
  - id: R10
    requirement: Commit consultation provenance with prompts, model/version, input SHA, output hashes, decision trace and durable artifact location.
    primary_lane: docs_integration
