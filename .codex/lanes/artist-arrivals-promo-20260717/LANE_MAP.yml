global_constraints:
  - Preserve the dirty primary checkout; all writes happen in the integration worktree.
  - LLM-first semantic decisions; deterministic matching is candidate recall and safety validation only.
  - Public locality and physical-arrival claims require row-level source evidence.
  - No production mutation, publication, deployment, or paid image generation without an explicit later release gate.
  - Store research/run outputs under artifacts/codex and never commit them.
verification_owner: root integrator, followed by an independent merge-review lane
stop_conditions:
  - A locality claim cannot be grounded in current row-level evidence.
  - Production schema or publisher changes cannot be isolated from unrelated dirty work.
  - A public card would need an unlicensed or unrelated person image.
requirements:
  R01: Decide compact/ecological JSON versus YDB storage and document the decision.
  R02: Discover and evidence Kaliningrad-region artists/celebrities from existing events so local people never trigger visiting-artist promotion.
  R03: Identify current future foreign and non-local Russian arrivals and provide a preliminary evidence-backed list.
  R04: Build a once-daily, idempotent artist-arrivals manifest with entity/project dedupe and cancellation/source-revision invalidation.
  R05: Release a digest only above a configurable threshold, defaulting to at least 3 distinct artists and 2 distinct projects/visit clusters.
  R06: Produce Telegram RichMessage and VK carousel-ready cards with artist photo, project/date copy, and footer metadata.
  R07: Expose eligible arrivals to the static homepage and Hero Talk without highlighting local artists.
  R08: Model artist-arrival digest and Hero Talk exposure as promo-campaign activity types with independent cooldowns.
