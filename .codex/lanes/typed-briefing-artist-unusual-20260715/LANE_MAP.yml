global_constraints:
  - Read Telegram topic 6 before implementation and again after evidence publication.
  - No paid OpenAI image generation; use existing assets and CSS only.
  - Gemini consultant must be Pro class; preserve exact model/status evidence.
  - Treat the artist workbook as source evidence, never commit the artifact workbook itself.
  - Absence from a local registry is not evidence that an artist is non-local.
  - Code changes require canonical docs and CHANGELOG synchronization.
verification_owner: root integrator
stop_conditions:
  - Telegram E2E human session is unavailable for mandatory mobile review.
  - Neither Gemini Pro nor Opus is available for requested external visual consultation.
  - Workbook provenance or columns are insufficient to make a safe locality claim.
requirements:
