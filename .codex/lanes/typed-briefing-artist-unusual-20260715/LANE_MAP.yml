    requirement: Transform the supplied XLSX artist list into a useful canonical format and document it.
    area: reference data
    likely_files: [docs/reference, docs/features/static-personal-announcements]
    dependencies: []
    conflict_risk: low
    lane: data-product
    parallelizable: true
    done_when: A normalized, provenance-preserving format and conversion path are documented and validated against the workbook.
  - id: R02
    requirement: Use the artist basis to detect artists who are not local.
    area: entity/locality classification
    likely_files: [docs/reference, docs/features/static-personal-announcements]
    dependencies: [R01]
    conflict_risk: medium
    lane: data-product
    parallelizable: true
    done_when: Matching, evidence, confidence, unknown handling, and false-positive guardrails are specified.
  - id: R03
    requirement: Add an automatic digest of artists visiting the region as a useful future function.
    area: product pipeline/backlog
    likely_files: [docs/features/static-personal-announcements, docs/backlog]
    dependencies: [R01, R02]
    conflict_risk: low
    lane: data-product
    parallelizable: true
    done_when: Digest eligibility, grouping, copy, cadence, dedupe, observability, and acceptance criteria are documented.
  - id: R04
    requirement: Obtain a critical agy review of the exact screenshots and visual harmony.
    area: external consultation
    likely_files: [docs/reports/static-typed-briefing-consultation-2026-07-15]
    dependencies: []
    conflict_risk: low
    lane: visual-consultant
    parallelizable: true
    done_when: Exact-state captures receive a Pro-class PASS/FAIL critique with actionable geometry and branding findings.
  - id: R05
    requirement: Correct the hero/media/logo composition shown in the screenshots.
    area: static-site UI/motion
    likely_files: [site/src/pages/lab/briefing/index.astro, site/src/data/briefingLab.ts, site/src/components, tests/playwright/static_briefing_lab.spec.ts, CHANGELOG.md]
    dependencies: [R04]
    conflict_risk: high
    lane: ui-integrator
    parallelizable: false
    done_when: The exact named-person and weather states are visually coherent, the approved logo lockup is restored, tests pass, and mobile evidence is published.
  - id: R06
    requirement: Define a framework that detects truly unusual future events from the event mass.
    area: LLM-first product/data design
    likely_files: [docs/features/static-personal-announcements, docs/llm, docs/backlog]
    dependencies: []
    conflict_risk: medium
    lane: data-product
    parallelizable: true
    done_when: Candidate generation, baselines, adjudication, evidence fields, blockers, thresholds, public-copy rules, and evaluation are specified.
