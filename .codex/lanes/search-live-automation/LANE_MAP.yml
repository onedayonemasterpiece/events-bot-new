global_constraints:
  - Do not merge PR 284; extract only Search journey/adapter/assertion/evidence ideas.
  - Search uses session_fixture; real-mail OTP remains an independent gate.
  - Restricted candidate URL, session, OTP, email, JWT and tokens must never enter git or artifacts.
  - Supabase RLS/auth/schema and target SHA checks fail closed.
  - Production deploy only from clean exact origin/main after merge.
verification_owner: /root
stop_conditions: [secret_or_session_leak, target_sha_mismatch, uncontrolled_provider_cost, migration_or_rls_regression]
requirements:
