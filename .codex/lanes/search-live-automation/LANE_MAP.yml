  R03: Common platform-neutral site/e2e/search harness.
  R04: Registry execution variants and per-variant policies/evidence.
  R05: Server receipt/revision/mode/provider counters/owner RPC/daily canary budget.
  R06: UI assertions for single POST, terminal state, rendered IDs, visibility, scroll/pagination/dedup/cache/validation.
  R07: Android/iOS L2 with fresh per-device session, native keyboard/touch and sanitized evidence.
  R08: Cached/cold/mobile/post-deploy schedules, alert dedupe, stability thresholds and release blocking.
  R09: Live vector-only Search on latest accepted secret/Kaggle target with several queries and exact SHA/revision evidence.
