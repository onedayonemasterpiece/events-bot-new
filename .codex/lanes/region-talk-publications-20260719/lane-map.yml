base_branch: agent/region-talk/R04-live-canary
integration_branch: integration/region-talk-publications-20260719
global_constraints:
  - no crawler or automatic public publishing
  - external research output is untrusted staging evidence
  - preserve social-candidate behavior
  - YDB sidecar only
  - image rights default to link_only
verification_owner: root
stop_conditions:
  - external result can directly enter publication queue
  - source externality or evidence references are unverifiable
  - unrelated dirty work is encountered in the isolated worktree
requirement_matrix:
  - id: R01
    requirement: extend the existing Region Talk concept from nonregional social posts to nonregional editorial and academic publications
    primary_lane: INT
    done_when: the origin model and policy boundary are canonical and do not create a separate channel
  - id: R02
    requirement: provide a broad external web-research prompt that is not limited to named sources
    primary_lane: INT
    done_when: a ready-to-run prompt covers diverse contours, page verification, exclusions, evidence, and uncertainty
  - id: R03
    requirement: define a machine-readable result contract and low-friction import
    primary_lane: INT
    done_when: versioned JSON Schema and fail-closed idempotent staging importer exist
  - id: R04
    requirement: reuse Region Talk evaluation and image-ranking pipeline
    primary_lane: INT
    done_when: staging handoff and safety boundary are specified; automatic consumer remains gated until origin-aware scoring/verifier is released
  - id: R05
    requirement: show publication links and visible scores for human review in the operator chat
    primary_lane: INT
    done_when: candidate rendering exposes source/article links and numeric overall/image/postcardness fields
  - id: R06
    requirement: publish a ranked publication queue on explicit request
    primary_lane: INT
    done_when: read-only one-shot queue rendering is available without mutating sent state
  - id: R07
    requirement: prevent similar publications from appearing next to each other using an anti-vector
    primary_lane: INT
    done_when: compatible BGE vectors drive MMR and an explicit adjacency guard with disclosed fallback
  - id: R08
    requirement: require broad-public interest/science-pop value and produce an outlet overview plus article teaser
    primary_lane: INT
    done_when: contract/prompt separate scientific rigor from reader value and require grounded editorial copy
