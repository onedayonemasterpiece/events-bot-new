global_constraints:
  - Read Telegram topic 6 before implementation and after evidence publication.
  - Preserve the established narrative text anchor; mosaic may add only the paper stripe.
  - Mosaic remains desktop-only; mobile must assign no narrative image source.
  - Use existing event media only; no paid image generation.
  - Preserve source aspect ratio through a cover crop; never stretch the raster to the grid ratio.
  - Code changes require canonical documentation and CHANGELOG synchronization.
verification_owner: root serial integrator
stop_conditions:
  - Approved Telegram human session is unavailable for the mandatory review gate.
  - A source image lacks dimensions or cannot produce a safe cover crop without falling back text-only.
requirements:
  - id: R01
    requirement: Make the far-right mosaic cells fully bright instead of leaving visibly washed-out holes.
    area: final opacity field
    lane: ui-integrator
    done_when: The two rightmost columns are fully opaque in every row and exact screenshots show an intact bright image edge.
  - id: R02
    requirement: Replace the checkerboard-looking final field with a deterministic random-looking distribution.
    area: opacity topology
    lane: ui-integrator
    done_when: The matrix has no alternating row/column parity pattern and has mixed runs/clusters of different lengths.
  - id: R03
    requirement: Remove the overly smooth right-to-left lightening.
    area: opacity topology
    lane: ui-integrator
    done_when: Local reversals and high-contrast pockets interrupt the broad left-side attenuation trend.
  - id: R04
    requirement: Add visual dynamics and drama to reveal and final transparency differences.
    area: motion and composition
    lane: ui-integrator
    done_when: Reveal/exit use irregular clustered beats and the final field spans conspicuously separated opacity bands.
  - id: R05
    requirement: Extend the image farther left so it occupies roughly the right three quarters of the viewport.
    area: viewport composition
    lane: ui-integrator
    done_when: Desktop media shell begins at 25 percent of viewport width within one cell tolerance and ends at the physical right edge.
  - id: R06
    requirement: Stop stretching and distorting images; use an intelligent source-preserving crop.
    area: image rendering
    lane: ui-integrator
    done_when: Runtime dimensions implement cover scaling from naturalWidth/naturalHeight and Playwright proves scaleX equals scaleY.
