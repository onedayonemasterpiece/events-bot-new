mode: full_fanout
repo: /home/dev/projects/events-bot-new
base_ref: origin/main
base_sha: c4b0209ed72d92b162678ad2b40502d891598e12
base_branch: main
integration_branch: integration/current-ui-decoder-v1
integration_worktree: /home/dev/.codex/worktrees/events-bot-new/current-ui-decoder-v1-integration
global_constraints:
  - STOP before merge/split/normalization/tokenization
  - no site/src, Astro, CSS, runtime UI, Penpot, token or component-package mutation
  - keep candidate/current-root identity planes separate
  - source-only and experiment-off never become production-observed
  - no synthetic missing Editorial Collections, Legal or Hero-talk page-end components
  - no full HTML or bearer URLs in artifacts
verification_owner: root integrator plus final acceptance reviewer
stop_conditions:
  - source/build/runtime identity mismatch
  - secret redaction failure
  - unexplained component disposition
  - specimen claimed production-observed without route or controlled evidence
  - candidate contract presented as normative TO-BE
requirements:
  R01: Freeze a compact immutable AS-IS snapshot and verifiable design-system handoff.
  R02: Classify all 107 logical component paths with disposition and reachability status.
  R03: Add state-aware source extraction for visual-contract defaults, unions, branches, flags, state markers, style contexts and overrides.
  R04-T: Build bounded transport state records and controlled specimens.
  R04-M: Build bounded medallion state records and controlled specimens.
  R04-A: Build bounded artifacts/easter-egg state records and controlled specimens.
  R05: Capture component-scoped DOM, computed style, geometry, CSS-variable, accessibility, focus and breakpoint evidence.
  R06: Emit candidate AS-IS contracts without TO-BE decisions.
  R07: Emit reconciliation capsules linking source, specimen, consumer, styles, screenshots, mismatches and conclusion.
  R08: Classify known exceptions, improve evidence provenance, emit Go/No-Go and preserve the normalization STOP.
lanes:
  - id: decoder_core
    role: worker
    requirement_ids: [R01, R02, R03, R05, R08]
    target: Decoder schema, classification, source state extraction, component evidence and compact snapshot outputs.
    depends_on: [decoder_mapper, classification_mapper, handoff_mapper]
    execution_mode: serial_after_dependency
    branch: agent/current-ui-decoder-v1/core
    worktree: /home/dev/.codex/worktrees/events-bot-new/current-ui-decoder-v1-core
    writable_files:
      - scripts/current_ui_resource_graph/decode.mjs
      - scripts/current_ui_resource_graph/graph-lib.mjs
      - scripts/current_ui_resource_graph/v1/**
      - tests/test_current_ui_resource_graph.py
      - .github/workflows/current-ui-resource-graph.yml
      - docs/features/static-site-pages/current-ui-resource-graph.md
      - CHANGELOG.md
      - .codex/lanes/current-ui-decoder-v1-core/RESULTS.md
    forbidden_files: [site/src/**, site/public/**, '**/*.astro', '**/*.css']
    expected_output: committed decoder v1 core and deterministic tests
    verification_scope: full_local
    effort: high
    status: planned
