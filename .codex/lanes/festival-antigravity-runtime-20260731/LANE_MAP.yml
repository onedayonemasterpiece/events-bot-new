integration_branch: integration/festival-antigravity-runtime-20260731
global_constraints:
  - Antigravity is primary for the new non-social contour; Kaggle+Gemma is not touched.
  - Initial runtime remains collect-only and fail-closed; no provider writes Festival/Event/public pages.
  - Every POST interaction uses the shared limiter and a distinct request_uid.
  - Key values, source secrets, raw provider credentials, and local .env files are never committed or logged.
  - LLM semantic decisions remain evidence-backed; deterministic code only validates structure, hashes, references, and safety.
verification_owner: root integrator
stop_conditions:
  - shared limiter cannot prove a reservation for the selected key
  - a key pool member is absent from the registry or secret store
  - provider create succeeds but the interaction handle cannot be persisted
  - live output lacks mandatory semantic checkpoints after bounded recovery
