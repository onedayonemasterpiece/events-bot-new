    requirement: Current non-social URL selection, grouping, source safety, and input fingerprints.
    primary_lane: L02-core
  - id: R03
    requirement: A+B(+C), checkpoints, incomplete recovery, and semantic/provider state separation.
    primary_lane: L04-integrator
  - id: R04
    requirement: Seven-topology, evidence, inventory, and Event-gate validation.
    primary_lane: L02-core
  - id: R05
    requirement: Persistent collect/review/approve/reject workflow and safe queue integration.
    primary_lane: L04-integrator
  - id: R06
    requirement: Bounded live run and debugging with limiter evidence.
    primary_lane: L04-integrator
  - id: R07
    requirement: Tests, documentation, changelog, independent review, and pushed integration state.
    primary_lane: L05-review
