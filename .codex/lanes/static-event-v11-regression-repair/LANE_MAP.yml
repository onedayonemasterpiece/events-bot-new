mode: worktree_worker
repo: /home/dev/projects/events-bot-new
base_ref: origin/main
base_sha: daf1527c
base_branch: main
integration_branch: integration/static-event-v11-regression-repair-20260718
global_constraints:
  - Preserve the accepted v11 event-detail contract across every media family, not only named specimens.
  - Do not touch the public root; publish only a new immutable secret candidate until user acceptance.
  - Keep OCR media uncropped; discard low-quality media only when a better event-local alternative exists.
  - Use the three accepted transport treatments and production-ready deterministic A/B assignment with query override.
  - Update canonical docs, incident record, tests, and CHANGELOG before release.
verification_owner: /root
stop_conditions:
  - Missing source evidence for an event-content mutation.
  - A worker needs to edit another lane's writable scope.
  - Production snapshot or secret-candidate publisher cannot prove root immutability.
