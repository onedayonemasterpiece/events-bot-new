mode: worktree_worker
repo: events-bot-new
base_ref: db98423ba739d6d4b5d2d40f663a67833f2abf1f
base_branch: feature/static-typed-intro-prototype-20260715
integration_branch: feature/static-typed-intro-prototype-20260715
global_constraints:
  - shareable lab preview only; no production homepage integration or rollout
  - no Gemini, personalization, new scenarios, new motion variants, or content platform
  - no remote telemetry; no production navigation link; noindex required
  - preview publication may use a versioned preview prefix only, never the production root
verification_owner: /root
stop_conditions:
  - publication target would overwrite production root or stable production assets
  - real component reuse would couple lab to production writes or user data
  - credentials are unavailable or public URL cannot be verified
requirements:
  - {id: R01, requirement: "One documented reproducible command builds/runs the lab preview.", primary_lane: lab_build}
  - {id: R02, requirement: "Provide a verified preview URL or fully reproducible local preview.", primary_lane: publish_integration}
  - {id: R03, requirement: "Support explicit ?variant=a, ?variant=b, ?variant=c selection.", primary_lane: lab_build}
  - {id: R04, requirement: "All variants use identical events, categories, card sizes, shell, typography and spacing.", primary_lane: lab_build}
  - {id: R05, requirement: "Reuse production components where safe or prove exact dimensional/token equivalence; do not shrink for viewport checks.", primary_lane: lab_build}
  - {id: R06, requirement: "Check all eight scenarios at 320x568, 375x667, 390x844 and 1440x900.", primary_lane: lab_build}
  - {id: R07, requirement: "Assert briefing.scrollHeight <= briefing.clientHeight for the longest scenario.", primary_lane: lab_build}
  - {id: R08, requirement: "Preserve no-JS, reduced motion, pointer/focus/scroll interrupt and bounded local telemetry.", primary_lane: lab_build}
  - {id: R09, requirement: "Keep noindex, no production navigation, no remote telemetry and no production deploy.", primary_lane: publish_integration}
  - {id: R10, requirement: "Allow export of local telemetry log or expose it in moderated-session debug panel.", primary_lane: lab_build}
  - {id: R11, requirement: "Do not add Gemini, personalization, scenarios, motion variants, production integration or platform scope.", primary_lane: publish_integration}
  - {id: R12, requirement: "Document ENOSPC cause, successful lab build command and impact on ordinary production build.", primary_lane: publish_integration}
  - {id: R13, requirement: "Deliver URL, viewport screenshots, launch commands and concise test report.", primary_lane: publish_integration}
