<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090f1f">
  <title>Автопрезентатор — пульт</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090f1f;
      color: #f7f9ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 12% 5%, rgba(92, 112, 255, .24), transparent 35%),
        radial-gradient(circle at 92% 94%, rgba(14, 205, 167, .16), transparent 30%),
        #090f1f;
    }
    main { width: min(100%, 430px); }
    .eyebrow {
      margin: 0 0 10px;
      color: #95a6d7;
      font-size: .75rem;
      font-weight: 760;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(1.8rem, 9vw, 2.7rem); line-height: .98; letter-spacing: -.045em; }
    .lede { margin: 15px 0 24px; color: #b8c3e1; line-height: 1.55; }
    .panel {
      border: 1px solid rgba(164, 180, 230, .2);
      border-radius: 26px;
      padding: 18px;
      background: rgba(17, 26, 51, .82);
      box-shadow: 0 22px 70px rgba(0, 0, 0, .35);
      backdrop-filter: blur(14px);
    }
    .state-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .state-label { color: #95a6d7; font-size: .82rem; }
    #status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .07);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .78rem;
      font-weight: 700;
    }
    #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #77829f; box-shadow: 0 0 0 4px rgba(119,130,159,.12); }
    #status[data-status="idle"]::before, #status[data-status="completed"]::before { background: #23d9ae; box-shadow: 0 0 0 4px rgba(35,217,174,.12); }
    #status[data-status="running"]::before { background: #8e9cff; box-shadow: 0 0 0 4px rgba(142,156,255,.14); animation: pulse 1.2s infinite; }
    #status[data-status="stopping"]::before { background: #ffc65e; }
    #status[data-status="error"]::before { background: #ff6d81; }
    #detail { min-height: 42px; margin: 14px 0 18px; color: #c6cfea; font-size: .9rem; line-height: 1.45; }
    .controls { display: grid; gap: 10px; }
    button {
      appearance: none;
      width: 100%;
      min-height: 54px;
      border: 1px solid rgba(183, 195, 235, .22);
      border-radius: 15px;
      padding: 13px 17px;
      color: #f8faff;
      background: rgba(255,255,255,.055);
      font: inherit;
      font-weight: 720;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    button:hover { border-color: rgba(193, 203, 255, .55); background: rgba(255,255,255,.1); }
    button:active { transform: scale(.985); }
    button:focus-visible { outline: 3px solid #9eabff; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .58; }
    .primary {
      border-color: transparent;
      color: #081225;
      background: linear-gradient(135deg, #c5ccff, #6cf2d1);
      box-shadow: 0 10px 28px rgba(92, 228, 196, .15);
    }
    .primary:hover { border-color: transparent; background: linear-gradient(135deg, #d4d9ff, #83f6da); }
    .secondary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .meta { margin: 14px 2px 0; color: #7381a9; font-size: .72rem; text-align: center; }
    @keyframes pulse { 50% { transform: scale(.72); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Kenig Events · Live control</p>
    <h1>Пульт<br>презентации</h1>
    <p class="lede">Один сценарий. Один настоящий клик. Без лишней магии.</p>
    <section class="panel" aria-labelledby="control-title">
      <div class="state-row">
        <span class="state-label" id="control-title">Статус агента</span>
        <output id="status" data-status="disconnected" aria-live="polite">disconnected</output>
      </div>
      <p id="detail">Подключаемся к relay…</p>
      <div class="controls">
        <button class="primary" type="button" data-action="run">Запустить «Завтра»</button>
        <div class="secondary-row">
          <button type="button" data-action="stop">Стоп</button>
          <button type="button" data-action="reset">Сброс</button>
        </div>
      </div>
      <p class="meta" id="meta">session · local</p>
    </section>
  </main>
  <script>
    const statusNode = document.querySelector('#status');
    const detailNode = document.querySelector('#detail');
    const metaNode = document.querySelector('#meta');
    const buttons = [...document.querySelectorAll('button[data-action]')];
    let posting = false;

    function render(state) {
      statusNode.textContent = state.status;
      statusNode.dataset.status = state.status;
      detailNode.textContent = state.detail || '—';
      const agent = state.agent || {};
      metaNode.textContent = agent.connected
        ? `${agent.id} · sequence ${state.last_sequence}`
        : `agent offline · sequence ${state.last_sequence}`;
    }

    async function readState() {
      try {
        const response = await fetch('/api/state', {cache: 'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render((await response.json()).state);
      } catch (error) {
        render({status: 'disconnected', detail: `Relay недоступен: ${error.message}`, agent: {}, last_sequence: '—'});
      }
    }

    async function issue(action) {
      if (posting) return;
      posting = true;
      buttons.forEach(button => button.disabled = true);
      try {
        const response = await fetch('/api/commands', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action, command_id: crypto.randomUUID()})
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.message || `HTTP ${response.status}`);
        render(payload.state);
      } catch (error) {
        render({status: 'error', detail: error.message, agent: {}, last_sequence: '—'});
      } finally {
        posting = false;
        buttons.forEach(button => button.disabled = false);
      }
    }

    buttons.forEach(button => button.addEventListener('click', () => issue(button.dataset.action)));
    readState();
    setInterval(readState, 800);
  </script>
</body>
</html>
