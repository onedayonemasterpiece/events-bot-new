name: Current UI Behavioral Decoder v1.1 capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BEHAVIOR_SOURCE_SHA: ef7aa62e45c60f7a12da6160f490719c0721ec03
      BEHAVIOR_BASE_MANIFEST_SHA256: f7740f7f533c3f0cda5d4d0b8ebe98b565d7f521368b96462daecbd26522d5cc
      BEHAVIOR_BASE_TREE_SHA: e77fc2457fadfdffb46ed2d90304ebb91e89a715
      BEHAVIOR_DESIGN_REPO_SHA: e9c8ae3cf31f6f44320b50e1bf1eb9f73cb51eb5
      BEHAVIOR_SNAPSHOT_PATH: catalog/component-decoder/decoder-v1-snapshot-20260808T124842-4786ac53bc
    steps:
      - name: Checkout behavioral decoder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout immutable design-system snapshot carrier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: onedayonemasterpiece/lovekgd-design-system
          ref: e9c8ae3cf31f6f44320b50e1bf1eb9f73cb51eb5
          path: _design-system

      - name: Set deterministic paths and initialize failure receipt
        shell: bash
        run: |
          set -euo pipefail
          printf 'BEHAVIOR_EXACT_SOURCE=%s\n' "$RUNNER_TEMP/current-ui-behavioral-exact-source" >> "$GITHUB_ENV"
          printf 'BEHAVIOR_HARNESS=%s\n' "$RUNNER_TEMP/current-ui-behavioral-harness" >> "$GITHUB_ENV"
          printf 'BEHAVIOR_OUTPUT=%s\n' "$GITHUB_WORKSPACE/artifacts/current-ui-behavioral-v1-1/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/current-ui-behavioral-v1-1/$GITHUB_RUN_ID"
          jq -n --arg run_id "$GITHUB_RUN_ID" '{schema_version:"current_ui_behavioral_capture_run_v1_1",status:"WORKFLOW_STARTED",run_id:$run_id}' > "$GITHUB_WORKSPACE/artifacts/current-ui-behavioral-v1-1/$GITHUB_RUN_ID/capture-run-receipt.json"

      - name: Validate immutable v1 and materialize exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _design-system rev-parse HEAD)" = "$BEHAVIOR_DESIGN_REPO_SHA"
          test "$(git -C _design-system rev-parse "HEAD:$BEHAVIOR_SNAPSHOT_PATH")" = "$BEHAVIOR_BASE_TREE_SHA"
          printf '%s  %s\n' "$BEHAVIOR_BASE_MANIFEST_SHA256" "_design-system/$BEHAVIOR_SNAPSHOT_PATH/manifest.json" | sha256sum --check --strict
          git cat-file -e "$BEHAVIOR_SOURCE_SHA^{commit}"
          git worktree add --detach "$BEHAVIOR_EXACT_SOURCE" "$BEHAVIOR_SOURCE_SHA"
          test -z "$(git -C "$BEHAVIOR_EXACT_SOURCE" status --porcelain)"

      - name: Install exact Node and pinned site dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      - name: Install exact site and browser runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$BEHAVIOR_EXACT_SOURCE/site"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          test "$(node -p "require('./node_modules/astro/package.json').version")" = 6.4.8

      - name: Generate deterministic behavioral packets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/current_ui_resource_graph/behavioral-capture.mjs \
            --candidate-repo "$BEHAVIOR_EXACT_SOURCE" \
            --base-snapshot-root "$GITHUB_WORKSPACE/_design-system/$BEHAVIOR_SNAPSHOT_PATH" \
            --node-modules "$BEHAVIOR_EXACT_SOURCE/site/node_modules" \
            --harness-root "$BEHAVIOR_HARNESS" \
            --output "$BEHAVIOR_OUTPUT"

      - name: Validate capture coverage, hashes and STOP boundary
        shell: bash
        run: |
          set -euo pipefail
          supplement="$BEHAVIOR_OUTPUT/supplement"
          capture="$BEHAVIOR_OUTPUT/capture"
          jq -e '.status == "CAPTURE_COMPLETE_NO_GO_PENDING_REVIEW" and .counts.behavior_packets == 50 and .counts.executable_packets == 45 and .counts.explicit_blockers == 5 and .counts.observations == 99 and .counts.rasters == 99 and .production_ui_mutated == false and .immutable_v1_modified == false and .normalization_allowed == false' "$BEHAVIOR_OUTPUT/capture-run-receipt.json" >/dev/null
          jq -e '.status == "partial" and .final_status == "EVIDENCE_COLLECTION_INCOMPLETE" and .counts.plans == 50 and .counts.observations == 99 and .counts.rasters == 99 and .counts.explicit_blockers == 5' "$supplement/receipt.json" >/dev/null
          jq -e -s 'length == 50 and (map(select(.capture_status == "explicit-blocker")) | length) == 5 and all(.[]; .decision == "NOT_MERGED" and .normalization_allowed == false)' "$supplement/behavior-specimen-plan.jsonl" >/dev/null
          jq -e -s 'length == 99 and all(.[]; .capture_status == "captured" and .review_status == "pending-human-full-resolution-review" and .production_state_claimed == false and .normalization_allowed == false and .decision == "NOT_MERGED" and .screenshot.perceptually_stable == true)' "$supplement/behavior-specimen-observations.jsonl" >/dev/null
          jq -e -s '(map(select(.ratios | index("4:5"))) | length) == 1 and (map(select(.ratios | index("5:4"))) | length) == 4' "$supplement/behavior-specimen-observations.jsonl" >/dev/null
          test "$(find "$capture/behavior-rasters" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 99
          while IFS= read -r row; do
            path="$(jq -r '.screenshot.path' <<<"$row")"
            expected="$(jq -r '.screenshot.sha256' <<<"$row")"
            test "$(sha256sum "$capture/$path" | cut -d' ' -f1)" = "$expected"
          done < "$supplement/behavior-specimen-observations.jsonl"
          node --input-type=module -e "import {assertBehavioralSupplement} from './scripts/current_ui_resource_graph/v1/behavioral.mjs'; assertBehavioralSupplement(process.argv[1],{allowIncomplete:true});" "$supplement"
          if grep -R -E --include='*.json' --include='*.jsonl' --include='*.md' 'decoder-fixture-public-value|example\.supabase\.co|sb_(secret|publishable)|access_token|refresh_token|authorization["=:]|/_review/' "$BEHAVIOR_OUTPUT"; then
            echo 'Sensitive or fixture credential material survived behavioral evidence redaction' >&2
            exit 1
          fi
          touch "$BEHAVIOR_OUTPUT/.validated"

      - name: Finalize failed receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BEHAVIOR_OUTPUT"
          if [[ ! -f "$BEHAVIOR_OUTPUT/.validated" ]]; then
            jq -n --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{schema_version:"current_ui_behavioral_capture_run_v1_1",status:"FAILED_VALIDATION",run_id:$run_id,run_url:$run_url,final_status:"EVIDENCE_COLLECTION_INCOMPLETE",blockers:["actions-capture-or-validation-failed"]}' > "$BEHAVIOR_OUTPUT/capture-run-receipt.json"
          fi

      - name: Upload capture artifact for mandatory visual review
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-ui-behavioral-decoder-v1-1-capture-${{ github.run_id }}
          path: ${{ env.BEHAVIOR_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
