name: Current UI Behavioral Decoder v1.1 closure capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BEHAVIOR_SOURCE_SHA: ef7aa62e45c60f7a12da6160f490719c0721ec03
      BEHAVIOR_DESIGN_REPO_SHA: f9cb3c931d6f2200f0a4221f5130b3a6299f7005
      BEHAVIOR_PRIOR_SUPPLEMENT_PATH: catalog/component-decoder/behavioral-supplement-v1.1-snapshot-20260808T124842-4786ac53bc
      BEHAVIOR_PRIOR_MANIFEST_SHA256: c6c62cee8bea4e9440ff85bc75c46bc85cf5abf3e2fdcd4c7357c6ece916436f
      BEHAVIOR_IMMUTABLE_V1_PATH: catalog/component-decoder/decoder-v1-snapshot-20260808T124842-4786ac53bc
      BEHAVIOR_IMMUTABLE_V1_TREE: e77fc2457fadfdffb46ed2d90304ebb91e89a715
    steps:
      - name: Checkout closure decoder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout reviewed supplement and immutable v1 carrier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: onedayonemasterpiece/lovekgd-design-system
          ref: f9cb3c931d6f2200f0a4221f5130b3a6299f7005
          path: _design-system

      - name: Initialize deterministic paths and failure receipt
        shell: bash
        run: |
          set -euo pipefail
          printf 'BEHAVIOR_EXACT_SOURCE=%s\n' "$RUNNER_TEMP/current-ui-behavioral-exact-source" >> "$GITHUB_ENV"
          printf 'BEHAVIOR_HARNESS=%s\n' "$RUNNER_TEMP/current-ui-behavioral-closure-harness" >> "$GITHUB_ENV"
          printf 'BEHAVIOR_OUTPUT=%s\n' "$GITHUB_WORKSPACE/artifacts/current-ui-behavioral-v1-1-closure/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/current-ui-behavioral-v1-1-closure/$GITHUB_RUN_ID"
          jq -n --arg run_id "$GITHUB_RUN_ID" '{schema_version:"current_ui_behavioral_closure_capture_run_v1_1",status:"WORKFLOW_STARTED",run_id:$run_id}' > "$GITHUB_WORKSPACE/artifacts/current-ui-behavioral-v1-1-closure/$GITHUB_RUN_ID/closure-capture-receipt.json"

      - name: Validate reviewed baseline, immutable v1 and exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _design-system rev-parse HEAD)" = "$BEHAVIOR_DESIGN_REPO_SHA"
          test "$(git -C _design-system rev-parse "HEAD:$BEHAVIOR_IMMUTABLE_V1_PATH")" = "$BEHAVIOR_IMMUTABLE_V1_TREE"
          printf '%s  %s\n' "$BEHAVIOR_PRIOR_MANIFEST_SHA256" "_design-system/$BEHAVIOR_PRIOR_SUPPLEMENT_PATH/manifest.json" | sha256sum --check --strict
          jq -e '.status == "EVIDENCE_COLLECTION_INCOMPLETE" and .source_sha == "ef7aa62e45c60f7a12da6160f490719c0721ec03" and .human_visual_review.completed == true and .counts.visual_reviews == 124' "_design-system/$BEHAVIOR_PRIOR_SUPPLEMENT_PATH/manifest.json" >/dev/null
          git cat-file -e "$BEHAVIOR_SOURCE_SHA^{commit}"
          git worktree add --detach "$BEHAVIOR_EXACT_SOURCE" "$BEHAVIOR_SOURCE_SHA"
          test -z "$(git -C "$BEHAVIOR_EXACT_SOURCE" status --porcelain)"

      - name: Install exact Node and site/browser runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      - name: Install pinned site dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$BEHAVIOR_EXACT_SOURCE/site"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          test "$(node -p "require('./node_modules/astro/package.json').version")" = 6.4.8

      - name: Execute 293 browser probes and rail keyboard packet
        shell: bash
        run: |
          set -euo pipefail
          node scripts/current_ui_resource_graph/behavioral-closure-capture.mjs \
            --candidate-repo "$BEHAVIOR_EXACT_SOURCE" \
            --prior-supplement "$GITHUB_WORKSPACE/_design-system/$BEHAVIOR_PRIOR_SUPPLEMENT_PATH" \
            --node-modules "$BEHAVIOR_EXACT_SOURCE/site/node_modules" \
            --harness-root "$BEHAVIOR_HARNESS" \
            --output "$BEHAVIOR_OUTPUT"

      - name: Validate terminal coverage, hashes and strict STOP
        shell: bash
        run: |
          set -euo pipefail
          probe="$BEHAVIOR_OUTPUT/probe-runtime"
          supplement="$BEHAVIOR_OUTPUT/supplement"
          jq -e '.status == "CAPTURE_COMPLETE_NO_GO_PENDING_REVIEW" and .counts.terminal_probes == 293 and .counts.pass + .counts.mismatch + .counts.unreachable == 293 and .counts.new_rasters == 10 and .counts.new_reviews == 0 and .production_ui_mutated == false and .immutable_v1_modified == false and .normalization_allowed == false and .decision == "NOT_MERGED"' "$BEHAVIOR_OUTPUT/closure-capture-receipt.json" >/dev/null
          jq -e '.status == "TERMINAL_EVIDENCE_COMPLETE" and .planned_or_unconfirmed == 0 and .blocks_ready == false and .counts.terminal == 293 and .counts.pass + .counts.mismatch + .counts.unreachable == 293 and .counts.rasters == 8' "$probe/breakpoint-probe-receipt.json" >/dev/null
          jq -e -s 'length == 293 and all(.[]; (.terminal_status == "PASS" or .terminal_status == "MISMATCH" or .terminal_status == "UNREACHABLE_WITH_REASON") and .production_state_claimed == false and .normalization_allowed == false and .decision == "NOT_MERGED")' "$probe/breakpoint-probe-terminal.jsonl" >/dev/null
          jq -e '.status == "TERMINAL_EVIDENCE_COMPLETE" and .blocks_ready == false and .home_end == "non-required-nonblocking-observed-enhancement" and .rasters == 2' "$probe/rail-keyboard-receipt.json" >/dev/null
          jq -e '.status == "partial" and .final_status == "EVIDENCE_COLLECTION_INCOMPLETE" and .counts.terminal_probes == 293 and .counts.new_rasters == 10 and .counts.new_reviews == 0 and (.blockers | length) == 0' "$supplement/receipt.json" >/dev/null
          jq -e -s 'length == 293 and all(.[]; .blocks_ready == false and (.coverage_status == "runtime-probe-pass" or .coverage_status == "runtime-probe-mismatch" or .coverage_status == "unreachable-with-reason"))' "$supplement/breakpoint-and-container-matrix.jsonl" >/dev/null
          test "$(find "$probe/breakpoint-probe-rasters" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 8
          test "$(find "$probe/rail-keyboard-rasters" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 2
          node scripts/current_ui_resource_graph/v1/behavioral/closure-validate.mjs "$supplement" --allow-incomplete
          if grep -R -E --include='*.json' --include='*.jsonl' --include='*.md' 'decoder-fixture-public-value|example\.supabase\.co|sb_(secret|publishable)_[A-Za-z0-9_-]{12,}|Authorization[[:space:]]*:[[:space:]]*Bearer[[:space:]]+[^[:space:]]+|/_review/[A-Za-z0-9_-]{12,}' "$BEHAVIOR_OUTPUT"; then
            echo 'Sensitive material survived closure evidence redaction' >&2
            exit 1
          fi
          test -z "$(git -C "$BEHAVIOR_EXACT_SOURCE" status --porcelain)"
          touch "$BEHAVIOR_OUTPUT/.validated"

      - name: Finalize failed receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BEHAVIOR_OUTPUT"
          if [[ ! -f "$BEHAVIOR_OUTPUT/.validated" ]]; then
            jq -n --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{schema_version:"current_ui_behavioral_closure_capture_run_v1_1",status:"FAILED_VALIDATION",run_id:$run_id,run_url:$run_url,final_status:"EVIDENCE_COLLECTION_INCOMPLETE",blockers:["actions-closure-capture-or-validation-failed"]}' > "$BEHAVIOR_OUTPUT/closure-capture-receipt.json"
          fi

      - name: Upload closure evidence for mandatory full-resolution review
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-ui-behavioral-decoder-v1-1-closure-${{ github.run_id }}
          path: ${{ env.BEHAVIOR_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
