name: Static Site QA command gateway

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: static-site-qa-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/qa ') }}
    runs-on: ubuntu-24.04
    outputs:
      scenario: ${{ steps.parse.outputs.scenario }}
      platform: ${{ steps.parse.outputs.platform }}
      target_url: ${{ steps.parse.outputs.target_url }}
      expected_repo_sha: ${{ steps.parse.outputs.expected_repo_sha }}
      mode: ${{ steps.parse.outputs.mode }}
      duplicate: ${{ steps.dedupe.outputs.duplicate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify actor has write permission
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)"
          case "$permission" in admin|maintain|write) ;; *) echo "Actor permission rejected" >&2; exit 1;; esac
      - name: Parse and validate exact command
        id: parse
        working-directory: site
        env:
          STATIC_SITE_QA_CONTROL_ISSUE_NUMBER: ${{ vars.STATIC_SITE_QA_CONTROL_ISSUE_NUMBER }}
        run: node scripts/static-site-qa-command.mjs
      - name: Deduplicate a command posted while its identical run was active
        id: dedupe
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          comments_file="${RUNNER_TEMP}/static-site-qa-comments.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments?per_page=100" > "$comments_file"
          STATIC_SITE_QA_COMMENTS_FILE="$comments_file" node scripts/static-site-qa-dedupe.mjs
          if grep -qx 'duplicate=true' "$GITHUB_OUTPUT"; then
            prior_run_id="$(sed -n 's/^prior_run_id=//p' "$GITHUB_OUTPUT")"
            gh issue comment "$ISSUE" --body "DEDUPLICATED · ${{ steps.parse.outputs.scenario }} · identical request was posted while run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${prior_run_id} was active · no new OTP run created"
          fi
      - name: Verify SHA exists in trusted repository
        if: ${{ steps.dedupe.outputs.duplicate != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.parse.outputs.expected_repo_sha }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/commits/${SHA}" --silent
      - name: Acknowledge safe request
        if: ${{ steps.dedupe.outputs.duplicate != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          PLATFORM: ${{ steps.parse.outputs.platform }}
          SHA: ${{ steps.parse.outputs.expected_repo_sha }}
          TARGET_ORIGIN: ${{ steps.parse.outputs.target_origin }}
          TARGET_PATH: ${{ steps.parse.outputs.target_path }}
          SCENARIO: ${{ steps.parse.outputs.scenario }}
        run: |
          gh issue comment "$ISSUE" --body "ACCEPTED · ${SCENARIO} · ${PLATFORM} · ${SHA} · ${TARGET_ORIGIN}${TARGET_PATH} · run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  run:
    if: ${{ needs.prepare.outputs.duplicate != 'true' }}
    needs: prepare
    uses: ./.github/workflows/external-focus-email-otp.yml
    with:
      target_url: ${{ needs.prepare.outputs.target_url }}
      expected_repo_sha: ${{ needs.prepare.outputs.expected_repo_sha }}
      platform: ${{ needs.prepare.outputs.platform }}
      scenario: ${{ needs.prepare.outputs.scenario }}
    secrets: inherit

  terminal:
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.duplicate != 'true' }}
    needs: [prepare, run]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download sanitized QA summaries
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: static-site-qa-focus-otp-*
          path: ${{ runner.temp }}/static-site-qa-artifacts
      - name: Build strict terminal receipt from qa-summary
        working-directory: site
        env:
          STATIC_SITE_QA_ARTIFACT_ROOT: ${{ runner.temp }}/static-site-qa-artifacts
          STATIC_SITE_QA_SCENARIO: ${{ needs.prepare.outputs.scenario }}
          STATIC_SITE_QA_PLATFORM: ${{ needs.prepare.outputs.platform }}
          STATIC_SITE_QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATIC_SITE_QA_TERMINAL_BODY: ${{ runner.temp }}/static-site-qa-terminal.md
        run: node scripts/static-site-qa-terminal.mjs
      - name: Publish terminal evidence receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/static-site-qa-terminal.md"
