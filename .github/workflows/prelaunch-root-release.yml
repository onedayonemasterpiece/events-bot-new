name: Prelaunch production root release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-limiter-supabase:
    strategy:
      fail-fast: false
      matrix:
        scope: [production, production-readonly, volunteer-monitor-canary, region-talk-ydb-import]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ matrix.scope }}
    env:
      EXPECTED_PROJECT_REF: epyznmylqmchteykjsqj
      SCOPE: ${{ matrix.scope }}
      SUPABASE_ACCESS_TOKEN_CANDIDATE: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_API_TOKEN_CANDIDATE: ${{ secrets.SUPABASE_API_TOKEN }}
      SUPABASE_CLI_ACCESS_TOKEN_CANDIDATE: ${{ secrets.SUPABASE_CLI_ACCESS_TOKEN }}
      SUPABASE_MANAGEMENT_API_TOKEN_CANDIDATE: ${{ secrets.SUPABASE_MANAGEMENT_API_TOKEN }}
      SUPABASE_MANAGEMENT_TOKEN_CANDIDATE: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      SUPABASE_PAT_CANDIDATE: ${{ secrets.SUPABASE_PAT }}
      SUPABASE_PERSONAL_ACCESS_TOKEN_CANDIDATE: ${{ secrets.SUPABASE_PERSONAL_ACCESS_TOKEN }}
      SUPABASE_TOKEN_CANDIDATE: ${{ secrets.SUPABASE_TOKEN }}
      SUPABASE_DB_PASSWORD_PRESENT: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DATABASE_URL_PRESENT: ${{ secrets.SUPABASE_DATABASE_URL }}

    steps:
      - name: Resolve environment Supabase credential
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          source_name=''
          token=''
          for name in             SUPABASE_ACCESS_TOKEN_CANDIDATE             SUPABASE_API_TOKEN_CANDIDATE             SUPABASE_CLI_ACCESS_TOKEN_CANDIDATE             SUPABASE_MANAGEMENT_API_TOKEN_CANDIDATE             SUPABASE_MANAGEMENT_TOKEN_CANDIDATE             SUPABASE_PAT_CANDIDATE             SUPABASE_PERSONAL_ACCESS_TOKEN_CANDIDATE             SUPABASE_TOKEN_CANDIDATE
          do
            value="${!name:-}"
            if [[ -n "$value" ]]; then source_name="$name"; token="$value"; break; fi
          done
          echo "SCOPE=$SCOPE"
          [[ -n "${SUPABASE_DB_PASSWORD_PRESENT:-}" ]] && echo "DB_PASSWORD_PRESENT=true" || echo "DB_PASSWORD_PRESENT=false"
          [[ -n "${SUPABASE_DATABASE_URL_PRESENT:-}" ]] && echo "DATABASE_URL_PRESENT=true" || echo "DATABASE_URL_PRESENT=false"
          if [[ -z "$token" ]]; then
            echo "TOKEN_PRESENT=false"
            exit 0
          fi
          echo "::add-mask::$token"
          echo "TOKEN_PRESENT=true"
          echo "TOKEN_SOURCE=$source_name"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Verify visible projects when token exists
        if: ${{ steps.auth.outputs.token != '' }}
        env:
          SUPABASE_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $SUPABASE_TOKEN"             -H "Accept: application/json"             https://api.supabase.com/v1/projects > /tmp/projects.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path('/tmp/projects.json').read_text())
          safe=[{'id':r.get('id') or r.get('ref'),'name':r.get('name'),'region':r.get('region'),'status':r.get('status')} for r in rows]
          print(json.dumps({'scope':os.environ['SCOPE'],'projects':safe},ensure_ascii=False,sort_keys=True))
          expected=os.environ['EXPECTED_PROJECT_REF']
          print('LIMITER_PROJECT_VISIBLE=' + ('true' if any(str(r.get('id') or r.get('ref'))==expected for r in rows) else 'false'))
          PY
          rm -f /tmp/projects.json
