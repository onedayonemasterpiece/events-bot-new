name: Events MCP integration checkpoint

# Temporary deterministic Git executor for the ChatGPT-authored integration.
# No agents, secrets, production destinations, merge to main or deployment.
on:
  push:
    branches: [feature/events-mcp-owner-create-r1]
    paths: [.github/workflows/events-mcp-source-checkpoint.yml]

permissions:
  contents: write

jobs:
  integrate-r1:
    if: github.ref == 'refs/heads/feature/events-mcp-owner-create-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Integrate exact reviewed R0 and preserve both changelog additions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=100 origin feature/events-mcp-queue-observability-r0
          test "$(git rev-parse origin/feature/events-mcp-queue-observability-r0)" = 9dd31c5ed36c7c20da2dd8fa0480e1cb771eadf6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit 9dd31c5ed36c7c20da2dd8fa0480e1cb771eadf6 || test "$(git diff --name-only --diff-filter=U)" = CHANGELOG.md
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('CHANGELOG.md')
          p.write_text(''.join(line for line in p.read_text().splitlines(keepends=True) if not line.startswith(('<<<<<<< ', '=======', '>>>>>>> '))))
          expected = {
              'CHANGELOG.md': '0b6cc21eb399a384874eeeac95a14359d0ca8e40b1f866969408c6269c9a0114',
              'docs/operations/private-events-mcp.md': 'f7a675efa4bcebee980e8459742176c99204e3dc27b1619e8b91684d7d374466',
              'private_events_mcp/config.py': 'a96bd7c4f85233c87a28cd7b5e520b8cd705941f21a3f1e9b2c153e15f56dbf1',
              'private_events_mcp/server.py': '7ef05d21e12eb9f8272cf02dc5829c26bfc9474a10a78952cd577ceb0ba9d44b',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
          git add -- CHANGELOG.md
          git diff --check --cached
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exact integrated application source
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_private_events_mcp_event_create.py tests/test_private_events_mcp_queue_observability.py
      - name: Save integration merge only to the existing R1 branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git commit -m 'merge(mcp-r1): preserve current main and R0 with verified creation contracts'
          git push origin HEAD:refs/heads/feature/events-mcp-owner-create-r1
          mkdir -p artifacts/events-mcp-integration
          git show -s --format=fuller HEAD > artifacts/events-mcp-integration/commit.txt
          git diff --stat 9dd31c5ed36c7c20da2dd8fa0480e1cb771eadf6 HEAD > artifacts/events-mcp-integration/diff-stat.txt
          sha256sum CHANGELOG.md docs/operations/private-events-mcp.md private_events_mcp/config.py private_events_mcp/server.py > artifacts/events-mcp-integration/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: events-mcp-r1-integration-${{ github.sha }}
          path: artifacts/events-mcp-integration/
          retention-days: 7
          if-no-files-found: error
