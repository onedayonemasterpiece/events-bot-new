name: Diagnose Region Talk terminal remediation on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/region-talk-research-remediation-trigger-20260803.yml'
      - '.github/workflows/region-talk-research-remediation-export-20260802.yml'
      - '.tmp/region-talk-terminal-remediation/**'

permissions:
  contents: read

concurrency:
  group: region-talk-terminal-remediation-diagnostic-20260803
  cancel-in-progress: false

jobs:
  diagnose:
    name: Materialize ephemerally and report importer rejections
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/region-talk-research-terminal-remediation-20260802
          fetch-depth: 0

      - name: Extract embedded materializer and data
        shell: bash
        run: |
          set -euo pipefail
          source_workflow=.github/workflows/region-talk-research-remediation-export-20260802.yml
          script_b64="$(sed -n "s/^[[:space:]]*SCRIPT_B64='\(.*\)'$/\1/p" "$source_workflow")"
          data_b64="$(sed -n "s/^[[:space:]]*DATA_B64='\(.*\)'$/\1/p" "$source_workflow")"
          test -n "$script_b64"
          test -n "$data_b64"
          printf '%s' "$script_b64" | base64 --decode > /tmp/apply_rt_final.original.py
          printf '%s' "$data_b64" | base64 --decode > .tmp/region-talk-terminal-remediation/data.bin
          python -m py_compile /tmp/apply_rt_final.original.py

      - name: Disable only the terminal importer assertion for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('/tmp/apply_rt_final.original.py')
          target = Path('/tmp/apply_rt_final.py')
          tree = ast.parse(source.read_text(encoding='utf-8'))
          removed = 0

          class DiagnosticTransformer(ast.NodeTransformer):
              def visit_Assert(self, node):
                  global removed
                  message = node.msg.value if isinstance(node.msg, ast.Constant) else ''
                  if message == 'terminal payloads fail current importer semantic validation':
                      removed += 1
                      return ast.copy_location(
                          ast.Expr(
                              value=ast.Call(
                                  func=ast.Name(id='print', ctx=ast.Load()),
                                  args=[ast.Constant(value='diagnostic: terminal importer assertion deferred')],
                                  keywords=[],
                              )
                          ),
                          node,
                      )
                  return node

          tree = DiagnosticTransformer().visit(tree)
          ast.fix_missing_locations(tree)
          if removed != 1:
              raise SystemExit(f'expected exactly one terminal importer assertion, found {removed}')
          target.write_text(ast.unparse(tree) + '\n', encoding='utf-8')
          PY
          python -m py_compile /tmp/apply_rt_final.py

      - name: Materialize into ephemeral checkout
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_rt_final.py \
            --repo "$PWD" \
            --archive "$PWD/.tmp/region-talk-terminal-remediation/part-00" \
            --blob "$PWD/.tmp/region-talk-terminal-remediation/data.bin"

      - name: Run current importer and emit row-level errors
        id: importer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q jsonschema
          mkdir -p /tmp/rt-remediation-diagnostic
          cp /tmp/apply_rt_final.original.py /tmp/rt-remediation-diagnostic/

          status=0
          while IFS= read -r input_path; do
            name="$(basename "$input_path" .json)"
            report="/tmp/rt-remediation-diagnostic/${name}.validation.json"
            if ! python scripts/region_talk_external_publication_import.py \
              "$input_path" --report "$report"; then
              status=1
            fi
          done < <(find docs/features/region-talk-channel -maxdepth 1 -type f \
            -name 'region-talk-external-research-result-region-talk-external-2026-08-02-*.json' \
            | sort)

          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path('/tmp/rt-remediation-diagnostic').glob('*.validation.json'))
          summary = {'reports': [], 'rejected_total': 0, 'conflict_total': 0}
          for path in reports:
              payload = json.loads(path.read_text(encoding='utf-8'))
              rejected = payload.get('rejected') or []
              conflicts = payload.get('conflicts') or []
              row = {
                  'report': path.name,
                  'request_id': (payload.get('batch') or {}).get('request_id'),
                  'valid_count': len(payload.get('valid_ids') or []),
                  'rejected_count': len(rejected),
                  'conflict_count': len(conflicts),
                  'rejected': rejected,
                  'conflicts': conflicts,
              }
              summary['reports'].append(row)
              summary['rejected_total'] += len(rejected)
              summary['conflict_total'] += len(conflicts)
          out = Path('/tmp/rt-remediation-diagnostic/summary.json')
          out.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

          cp docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-08-02-*.json \
            /tmp/rt-remediation-diagnostic/ 2>/dev/null || true
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload diagnostic reports and generated successors
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: region-talk-terminal-remediation-diagnostic-${{ github.run_id }}
          path: /tmp/rt-remediation-diagnostic
          if-no-files-found: error
          retention-days: 7

      - name: Fail after preserving diagnostics
        if: steps.importer.outputs.status != '0'
        shell: bash
        run: exit 1
