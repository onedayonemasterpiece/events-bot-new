name: Materialize Region Talk terminal remediation on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/region-talk-research-remediation-trigger-20260803.yml'
      - '.github/workflows/region-talk-research-remediation-export-20260802.yml'
      - '.tmp/region-talk-terminal-remediation/**'

permissions:
  contents: write

concurrency:
  group: region-talk-terminal-remediation-materialize-20260803
  cancel-in-progress: false

jobs:
  materialize:
    name: Decode, validate and commit terminal remediation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/region-talk-research-terminal-remediation-20260802
          fetch-depth: 0

      - name: Extract embedded materializer and data
        shell: bash
        run: |
          set -euo pipefail
          source_workflow=.github/workflows/region-talk-research-remediation-export-20260802.yml
          script_b64="$(sed -n "s/^[[:space:]]*SCRIPT_B64='\(.*\)'$/\1/p" "$source_workflow")"
          data_b64="$(sed -n "s/^[[:space:]]*DATA_B64='\(.*\)'$/\1/p" "$source_workflow")"
          test -n "$script_b64"
          test -n "$data_b64"
          printf '%s' "$script_b64" | base64 --decode > /tmp/apply_rt_final.py
          printf '%s' "$data_b64" | base64 --decode > .tmp/region-talk-terminal-remediation/data.bin
          python -m py_compile /tmp/apply_rt_final.py

      - name: Materialize terminal successors and remediation plan
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_rt_final.py \
            --repo "$PWD" \
            --archive "$PWD/.tmp/region-talk-terminal-remediation/part-00" \
            --blob "$PWD/.tmp/region-talk-terminal-remediation/data.bin"

      - name: Validate repository result
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q jsonschema pytest
          pytest -q \
            tests/test_region_talk_external_publication_import.py \
            tests/test_region_talk_external_research_contract.py
          python -m py_compile scripts/region_talk_external_publication_import.py
          git diff --check

      - name: Commit materialized result and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . ':!.codex/**'
          git rm -f \
            .github/workflows/region-talk-research-remediation-export-20260802.yml \
            .github/workflows/region-talk-research-remediation-trigger-20260803.yml
          git rm -rf .tmp/region-talk-terminal-remediation
          git diff --cached --check
          git commit -m 'Finalize Region Talk research terminal decisions'
          git push origin HEAD:agent/region-talk-research-terminal-remediation-20260802

          {
            echo '### Region Talk terminal remediation materialized'
            echo
            echo '- source: embedded checked-in materializer and archive'
            echo '- tests: terminal research contract and importer regression'
            echo '- one-shot workflows and transport removed from final diff'
          } >> "$GITHUB_STEP_SUMMARY"
