name: Apply tile mosaic Blender compatibility fix

on:
  pull_request:
    branches:
      - feature/static-launch-tile-mosaic-20260803
    paths:
      - .github/workflows/tile-mosaic-blender-compat-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tile-mosaic-blender-compat-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout laboratory branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Patch Blender engine compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/tile_mosaic/blender_renderer.py')
          text = path.read_text(encoding='utf-8')
          old = '''    else:\n        scene.render.engine = "BLENDER_EEVEE_NEXT"\n        samples = int(render.get("samples", 64))\n        eevee = getattr(scene, "eevee", None)\n        if eevee is not None:\n            for attribute in ("taa_render_samples", "taa_samples"):\n                if hasattr(eevee, attribute):\n                    setattr(eevee, attribute, samples)\n'''
          new = '''    else:\n        # Blender 4.0 exposes EEVEE as ``BLENDER_EEVEE`` while newer releases\n        # renamed the same renderer to ``BLENDER_EEVEE_NEXT``. Probe the RNA\n        # enum instead of coupling the laboratory to one minor Blender line.\n        eevee_engine = None\n        for candidate in ("BLENDER_EEVEE_NEXT", "BLENDER_EEVEE"):\n            try:\n                scene.render.engine = candidate\n                eevee_engine = candidate\n                break\n            except TypeError:\n                continue\n        if eevee_engine is None:\n            supported = tuple(\n                item.identifier\n                for item in scene.render.bl_rna.properties["engine"].enum_items\n            )\n            raise RuntimeError(\n                "No supported EEVEE render engine is available; "\n                f"Blender reports {supported!r}"\n            )\n        samples = int(render.get("samples", 64))\n        eevee = getattr(scene, "eevee", None)\n        if eevee is not None:\n            for attribute in ("taa_render_samples", "taa_samples"):\n                if hasattr(eevee, attribute):\n                    setattr(eevee, attribute, samples)\n'''
          if new in text:
              raise SystemExit('Blender compatibility fix is already present')
          if old not in text:
              raise SystemExit('Expected Blender engine block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m compileall -q tools/tile_mosaic tests/test_tile_mosaic_*.py
          python -m unittest discover -s tests -p 'test_tile_mosaic_*.py' -v

      - name: Commit source fix
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git add tools/tile_mosaic/blender_renderer.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(tile-mosaic): support Blender 4.0 EEVEE enum'
          git push origin "HEAD:${HEAD_BRANCH}"
