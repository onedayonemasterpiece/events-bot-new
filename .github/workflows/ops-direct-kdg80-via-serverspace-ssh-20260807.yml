name: Direct KDG80 response via available Serverspace SSH scope

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-direct-kdg80-via-serverspace-ssh-20260807.yml

permissions:
  contents: read

concurrency:
  group: direct-kdg80-serverspace-ssh-20260807
  cancel-in-progress: false

jobs:
  contain-deploy:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scope:
          - production
          - production-readonly
          - volunteer-monitor-canary
          - region-talk-ydb-import
    environment: ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SCOPE: ${{ matrix.scope }}
      KEY_01: ${{ secrets.SERVERSPACE_SSH_PRIVATE_KEY }}
      KEY_02: ${{ secrets.SERVERSPACE_PRIVATE_KEY }}
      KEY_03: ${{ secrets.SERVERSPACE_SSH_KEY }}
      KEY_04: ${{ secrets.SERVERSPACE_KEY }}
      KEY_05: ${{ secrets.SERVERSPACE_PEM }}
      KEY_06: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_07: ${{ secrets.SSH_KEY }}
      KEY_08: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_09: ${{ secrets.VPS_PRIVATE_KEY }}
      KEY_10: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      KEY_11: ${{ secrets.SERVER_PRIVATE_KEY }}
      KEY_12: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      KEY_13: ${{ secrets.DEPLOY_KEY }}
      KEY_14: ${{ secrets.ARTKODEX_SSH_PRIVATE_KEY }}
      KEY_15: ${{ secrets.CODEX_SERVER_SSH_KEY }}
      KEY_16: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
      KEY_17: ${{ secrets.SSH_DEPLOY_KEY }}
      KEY_18: ${{ secrets.DEV_SERVER_SSH_KEY }}
      KEY_19: ${{ secrets.VSCODE_SSH_KEY }}
      KEY_20: ${{ secrets.CODESERVER_SSH_KEY }}
      KEY_21: ${{ secrets.SERVERSPACE_IDENTITY_FILE }}
      KEY_22: ${{ secrets.SERVERSPACE_SSH_KEY_BASE64 }}
      KEY_23: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}
      KEY_24: ${{ secrets.VPS_SSH_KEY }}
      PASS_01: ${{ secrets.SERVERSPACE_SSH_PASSWORD }}
      PASS_02: ${{ secrets.SERVERSPACE_PASSWORD }}
      PASS_03: ${{ secrets.SSH_PASSWORD }}
      PASS_04: ${{ secrets.VPS_PASSWORD }}
      PASS_05: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: Resolve direct Serverspace access without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          host='188.227.84.107'
          user='dev'
          chosen=''
          present=0
          mkdir -p "$RUNNER_TEMP/ssh"
          for i in $(seq -w 1 24); do
            var="KEY_${i}"
            value="${!var:-}"
            [[ -n "$value" ]] || continue
            present=$((present + 1))
            for mode in raw base64; do
              candidate="$RUNNER_TEMP/ssh/key-${i}-${mode}"
              if [[ "$mode" == raw ]]; then
                printf '%s\n' "$value" > "$candidate"
              else
                printf '%s' "$value" | base64 -d > "$candidate" 2>/dev/null || continue
              fi
              chmod 600 "$candidate"
              ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
              if ssh -i "$candidate" \
                -o BatchMode=yes -o ConnectTimeout=10 \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "$user@$host" 'test "$(id -un)" = dev && test -f /home/dev/.config/fly/release.env' \
                >/dev/null 2>&1; then
                chosen="key:$candidate"
                echo "SCOPE=$SCOPE"
                echo "SSH_KEY_SLOT=$i"
                break 2
              fi
            done
          done

          if [[ -z "$chosen" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            for i in $(seq -w 1 5); do
              var="PASS_${i}"
              value="${!var:-}"
              [[ -n "$value" ]] || continue
              present=$((present + 1))
              if SSHPASS="$value" sshpass -e ssh \
                -o PubkeyAuthentication=no -o PreferredAuthentications=password \
                -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "$user@$host" 'test "$(id -un)" = dev && test -f /home/dev/.config/fly/release.env' \
                >/dev/null 2>&1; then
                printf '%s' "$value" > "$RUNNER_TEMP/ssh/password"
                chmod 600 "$RUNNER_TEMP/ssh/password"
                chosen="password:$RUNNER_TEMP/ssh/password"
                echo "SCOPE=$SCOPE"
                echo "SSH_PASSWORD_SLOT=$i"
                break
              fi
            done
          fi

          echo "REMOTE_CREDENTIAL_CANDIDATES_PRESENT=$present"
          if [[ -z "$chosen" ]]; then
            echo 'SCOPE_RESULT=no-direct-ssh-path'
            exit 0
          fi
          echo "$chosen" > "$RUNNER_TEMP/ssh/chosen"
          echo 'SERVERSPACE_DIRECT_ACCESS=true'

      - name: Contain retries and deploy exact hotfix
        if: ${{ hashFiles(format('{0}/ssh/chosen', runner.temp)) != '' }}
        shell: bash
        run: |
          set -euo pipefail
          chosen="$(cat "$RUNNER_TEMP/ssh/chosen")"
          if [[ "$chosen" == key:* ]]; then
            key="${chosen#key:}"
            ssh_cmd=(ssh -i "$key" -o BatchMode=yes)
          else
            password_file="${chosen#password:}"
            export SSHPASS="$(cat "$password_file")"
            ssh_cmd=(sshpass -e ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password)
          fi
          ssh_cmd+=(
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            dev@188.227.84.107
          )

          "${ssh_cmd[@]}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          set -a
          . /home/dev/.config/fly/release.env
          set +a
          FLY=/home/dev/.fly/bin/flyctl
          APP=znanie-kgd80-fest
          "$FLY" status --app "$APP" >/dev/null

          remote_node="node -e 'const t=process.env.TELEGRAM_BOT_TOKEN;if(!t)throw new Error(\"TELEGRAM_BOT_TOKEN missing\");const call=async(m,p)=>{const r=await fetch(\`https://api.telegram.org/bot\${t}/\${m}\`,{method:\"POST\",headers:{\"content-type\":\"application/x-www-form-urlencoded\"},body:new URLSearchParams(p||{})});const j=await r.json();if(!j.ok)throw new Error(m+\" failed\");return j.result};(async()=>{const b=await call(\"getWebhookInfo\");console.log(JSON.stringify({pending_before:b.pending_update_count||0,webhook_before:Boolean(b.url)}));await call(\"deleteWebhook\",{drop_pending_updates:\"true\"});const a=await call(\"getWebhookInfo\");console.log(JSON.stringify({pending_after:a.pending_update_count||0,webhook_after:Boolean(a.url)}));if(a.url||(a.pending_update_count||0)!==0)process.exit(2)})().catch(e=>{console.error(String(e&&e.message||e));process.exit(1)})'"
          "$FLY" ssh console --app "$APP" --pty=false --command "$remote_node"
          echo 'EXPORT_RETRY_DELIVERY_CONTAINED=true'

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          git clone --quiet https://github.com/onedayonemasterpiece/kdg80.git "$workdir"
          git -C "$workdir" checkout --quiet --detach 75cc1292a94d1232940aa2095c74acee3c674c97
          test "$(git -C "$workdir" rev-parse HEAD)" = 75cc1292a94d1232940aa2095c74acee3c674c97
          grep -Fq 'memory = "512mb"' "$workdir/fly.toml"
          cd "$workdir"
          "$FLY" deploy --app "$APP" --config fly.toml --remote-only --yes

          for i in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 \
              https://znanie-kgd80-fest.fly.dev/api/v1/health \
              | grep -q '"ok":true'; then
              break
            fi
            sleep 5
          done
          curl --fail --silent --show-error --max-time 15 \
            'https://znanie-kgd80-fest.fly.dev/api/v1/special/events/amber-combine-jewelry-excursion?token=amber-combine-jewelry-20260811' \
            | grep -q 'amber-combine-jewelry-excursion'

          verify="sh -lc 'node -e '\''const t=process.env.TELEGRAM_BOT_TOKEN;if(!t)throw new Error(\"TELEGRAM_BOT_TOKEN missing\");fetch(\`https://api.telegram.org/bot\${t}/getWebhookInfo\`).then(r=>r.json()).then(j=>{const x=j.result||{};console.log(JSON.stringify({pending:x.pending_update_count||0,webhook:Boolean(x.url),last_error:Boolean(x.last_error_message)}));if(!j.ok||!x.url||(x.pending_update_count||0)!==0)process.exit(2)}).catch(e=>{console.error(String(e&&e.message||e));process.exit(1)})'\''; cd /app/registration; node -e '\''const Database=require(\"better-sqlite3\");const db=new Database(process.env.SQLITE_PATH||\"/data/registration.sqlite\",{readonly:true});const row=db.prepare(\"SELECT name FROM sqlite_master WHERE type=\\\"table\\\" AND name=\\\"telegram_update_claims\\\"\").get();console.log(JSON.stringify({telegram_update_claims:Boolean(row)}));if(!row)process.exit(3)'\'''"
          "$FLY" ssh console --app "$APP" --pty=false --command "$verify"
          "$FLY" scale show --app "$APP"
          echo 'KDG80_INCIDENT_HOTFIX_DEPLOYED=true'
          REMOTE
