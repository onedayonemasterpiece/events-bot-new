name: Launch readiness dashboard

on:
  pull_request:
    paths:
      - "docs/release/2026-09-01/**"
      - "scripts/generate_launch_readiness.py"
      - ".github/workflows/launch-readiness-dashboard.yml"
  push:
    branches:
      - main
    paths:
      - "docs/release/2026-09-01/**"
      - "scripts/generate_launch_readiness.py"
      - ".github/workflows/launch-readiness-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source and generated views
        run: python3 scripts/generate_launch_readiness.py --check
