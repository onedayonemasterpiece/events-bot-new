name: Observe KDG80 amber test registration in Telegram

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-observe-kdg80-amber-registration-20260807.yml

permissions:
  contents: read

jobs:
  observe:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TELEGRAM_GH_ACTIONS_API_ID: ${{ secrets.TELEGRAM_GH_ACTIONS_API_ID }}
      TELEGRAM_GH_ACTIONS_API_HASH: ${{ secrets.TELEGRAM_GH_ACTIONS_API_HASH }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'Telethon==1.40.0'
      - name: Wait for the visible TEST registration message
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import base64
          import json
          import os
          from datetime import datetime, timezone

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          TARGET_ID = 8582027786
          NOT_BEFORE = datetime.fromisoformat('2026-08-07T17:19:28+00:00')

          def decode_bundle(raw: str) -> dict:
              value = raw.strip()
              if value.startswith('{'):
                  return json.loads(value)
              padded = value + '=' * (-len(value) % 4)
              for decoder in (base64.urlsafe_b64decode, base64.b64decode):
                  try:
                      data = json.loads(decoder(padded.encode()).decode())
                      if isinstance(data, dict) and data.get('session'):
                          return data
                  except Exception:
                      pass
              raise RuntimeError('cannot decode Telegram auth bundle')

          async def main() -> None:
              bundle = decode_bundle(os.environ['TELEGRAM_AUTH_BUNDLE_GH_ACTIONS'])
              client = TelegramClient(
                  StringSession(str(bundle['session'])),
                  int(os.environ['TELEGRAM_GH_ACTIONS_API_ID']),
                  os.environ['TELEGRAM_GH_ACTIONS_API_HASH'],
              )
              await client.connect()
              try:
                  if not await client.is_user_authorized():
                      raise RuntimeError('Telegram session is not authorized')

                  peer = None
                  async for dialog in client.iter_dialogs(limit=500):
                      if int(getattr(dialog.entity, 'id', 0) or 0) == TARGET_ID:
                          peer = dialog.entity
                          break
                  if peer is None:
                      raise RuntimeError('KDG80 bot dialog is unavailable')

                  for _ in range(180):
                      messages = await client.get_messages(peer, limit=100)
                      for message in messages:
                          occurred = message.date
                          if occurred.tzinfo is None:
                              occurred = occurred.replace(tzinfo=timezone.utc)
                          else:
                              occurred = occurred.astimezone(timezone.utc)
                          text = str(message.raw_text or '').strip()
                          if occurred < NOT_BEFORE:
                              continue
                          if not text.startswith('ТЕСТОВАЯ заявка на розыгрыш'):
                              continue
                          if 'Код заявки: TEST-AMBER-MAIL-' not in text:
                              continue
                          if 'Спецмероприятие:' not in text:
                              continue

                          code = next(
                              line.split(':', 1)[1].strip()
                              for line in text.splitlines()
                              if line.startswith('Код заявки:')
                          )
                          print(f'TELEGRAM_TEST_MESSAGE_ID={int(message.id)}')
                          print(f'TELEGRAM_TEST_MESSAGE_UTC={occurred.isoformat()}')
                          print(f'TELEGRAM_TEST_APPLICATION_CODE={code}')
                          print('TELEGRAM_TEST_MESSAGE_BEGIN')
                          print(text)
                          print('TELEGRAM_TEST_MESSAGE_END')
                          print('KDG80_AMBER_TELEGRAM_REGISTRATION_VISIBLE=true')
                          return
                      await asyncio.sleep(5)
                  raise TimeoutError('TEST registration message did not appear in Telegram')
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY
