name: Region Talk research remediation export

on:
  push:
    branches:
      - agent/region-talk-research-terminal-remediation-20260802
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/region-talk-research-terminal-remediation-20260802' || github.ref_name == 'agent/region-talk-research-terminal-remediation-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/region-talk-research-terminal-remediation-20260802
          fetch-depth: 1
      - name: Assemble exact remediation inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/docs/features/region-talk-channel export/scripts export/tests export/workflows export/kaggle/RegionTalkCandidateReport
          cp docs/features/region-talk-channel/external-publication-research.prompt.txt export/docs/features/region-talk-channel/
          cp docs/features/region-talk-channel/external-publication-research.schema.json export/docs/features/region-talk-channel/
          cp docs/features/region-talk-channel/external-publication-research-results.md export/docs/features/region-talk-channel/
          cp docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-08-02-063020.json export/docs/features/region-talk-channel/
          cp docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-08-02-063021.json export/docs/features/region-talk-channel/
          cp docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-08-01-163142.json export/docs/features/region-talk-channel/
          cp scripts/region_talk_external_publication_import.py export/scripts/
          cp scripts/region_talk_external_publication_review.py export/scripts/
          cp scripts/region_talk_orchestrator.py export/scripts/
          cp scripts/region_talk_scheduled_runner.py export/scripts/
          cp scripts/region_talk_publication_finalizer.py export/scripts/
          cp scripts/region_talk_publication_plan.py export/scripts/
          cp scripts/region_talk_goal_notify.py export/scripts/
          cp kaggle/RegionTalkCandidateReport/region_talk_candidate_report.py export/kaggle/RegionTalkCandidateReport/
          cp tests/test_region_talk_external_publication_import.py export/tests/
          cp .github/workflows/region-talk-external-publication-auto-import.yml export/workflows/
          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: region-talk-research-remediation-inputs-${{ github.sha }}
          path: export
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
