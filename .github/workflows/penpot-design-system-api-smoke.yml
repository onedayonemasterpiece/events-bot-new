name: Penpot PAT canonical read probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/penpot-api-smoke-20260806
    paths:
      - .github/workflows/penpot-design-system-api-smoke.yml

permissions:
  contents: read

concurrency:
  group: penpot-pat-canonical-read-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PENPOT_INTEGRATION_TOKEN: ${{ secrets.PENPOT_INTEGRATION_TOKEN }}
      PENPOT_PROFILE_URL: https://design.penpot.app/api/rpc/command/get-profile

    steps:
      - name: Require the integration token
        shell: bash
        run: |
          if [[ -z "${PENPOT_INTEGRATION_TOKEN}" ]]; then
            echo "PENPOT_INTEGRATION_TOKEN is missing" >&2
            exit 1
          fi

      - name: Run the exact documented GET request
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/penpot-read-probe
          headers="artifacts/penpot-read-probe/headers.txt"
          body="artifacts/penpot-read-probe/body.bin"

          # Penpot's official integration guide documents GET for get-profile:
          # curl -H "Authorization: Token <token>" <profile-url>
          status="$({ curl \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --dump-header "${headers}" \
            --output "${body}" \
            --write-out '%{http_code}' \
            --header "Authorization: Token ${PENPOT_INTEGRATION_TOKEN}" \
            --header 'Accept: application/json' \
            "${PENPOT_PROFILE_URL}"; } || true)"

          content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); value=$0} END{print value}' "${headers}")"
          server="$(awk 'BEGIN{IGNORECASE=1} /^server:/{sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); value=$0} END{print value}' "${headers}")"
          cf_ray="$(awk 'BEGIN{IGNORECASE=1} /^cf-ray:/{sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); value=$0} END{print value}' "${headers}")"
          body_size="$(wc -c < "${body}" | tr -d ' ')"
          body_sha256="$(shasum -a 256 "${body}" | awk '{print $1}')"
          cloudflare_challenge=false
          if grep -aFq 'Just a moment...' "${body}"; then
            cloudflare_challenge=true
          fi

          STATUS="${status}" \
          CONTENT_TYPE="${content_type}" \
          SERVER_HEADER="${server}" \
          CF_RAY="${cf_ray}" \
          BODY_SIZE="${body_size}" \
          BODY_SHA256="${body_sha256}" \
          CLOUDFLARE_CHALLENGE="${cloudflare_challenge}" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = {
              "request": {
                  "method": "GET",
                  "url": os.environ["PENPOT_PROFILE_URL"],
                  "authorizationScheme": "Token",
                  "accept": "application/json",
              },
              "response": {
                  "status": int(os.environ["STATUS"] or 0),
                  "contentType": os.environ["CONTENT_TYPE"],
                  "server": os.environ["SERVER_HEADER"],
                  "cfRay": os.environ["CF_RAY"],
                  "bodySize": int(os.environ["BODY_SIZE"]),
                  "bodySha256": os.environ["BODY_SHA256"],
                  "cloudflareChallenge": os.environ["CLOUDFLARE_CHALLENGE"] == "true",
              },
          }

          body_path = Path("artifacts/penpot-read-probe/body.bin")
          if result["response"]["status"] == 200:
              try:
                  payload = json.loads(body_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  result["validation"] = {"json": False, "errorType": type(exc).__name__}
              else:
                  result["validation"] = {
                      "json": True,
                      "object": isinstance(payload, dict),
                      "topLevelKeys": sorted(payload.keys()) if isinstance(payload, dict) else [],
                  }

          Path("artifacts/penpot-read-probe/result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "cloudflare_challenge=${cloudflare_challenge}" >> "${GITHUB_OUTPUT}"

          {
            echo '## Penpot PAT canonical read probe'
            echo
            echo "- Method: \`GET\`"
            echo "- HTTP status: \`${status}\`"
            echo "- Content-Type: \`${content_type:-missing}\`"
            echo "- Server: \`${server:-missing}\`"
            echo "- Cloudflare challenge body: \`${cloudflare_challenge}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload immutable diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penpot-pat-read-probe-${{ github.run_id }}
          path: artifacts/penpot-read-probe/result.json
          if-no-files-found: error
          retention-days: 14

      - name: Require successful profile read
        shell: bash
        run: |
          if [[ "${{ steps.probe.outputs.status }}" != "200" ]]; then
            echo "Canonical Penpot PAT GET did not reach a successful profile read." >&2
            exit 1
          fi
