name: Prelaunch emergency secret publication

on:
  push:
    branches:
      - automation/prelaunch-control-20260804
    paths:
      - '.github/workflows/prelaunch-emergency-secret-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prelaunch-emergency-secret-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      TARGET_SHA: cb01624787e21bb973fc3f94ce84ef077d88c24c
      TARGET_BRANCH: agent/prelaunch-static-background-20260807
      PUBLIC_BASE: https://kenigevents.ru
      KENIGEVENTS_SITE_YC_BUCKET: ${{ secrets.KENIGEVENTS_SITE_YC_BUCKET || vars.KENIGEVENTS_SITE_YC_BUCKET }}
      KENIGEVENTS_SITE_YC_ACCESS_KEY_ID: ${{ secrets.KENIGEVENTS_SITE_YC_ACCESS_KEY_ID || vars.KENIGEVENTS_SITE_YC_ACCESS_KEY_ID }}
      KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY: ${{ secrets.KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY }}
      KENIGEVENTS_SITE_YC_ENDPOINT: ${{ secrets.KENIGEVENTS_SITE_YC_ENDPOINT || vars.KENIGEVENTS_SITE_YC_ENDPOINT || 'https://storage.yandexcloud.net' }}
      KENIGEVENTS_SITE_YC_REGION: ${{ secrets.KENIGEVENTS_SITE_YC_REGION || vars.KENIGEVENTS_SITE_YC_REGION || 'ru-central1' }}
      PUBLIC_PERSONALIZATION_SUPABASE_URL: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_URL || vars.PUBLIC_PERSONALIZATION_SUPABASE_URL || secrets.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_URL || vars.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_URL }}
      PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || vars.PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || secrets.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || vars.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL || vars.PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL || secrets.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL || vars.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL }}

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Download exact approved source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/target-${TARGET_SHA}.tar.gz"
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${TARGET_SHA}" \
            --output "$archive"
          mkdir -p target
          tar --extract --gzip --file "$archive" --directory target --strip-components=1 --no-same-owner
          test -f target/site/package-lock.json
          test -f target/site/src/components/PrelaunchPage.astro

      - name: Build exact approved prelaunch page
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            KENIGEVENTS_SITE_YC_BUCKET \
            KENIGEVENTS_SITE_YC_ACCESS_KEY_ID \
            KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY \
            PUBLIC_PERSONALIZATION_SUPABASE_URL \
            PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY; do
            test -n "${!name:-}"
          done

          npm --prefix target/site ci --no-audit --no-fund
          npm --prefix target/site run test:static-release

          token="$(openssl rand 32 | base64 -w 0 | tr '+/' '-_' | tr -d '=')"
          [[ "$token" =~ ^[A-Za-z0-9_-]{43}$ ]]
          base_path="/_review/${token}"
          token_sha="$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)"

          PUBLIC_PRELAUNCH_MODE=on \
          PUBLIC_SITE_MODE=secret_candidate \
          PUBLIC_SITE_ORIGIN="$PUBLIC_BASE" \
          SITE_BASE_PATH="$base_path" \
          PUBLIC_PERSONALIZATION_SUPABASE_URL="$PUBLIC_PERSONALIZATION_SUPABASE_URL" \
          PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL="${PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL:-}" \
          PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY="$PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY" \
          npm --prefix target/site run build

          artifact_dir='artifacts/prelaunch-emergency-publish'
          stage="${RUNNER_TEMP}/prelaunch-emergency-stage"
          mkdir -p "$artifact_dir" "$stage"

          DIST_ROOT='target/site/dist' \
          STAGE_ROOT="$stage" \
          BASE_PATH="$base_path" \
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { copyFileSync, existsSync, mkdirSync, readFileSync, statSync, writeFileSync } from 'node:fs';
          import { dirname, extname, join, normalize, posix, relative, resolve, sep } from 'node:path';

          const dist = resolve(process.env.DIST_ROOT);
          const stage = resolve(process.env.STAGE_ROOT);
          const basePath = process.env.BASE_PATH.replace(/\/+$/u, '');
          const selected = new Set();
          const queue = [];

          function add(relativePath) {
            let rel = String(relativePath || '').replace(/\\/gu, '/').replace(/^\/+/, '');
            rel = posix.normalize(rel);
            if (!rel || rel === '.' || rel.startsWith('../')) return;
            const absolute = resolve(dist, rel);
            if (!absolute.startsWith(`${dist}${sep}`) && absolute !== dist) return;
            if (!existsSync(absolute) || !statSync(absolute).isFile()) return;
            if (selected.has(rel)) return;
            selected.add(rel);
            queue.push(rel);
          }

          function addReference(raw, fromFile) {
            let value = String(raw || '').trim();
            if (!value || /^(?:data:|blob:|mailto:|tel:|javascript:|#)/iu.test(value)) return;
            value = value.replace(/&amp;/gu, '&');
            try {
              if (/^https?:\/\//iu.test(value)) {
                const parsed = new URL(value);
                if (parsed.hostname !== 'kenigevents.ru') return;
                value = parsed.pathname;
              }
            } catch { return; }
            value = value.split('#')[0].split('?')[0];
            try { value = decodeURIComponent(value); } catch {}
            if (value === basePath || value === `${basePath}/`) value = `${basePath}/index.html`;
            if (value.startsWith(`${basePath}/`)) value = value.slice(basePath.length + 1);
            else if (value.startsWith('/')) value = value.slice(1);
            else value = posix.join(posix.dirname(fromFile), value);
            if (value.endsWith('/')) value += 'index.html';
            add(value);
          }

          add('index.html');
          while (queue.length) {
            const rel = queue.shift();
            const ext = extname(rel).toLowerCase();
            if (!['.html', '.css', '.js', '.mjs', '.json', '.webmanifest', '.svg'].includes(ext)) continue;
            let text;
            try { text = readFileSync(join(dist, rel), 'utf8'); } catch { continue; }

            for (const match of text.matchAll(/(?:src|href|poster|content)\s*=\s*["']([^"']+)["']/giu)) {
              const raw = match[1];
              if (/\s*,\s*/u.test(raw) && /\s+\d+(?:\.\d+)?[wx](?:\s*,|$)/u.test(raw)) {
                for (const candidate of raw.split(',')) addReference(candidate.trim().split(/\s+/u)[0], rel);
              } else addReference(raw, rel);
            }
            for (const match of text.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/giu)) addReference(match[1], rel);
            for (const match of text.matchAll(/(?:from\s*|import\s*\(\s*)["']([^"']+)["']/gu)) addReference(match[1], rel);
            for (const match of text.matchAll(/["'`](\/?[^"'`\s]*?(?:_astro|assets|fonts|icons|favicon|manifest)[^"'`\s]*)["'`]/gu)) addReference(match[1], rel);
          }

          const rootHtml = readFileSync(join(dist, 'index.html'), 'utf8');
          for (const marker of ['data-prelaunch-page', 'approved-desktop-mobile-v2', 'prelaunch-scene-desktop.webp', 'prelaunch-scene-mobile.webp']) {
            if (!rootHtml.includes(marker)) throw new Error(`Approved root marker missing: ${marker}`);
          }
          for (const required of ['assets/prelaunch/prelaunch-scene-desktop.webp', 'assets/prelaunch/prelaunch-scene-mobile.webp']) {
            if (!selected.has(required)) throw new Error(`Approved dependency was not collected: ${required}`);
          }

          const mime = (file) => ({
            '.html':'text/html; charset=utf-8', '.css':'text/css; charset=utf-8',
            '.js':'text/javascript; charset=utf-8', '.mjs':'text/javascript; charset=utf-8',
            '.json':'application/json; charset=utf-8', '.webmanifest':'application/manifest+json',
            '.svg':'image/svg+xml', '.png':'image/png', '.webp':'image/webp',
            '.ico':'image/x-icon', '.woff':'font/woff', '.woff2':'font/woff2',
            '.txt':'text/plain; charset=utf-8',
          }[extname(file).toLowerCase()] || 'application/octet-stream');

          const files = [...selected].sort().map((rel) => {
            const source = join(dist, rel);
            const target = join(stage, rel);
            mkdirSync(dirname(target), { recursive: true });
            copyFileSync(source, target);
            const bytes = readFileSync(source);
            return {
              key: rel,
              size_bytes: bytes.length,
              sha256: createHash('sha256').update(bytes).digest('hex'),
              content_type: mime(rel),
            };
          });
          writeFileSync(join(stage, 'emergency-candidate-manifest.json'), `${JSON.stringify({
            schema_version: 'prelaunch_emergency_candidate_v1',
            target_sha: process.env.TARGET_SHA,
            base_path: basePath,
            files,
          }, null, 2)}\n`);
          console.log(`Collected ${files.length} files for the prelaunch page`);
          NODE

          candidate_url="${PUBLIC_BASE}${base_path}/"
          printf '%s\n' "$candidate_url" > "$artifact_dir/candidate-public-url.txt"
          printf '%s\n' "$TARGET_SHA" > "$artifact_dir/repository-sha.txt"
          printf '%s\n' "$token_sha" > "$artifact_dir/token-sha256.txt"
          cp "$stage/emergency-candidate-manifest.json" "$artifact_dir/emergency-candidate-manifest.json"

          {
            echo "SECRET_CANDIDATE_TOKEN=$token"
            echo "CANDIDATE_BASE_PATH=$base_path"
            echo "CANDIDATE_URL=$candidate_url"
            echo "CANDIDATE_STAGE=$stage"
            echo "CANDIDATE_TOKEN_SHA256=$token_sha"
          } >> "$GITHUB_ENV"

      - name: Publish bounded candidate and verify every object
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir='artifacts/prelaunch-emergency-publish'
          before_body="${RUNNER_TEMP}/production-root-before.html"
          after_body="${RUNNER_TEMP}/production-root-after.html"
          curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "$PUBLIC_BASE/" --output "$before_body"
          before_sha="$(sha256sum "$before_body" | cut -d' ' -f1)"

          export AWS_ACCESS_KEY_ID="$KENIGEVENTS_SITE_YC_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="$KENIGEVENTS_SITE_YC_REGION"
          object_prefix="${CANDIDATE_BASE_PATH#/}"

          if aws --endpoint-url "$KENIGEVENTS_SITE_YC_ENDPOINT" s3api head-object \
            --bucket "$KENIGEVENTS_SITE_YC_BUCKET" \
            --key "${object_prefix}/index.html" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing candidate prefix' >&2
            exit 1
          fi

          aws --endpoint-url "$KENIGEVENTS_SITE_YC_ENDPOINT" s3 cp \
            "${CANDIDATE_STAGE}/" \
            "s3://${KENIGEVENTS_SITE_YC_BUCKET}/${object_prefix}/" \
            --recursive \
            --cache-control 'private, no-store, max-age=0' \
            --no-progress

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "$CANDIDATE_URL" \
              --output "$artifact_dir/live-index.html"; then
              if grep -q 'data-prelaunch-page' "$artifact_dir/live-index.html" \
                && grep -q 'approved-desktop-mobile-v2' "$artifact_dir/live-index.html"; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          test "$ready" = 1

          MANIFEST_PATH="$CANDIDATE_STAGE/emergency-candidate-manifest.json" \
          CANDIDATE_URL="$CANDIDATE_URL" \
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync(process.env.MANIFEST_PATH, 'utf8'));
          const base = process.env.CANDIDATE_URL;
          const failures = [];
          for (let offset = 0; offset < manifest.files.length; offset += 12) {
            const batch = manifest.files.slice(offset, offset + 12);
            await Promise.all(batch.map(async (file) => {
              try {
                const response = await fetch(new URL(file.key, base), {
                  redirect: 'follow',
                  headers: { 'cache-control': 'no-cache' },
                  signal: AbortSignal.timeout(20_000),
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const bytes = Buffer.from(await response.arrayBuffer());
                const hash = createHash('sha256').update(bytes).digest('hex');
                if (bytes.length !== file.size_bytes || hash !== file.sha256) {
                  throw new Error(`hash/size mismatch ${bytes.length}/${hash}`);
                }
              } catch (error) {
                failures.push(`${file.key}: ${String(error)}`);
              }
            }));
          }
          if (failures.length) throw new Error(failures.join('\n'));
          console.log(`Verified ${manifest.files.length} public candidate objects`);
          NODE

          curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "$PUBLIC_BASE/" --output "$after_body"
          after_sha="$(sha256sum "$after_body" | cut -d' ' -f1)"
          test "$before_sha" = "$after_sha"

          jq -n \
            --arg public_url "$CANDIDATE_URL" \
            --arg target_sha "$TARGET_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg token_sha256 "$CANDIDATE_TOKEN_SHA256" \
            --arg production_root_sha256 "$after_sha" \
            '{
              schema_version:"prelaunch_emergency_publication_receipt_v1",
              public_url:$public_url,
              target_sha:$target_sha,
              publish_run_id:$run_id,
              token_sha256:$token_sha256,
              public_verification:"ok",
              production_root_changed:false,
              production_root_sha256:$production_root_sha256
            }' > "$artifact_dir/publication-receipt.json"

          {
            echo '## Published prelaunch candidate'
            echo
            echo "$CANDIDATE_URL"
            echo
            echo "Target SHA: $TARGET_SHA"
            echo 'All candidate objects verified: yes'
            echo 'Production root changed: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-emergency-publication-${{ github.run_id }}
          path: artifacts/prelaunch-emergency-publish
          if-no-files-found: warn
          retention-days: 14
