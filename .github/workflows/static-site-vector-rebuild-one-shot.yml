name: StaticSiteBuilder vector reconcile and fresh rebuild

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/static-site-vector-rebuild-one-shot.yml

permissions:
  contents: write

env:
  FLY_API_TOKEN: ${{ secrets.UNUSUAL_EVENTS_FLY_SSH_TOKEN }}
  FLY_APP_NAME: ${{ vars.UNUSUAL_EVENTS_FLY_APP_NAME }}

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: { name: unusual-events-monitor }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Reconcile vector owner and execute fresh static build
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rebuild.py" <<'PY'
          import asyncio, json, os, sqlite3
          from datetime import datetime, timezone

          BARRIER_IDS=(5757,7216,7596,7635,7912,8169,8170,8199,8210,8246,8304,8306,8307)
          FOLLOWUP=66980

          def read_state():
              c=sqlite3.connect('file:/data/db.sqlite?mode=ro',uri=True); c.row_factory=sqlite3.Row
              state=c.execute("SELECT active_job_id,active_run_id,last_success_run_id,last_success_at,updated_at FROM static_site_build_state WHERE release_channel='secret_preview'").fetchone()
              jobs=c.execute("SELECT id,event_id,task,status,attempts,last_error,last_result,updated_at,next_run_at FROM joboutbox WHERE id IN (66921,66980) OR (task='event_vector_sync' AND event_id IN (%s)) ORDER BY id" % ','.join('?'*len(BARRIER_IDS)), BARRIER_IDS).fetchall()
              c.close(); return (dict(state) if state else None,[dict(x) for x in jobs])

          async def main():
              os.chdir('/app')
              state,jobs=read_state()
              if state is None or state['active_job_id'] is not None or state['active_run_id'] is not None:
                  raise SystemExit(f'static owner unexpectedly active before vector reconcile: {state}')
              print(json.dumps({'phase':'preflight','state':state,'jobs':jobs},default=str),flush=True)

              from db import Database
              import event_vector_sync as evs
              import main as app
              from models import JobTask
              from sqlmodel import Session, create_engine, select
              from models import Event
              from static_site_release import event_public_revision

              db=Database('/data/db.sqlite')
              try:
                  vector=await evs.run_event_vector_sync(db,trigger='manual_recovery',owner_event_id=5757)
                  safe_vector={k:vector.get(k) for k in ('status','ops_run_id','events','documents_upserted','embeddings_upserted','embeddings_skipped_unchanged','provider_calls','stale_events_deleted','not_embedded_due_call_cap','coverage_status','catalog_revision','corpus_revision','search_document_revision','event_revisions_count')}
                  print(json.dumps({'phase':'vector_complete','result':safe_vector},default=str),flush=True)
                  if vector.get('status')!='success' or vector.get('coverage_status')!='complete':
                      raise SystemExit(f'vector reconciliation not complete: {safe_vector}')

                  receipt=json.load(open('/data/event_vector_sync_receipt.json',encoding='utf-8'))
                  engine=create_engine('sqlite:////data/db.sqlite')
                  try:
                      with Session(engine) as session:
                          events={int(e.id):e for e in session.exec(select(Event).where(Event.id.in_(BARRIER_IDS))).all() if e.id is not None}
                          mismatches=[]
                          for eid in BARRIER_IDS:
                              event=events.get(eid)
                              expected=event_public_revision(event) if event is not None else None
                              actual=(receipt.get('event_revisions') or {}).get(str(eid))
                              if expected != actual: mismatches.append({'event_id':eid,'expected_present':bool(expected),'actual_present':bool(actual),'matches':False})
                  finally:
                      engine.dispose()
                  if mismatches:
                      raise SystemExit('vector receipt still mismatches barrier ids: '+json.dumps(mismatches))
                  print(json.dumps({'phase':'vector_barrier_verified','event_ids':list(BARRIER_IDS),'receipt_run_id':receipt.get('run_id'),'schema_version':receipt.get('schema_version')}),flush=True)

                  c=sqlite3.connect('/data/db.sqlite',timeout=30); c.row_factory=sqlite3.Row; c.execute('PRAGMA busy_timeout=30000'); c.execute('BEGIN IMMEDIATE')
                  try:
                      state=c.execute("SELECT active_job_id,active_run_id FROM static_site_build_state WHERE release_channel='secret_preview'").fetchone()
                      row=c.execute('SELECT id,status,attempts,last_error FROM joboutbox WHERE id=?',(FOLLOWUP,)).fetchone()
                      if state is None or state['active_job_id'] is not None or state['active_run_id'] is not None:
                          raise SystemExit('static owner became active before follow-up CAS')
                      if row is None or row['status']!='pending' or row['attempts']!=0 or row['last_error'] is not None:
                          raise SystemExit(f'follow-up changed before CAS: {dict(row) if row else None}')
                      now=datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S.%f')
                      cur=c.execute("UPDATE joboutbox SET updated_at=?,next_run_at=? WHERE id=? AND status='pending' AND attempts=0 AND last_error IS NULL",(now,now,FOLLOWUP))
                      if cur.rowcount!=1: raise SystemExit('follow-up due CAS failed')
                      c.commit()
                  except BaseException:
                      c.rollback(); raise
                  finally:
                      c.close()
                  print(json.dumps({'phase':'followup_due','job_id':FOLLOWUP}),flush=True)

                  processed=await app._run_due_jobs_once(db,None,allowed_tasks={JobTask.static_site_build})
                  print(json.dumps({'phase':'static_worker_return','processed':processed}),flush=True)
              finally:
                  await db.close()

              state,jobs=read_state()
              print(json.dumps({'phase':'postflight','state':state,'jobs':jobs},default=str),flush=True)

          asyncio.run(main())
          PY
          encoded="$(base64 -w0 "$RUNNER_TEMP/rebuild.py")"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false \
            --command "python3 -c \"import base64;exec(base64.b64decode('$encoded'))\"" \
            2>&1 | tee vector-rebuild.log
      - name: Read final redacted static state
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/state.py" <<'PY'
          import json,sqlite3
          c=sqlite3.connect('file:/data/db.sqlite?mode=ro',uri=True); c.row_factory=sqlite3.Row
          jobs=c.execute("SELECT id,event_id,status,attempts,last_error,last_result,updated_at,next_run_at FROM joboutbox WHERE id IN (66921,66980) ORDER BY id").fetchall()
          state=c.execute("SELECT active_job_id,active_run_id,last_success_run_id,last_success_at,updated_at,current_secret_candidate_receipt_json FROM static_site_build_state WHERE release_channel='secret_preview'").fetchone()
          ledger=c.execute("SELECT run_id,status,phase,terminal_at,updated_at FROM kaggle_run_ledger WHERE run_id LIKE 'static-site:%' ORDER BY rowid DESC LIMIT 4").fetchall()
          safe=dict(state) if state else None
          if safe is not None: safe['current_secret_candidate_receipt_json']='present' if safe.get('current_secret_candidate_receipt_json') else None
          receipt=None
          try:
              raw=json.load(open('/data/event_vector_sync_receipt.json',encoding='utf-8')); receipt={k:raw.get(k) for k in ('schema_version','status','complete','run_id','projected_at','events','coverage','catalog_revision','corpus_revision','search_document_revision')}
          except Exception as exc: receipt={'error':type(exc).__name__}
          print(json.dumps({'jobs':[dict(x) for x in jobs],'state':safe,'ledger':[dict(x) for x in ledger],'vector_receipt':receipt},ensure_ascii=False,indent=2,default=str))
          PY
          encoded="$(base64 -w0 "$RUNNER_TEMP/state.py")"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false \
            --command "python3 -c \"import base64;exec(base64.b64decode('$encoded'))\"" \
            | tee vector-rebuild-state.json
      - name: Upload redacted evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site-vector-rebuild
          path: |
            vector-rebuild.log
            vector-rebuild-state.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove one-shot workflow
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git rm .github/workflows/static-site-vector-rebuild-one-shot.yml
          git commit -m 'ops: remove StaticSiteBuilder vector rebuild'
          git push origin HEAD:main
