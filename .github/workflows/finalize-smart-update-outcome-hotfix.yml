name: Finalize Smart Update outcome hotfix

on:
  push:
    branches:
      - fix/smart-update-outcome-boundary-20260805
    paths:
      - .github/workflows/finalize-smart-update-outcome-hotfix.yml
      - scripts/dev/finalize_smart_update_outcome_hotfix.py

permissions:
  contents: write

concurrency:
  group: finalize-smart-update-outcome-hotfix
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-update-outcome-boundary-20260805
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply final review corrections
        run: python scripts/dev/finalize_smart_update_outcome_hotfix.py

      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate reviewed patch
        run: |
          python -m py_compile \
            smart_event_update.py \
            smart_update_identity.py \
            source_parsing/handlers.py \
            vk_intake.py
          pytest -q \
            tests/test_smart_update_outcome_boundary_hotfix.py \
            tests/test_smart_update_source_identity_contract.py \
            tests/test_smart_update_merge_identity_gate.py \
            tests/test_source_parsing_existing_parser_attach.py
          git diff --check
          git diff --stat

      - name: Commit final review corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(smart-update): preserve LLM-first caller boundary"
          git push origin HEAD:fix/smart-update-outcome-boundary-20260805
