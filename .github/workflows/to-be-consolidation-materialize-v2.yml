name: Temporary materialize TO-BE consolidation v2

on:
  push:
    branches:
      - docs/to-be-consolidation-retention-20260805

permissions:
  contents: write

concurrency:
  group: to-be-consolidation-materialize-v2
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor == 'onedayonemasterpiece'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/to-be-consolidation-retention-20260805
          fetch-depth: 0
      - name: Materialize authored package
        run: |
          cat .github/to-be-consolidation-payload-*.b64 | base64 --decode | tar -xzf -
      - name: Consolidate reviewed TO-BE docs
        run: bash scripts/materialize_to_be_consolidation.sh
      - name: Commit canonical package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: consolidate TO-BE contracts and analytics retention'
          git push origin HEAD:docs/to-be-consolidation-retention-20260805
