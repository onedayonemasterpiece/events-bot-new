name: Telegram read (Telethon)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read latest messages from chats/channels or exact post links
        required: true
        default: latest
        type: choice
        options:
          - latest
          - messages
      targets:
        description: One Telegram target per line
        required: true
        default: https://t.me/lovekenig
        type: string
      limit:
        description: Messages per target in latest mode (1-50)
        required: true
        default: "2"
        type: string
  push:
    branches:
      - "agent/telegram-read-*"
    paths:
      - ".github/workflows/telegram-read.yml"
      - "scripts/telegram_read.py"
      - "requests/telegram-read.json"
      - "tests/test_telegram_read.py"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/telegram-read.yml"
      - "scripts/telegram_read.py"
      - "requests/telegram-read.json"
      - "tests/test_telegram_read.py"

permissions:
  contents: read

concurrency:
  # TELEGRAM_AUTH_BUNDLE_GH_ACTIONS is a single role-scoped Telegram identity.
  # Never let two workflow runs use that session concurrently.
  group: telegram-auth-bundle-gh-actions
  cancel-in-progress: false

jobs:
  read:
    name: Read selected Telegram messages
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TELEGRAM_READ_STARTUP_DELAY_SECONDS: "4,12"
      TELEGRAM_READ_BETWEEN_REQUESTS_SECONDS: "2,5"
      TELEGRAM_READ_BETWEEN_TARGETS_SECONDS: "5,15"
      TELEGRAM_READ_FLOOD_SLEEP_SECONDS: "60"
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_TARGETS: ${{ inputs.targets }}
      INPUT_LIMIT: ${{ inputs.limit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest tests/test_telegram_read.py

      - name: Install Telethon
        run: python -m pip install --disable-pip-version-check "telethon>=1.34,<2"

      - name: Build bounded request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          targets = [line.strip() for line in os.environ.get("INPUT_TARGETS", "").splitlines() if line.strip()]
          payload = {
              "schema_version": 1,
              "mode": os.environ.get("INPUT_MODE", "latest"),
              "targets": targets,
              "limit": int(os.environ.get("INPUT_LIMIT", "2")),
          }
          path = Path("requests/telegram-read.runtime.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"request_path={path}", file=open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"))
          PY
          else
            echo "request_path=requests/telegram-read.json" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify role-scoped secret is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_AUTH_BUNDLE_GH_ACTIONS:-}" ]]; then
            echo "TELEGRAM_AUTH_BUNDLE_GH_ACTIONS is not configured" >&2
            exit 1
          fi

      - name: Read Telegram
        run: >-
          python scripts/telegram_read.py
          --request "${{ steps.request.outputs.request_path }}"
          --auth-bundle-env TELEGRAM_AUTH_BUNDLE_GH_ACTIONS
          --output out/telegram-read.json

      - name: Add non-content summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path("out/telegram-read.json")
          lines = ["## Telegram read"]
          if result_path.exists():
              payload = json.loads(result_path.read_text(encoding="utf-8"))
              summary = payload.get("summary") or {}
              lines.extend(
                  [
                      f"- Targets: {summary.get('target_count', 0)}",
                      f"- Messages: {summary.get('message_count', 0)}",
                      f"- Errors: {summary.get('error_count', 0)}",
                      "- Message text is stored only in the one-day artifact.",
                  ]
              )
          else:
              lines.append("- No result file was produced.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload short-lived result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-read-${{ github.run_id }}
          path: out/telegram-read.json
          if-no-files-found: warn
          retention-days: 1
