name: External focus email OTP

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Exact deployed KenigEvents onboarding URL
        required: true
        type: string
      expected_repo_sha:
        description: Exact full repository SHA recorded by the deployed preview metadata
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: external-focus-email-otp
  cancel-in-progress: false

jobs:
  live-email-otp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: external-e2e
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Run external email OTP journey
        env:
          E2E_TARGET_URL: ${{ inputs.target_url }}
          E2E_EXPECTED_REPO_SHA: ${{ inputs.expected_repo_sha }}
          E2E_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_EVIDENCE_DIR: artifacts/external-focus-email-otp-evidence-gh-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_IMAP_USERNAME: ${{ secrets.E2E_IMAP_USERNAME }}
          E2E_IMAP_PASSWORD: ${{ secrets.E2E_IMAP_PASSWORD }}
          E2E_IMAP_HOST: ${{ vars.E2E_IMAP_HOST }}
          E2E_IMAP_PORT: ${{ vars.E2E_IMAP_PORT }}
          E2E_IMAP_SECURE: ${{ vars.E2E_IMAP_SECURE }}
          E2E_RECIPIENT_TEMPLATE: ${{ vars.E2E_RECIPIENT_TEMPLATE }}
          E2E_EXPECTED_FROM_PATTERN: ${{ vars.E2E_EXPECTED_FROM_PATTERN }}
          E2E_EXPECTED_SUBJECT_PATTERN: ${{ vars.E2E_EXPECTED_SUBJECT_PATTERN }}
          E2E_MAIL_TIMEOUT_MS: ${{ vars.E2E_MAIL_TIMEOUT_MS }}
          E2E_SUPABASE_HOST: ${{ vars.E2E_SUPABASE_HOST }}
          E2E_RELAY_HOST: ${{ vars.E2E_RELAY_HOST }}
        run: npm run e2e:external-focus-email-otp
      - name: Upload sanitized evidence
        if: ${{ always() && hashFiles('site/artifacts/external-focus-email-otp-evidence-*/.redaction-ok') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-focus-email-otp-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/artifacts/external-focus-email-otp-evidence-*
          if-no-files-found: error
          retention-days: 7
