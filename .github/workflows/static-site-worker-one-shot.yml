name: StaticSiteBuilder one-shot worker cycle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/static-site-worker-one-shot.yml

permissions:
  contents: write

env:
  FLY_API_TOKEN: ${{ secrets.UNUSUAL_EVENTS_FLY_SSH_TOKEN }}
  FLY_APP_NAME: ${{ vars.UNUSUAL_EVENTS_FLY_APP_NAME }}

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: { name: unusual-events-monitor }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Execute one scoped production worker cycle
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/worker.py" <<'PY'
          import asyncio, json, os, sqlite3

          async def main():
              os.chdir('/app')
              from db import Database
              import main as app
              from models import JobTask

              db = Database('/data/db.sqlite')
              before = sqlite3.connect('file:/data/db.sqlite?mode=ro', uri=True)
              before.row_factory = sqlite3.Row
              state = before.execute("SELECT active_job_id,active_run_id FROM static_site_build_state WHERE release_channel='secret_preview'").fetchone()
              job = before.execute('SELECT id,status,attempts,last_error,next_run_at FROM joboutbox WHERE id=66921').fetchone()
              before.close()
              if state is None or state['active_job_id'] != 66921:
                  raise SystemExit('exact active owner changed before worker cycle')
              if job is None or job['status'] not in ('pending','error'):
                  raise SystemExit(f'exact owner not due for recovery: {dict(job) if job else None}')
              if 'static_site_build' not in app.JOB_HANDLERS:
                  raise SystemExit('deployed app has no static_site_build handler')
              deployed_sha = ''
              try:
                  deployed_sha = open('/app/.static-site-repo-sha').read().strip()
              except OSError:
                  pass
              print(json.dumps({'phase':'preflight','deployed_sha':deployed_sha,'active_job_id':state['active_job_id'],'active_run_id':state['active_run_id'],'job_status':job['status']}, default=str), flush=True)
              try:
                  processed = await app._run_due_jobs_once(
                      db,
                      None,
                      allowed_tasks={JobTask.static_site_build},
                  )
                  print(json.dumps({'phase':'worker_return','processed':processed}), flush=True)
              finally:
                  await db.close()

          asyncio.run(main())
          PY
          encoded="$(base64 -w0 "$RUNNER_TEMP/worker.py")"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false \
            --command "python3 -c \"import base64;exec(base64.b64decode('$encoded'))\"" \
            | tee worker-cycle.log
      - name: Read exact post-cycle state
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/state.py" <<'PY'
          import json, sqlite3
          c=sqlite3.connect('file:/data/db.sqlite?mode=ro',uri=True); c.row_factory=sqlite3.Row
          jobs=c.execute("SELECT id,status,attempts,last_error,last_result,updated_at,next_run_at FROM joboutbox WHERE id IN (66921,66980) ORDER BY id").fetchall()
          state=c.execute("SELECT active_job_id,active_run_id,last_success_run_id,last_success_at,updated_at FROM static_site_build_state WHERE release_channel='secret_preview'").fetchone()
          ledger=c.execute("SELECT run_id,status,phase,terminal_at,updated_at FROM kaggle_run_ledger WHERE run_id LIKE 'static-site:%' ORDER BY rowid DESC LIMIT 5").fetchall()
          print(json.dumps({'jobs':[dict(x) for x in jobs], 'state':dict(state) if state else None, 'ledger':[dict(x) for x in ledger]}, ensure_ascii=False, indent=2, default=str))
          PY
          encoded="$(base64 -w0 "$RUNNER_TEMP/state.py")"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false \
            --command "python3 -c \"import base64;exec(base64.b64decode('$encoded'))\"" \
            | tee post-cycle-state.json
      - name: Upload redacted cycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site-worker-cycle
          path: |
            worker-cycle.log
            post-cycle-state.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove one-shot workflow
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git rm .github/workflows/static-site-worker-one-shot.yml
          git commit -m 'ops: remove StaticSiteBuilder worker cycle'
          git push origin HEAD:main
