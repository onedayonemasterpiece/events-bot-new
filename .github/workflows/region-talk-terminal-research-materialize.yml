name: Materialize Region Talk terminal research bundle

on:
  push:
    branches:
      - agent/region-talk-terminal-research-recovery-20260803
    paths:
      - '.github/workflows/region-talk-terminal-research-materialize.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/region-talk-terminal-research-materialize.yml'

permissions:
  contents: write

concurrency:
  group: region-talk-terminal-research-materialize-20260803
  cancel-in-progress: false

jobs:
  materialize:
    name: Verify and materialize terminal research successors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@v4
        with:
          ref: agent/region-talk-terminal-research-recovery-20260803
          fetch-depth: 0

      - name: Reconstruct and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .rt-upload-v3 -maxdepth 1 -type f -name 'part.*' | wc -l)" -eq 5
          cat .rt-upload-v3/part.* \
            | tr -d '\r\n\t ' \
            | base64 --decode > /tmp/region-talk-terminal-research.zip
          sha256sum /tmp/region-talk-terminal-research.zip
          unzip -tq /tmp/region-talk-terminal-research.zip

          rm -rf /tmp/region-talk-terminal-research
          mkdir -p /tmp/region-talk-terminal-research
          unzip -q /tmp/region-talk-terminal-research.zip -d /tmp/region-talk-terminal-research
          export SRC=/tmp/region-talk-terminal-research/region-talk-terminal-research-20260802
          (cd "$SRC" && sha256sum --check --strict SHA256SUMS.txt)

      - name: Validate terminal research contract
        shell: bash
        run: |
          set -euo pipefail
          export SRC=/tmp/region-talk-terminal-research/region-talk-terminal-research-20260802
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          src = Path(os.environ['SRC'])
          names = [
              'region-talk-external-research-result-region-talk-external-2026-08-02-191600.json',
              'region-talk-external-research-result-region-talk-external-2026-08-02-191601.json',
              'region-talk-external-research-result-region-talk-external-2026-08-02-191602.json',
          ]
          required_supports = {
              'publisher.identity',
              'publisher.audience',
              'publisher.distinctive_value',
              'publisher.locality',
          }
          candidate_total = 0
          source_domains = set()
          for name in names:
              payload = json.loads((src / name).read_text(encoding='utf-8'))
              assert payload['schema_version'] == 'region_talk_external_research.v1'
              for row in payload['candidates']:
                  assert row['decision']['research_decision'] == 'candidate'
                  assert row['decision']['downstream_readiness'] == 'candidate_report'
                  assert row['uncertainties'] == []
                  assert row['publication']['access_status'] == 'full_text'
                  assert row['source_assessment']['scope'] == 'external'
                  policy = row['policy_classification']
                  assert policy['research_match']
                  assert policy['product_policy_match']
                  assert policy['language_policy_match']
                  assert not policy['hard_exclusion_codes']
                  supports = {
                      value
                      for evidence in row['evidence']
                      for value in evidence.get('supports', [])
                  }
                  assert required_supports <= supports
                  candidate_total += 1
                  source_domains.add(row['publication']['source_domain'])
          assert candidate_total == 43
          assert len(source_domains) == 32

          reconciliation = json.loads(
              (src / 'region-talk-external-research-terminal-reconciliation-2026-08-02.json').read_text(encoding='utf-8')
          )
          assert len(reconciliation['rows']) == 54
          assert reconciliation['before']['manual_review_required'] == 22
          assert reconciliation['after']['manual_review_required'] == 0
          assert Counter(row['transition'] for row in reconciliation['rows']) == {
              'candidate_report_to_candidate_report': 32,
              'manual_review_required_to_candidate_report': 11,
              'manual_review_required_to_excluded': 5,
              'manual_review_required_to_unresolved': 6,
          }

          foundation = json.loads(
              (src / 'region-talk-publisher-description-foundation-2026-08-02.json').read_text(encoding='utf-8')
          )
          assert foundation['source_count'] == 32
          assert foundation['candidate_count'] == 43
          assert len(foundation['profiles']) == 32

          prompt = (src / 'external-publication-research.prompt.txt').read_text(encoding='utf-8')
          for marker in (
              'manual_review_required_count` must equal 0',
              'PDF AND DOCUMENT COMPLETION',
              'PUBLISHER DOSSIER — REQUIRED FOR EVERY RETAINED CANDIDATE',
              'English and other configured source languages are upstream research inputs',
              'objectively inaccessible after bounded attempts',
          ):
              assert marker in prompt
          PY

      - name: Materialize repository files
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/region-talk-terminal-research/region-talk-terminal-research-20260802
          feature_dir=docs/features/region-talk-channel
          report_dir=docs/reports

          cp "$SRC/external-publication-research.prompt.txt" "$feature_dir/external-publication-research.prompt.txt"
          cp "$SRC/region-talk-external-research-result-region-talk-external-2026-08-02-191600.json" "$feature_dir/"
          cp "$SRC/region-talk-external-research-result-region-talk-external-2026-08-02-191601.json" "$feature_dir/"
          cp "$SRC/region-talk-external-research-result-region-talk-external-2026-08-02-191602.json" "$feature_dir/"
          cp "$SRC/region-talk-external-research-terminal-reconciliation-2026-08-02.json" "$feature_dir/"
          cp "$SRC/region-talk-publisher-description-foundation-2026-08-02.json" "$feature_dir/"
          cp "$SRC/CODE-AGENT-PROMPT-region-talk-terminal-research-20260802.md" \
             "$feature_dir/region-talk-terminal-research-reconciliation-implementation.prompt.md"
          cp "$SRC/region-talk-external-research-terminal-validation-2026-08-02.json" "$report_dir/"
          cp "$SRC/region-talk-external-research-terminal-review-2026-08-02.md" "$report_dir/"

          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/region-talk-terminal-research/region-talk-terminal-research-20260802')
          index = Path('docs/features/region-talk-channel/external-publication-research-results.md')
          heading = '## Terminal research successors — 2026-08-02'
          current = index.read_text(encoding='utf-8')
          section = (src / 'external-publication-research-results-index-update.md').read_text(encoding='utf-8').strip()
          if heading not in current:
              index.write_text(current.rstrip() + '\n\n' + section + '\n', encoding='utf-8')
          PY

          git rm -r .rt-upload .rt-upload-v3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/features/region-talk-channel docs/reports
          git diff --cached --check
          git commit -m 'Finalize Region Talk external research successors'
          git push origin HEAD:agent/region-talk-terminal-research-recovery-20260803

          {
            echo '### Region Talk terminal research materialization'
            echo
            echo '- all internal SHA-256 checks: passed'
            echo '- candidate_report: 43'
            echo '- manual_review_required: 0'
            echo '- publisher dossiers: 32 sources / 43 candidates'
            echo '- reconciliation: 54 predecessor identities'
          } >> "$GITHUB_STEP_SUMMARY"
