name: Production readonly social access probe

on:
  push:
    branches: [main]
    paths:
      - .github/production-readonly-social-presence-trigger.txt

permissions:
  contents: read

jobs:
  probe:
    environment: production-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ACCESS_TOKEN: ${{ secrets.FLY_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
      TG_SESSION_BASE64: ${{ secrets.TG_SESSION_BASE64 }}
      TELEGRAM_AUTH_BUNDLE_E2E: ${{ secrets.TELEGRAM_AUTH_BUNDLE_E2E }}
      TELEGRAM_AUTH_BUNDLE_STORY: ${{ secrets.TELEGRAM_AUTH_BUNDLE_STORY }}
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      VK_ACCESS_TOKEN5: ${{ secrets.VK_ACCESS_TOKEN5 }}
      KAGGLE_USERNAME_SECRET: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_USERNAME_VAR: ${{ vars.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Print presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in FLY_API_TOKEN FLY_ACCESS_TOKEN TELEGRAM_BOT_TOKEN TG_API_ID TG_API_HASH TG_SESSION_STRING TG_SESSION_BASE64 TELEGRAM_AUTH_BUNDLE_E2E TELEGRAM_AUTH_BUNDLE_STORY VK_TOKEN VK_ACCESS_TOKEN5 KAGGLE_USERNAME_SECRET KAGGLE_USERNAME_VAR KAGGLE_KEY KAGGLE_API_TOKEN; do
            [[ -n "${!name:-}" ]] && echo "READONLY_PRESENT=$name" || echo "READONLY_ABSENT=$name"
          done
