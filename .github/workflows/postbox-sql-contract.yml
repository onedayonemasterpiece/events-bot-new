name: Postbox SQL contract

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/postbox-sql-contract.yml'
      - 'supabase/migrations/20260711203940_email_control_plane_v1.sql'
      - 'supabase/migrations/20260712072912_email_postbox_event_consumer_v2.sql'
      - 'supabase/migrations/20260712083037_email_postbox_worker_v1.sql'
      - 'supabase/migrations/20260801222242_focus_auth_delivery_attempt_v1.sql'
      - 'supabase/migrations/20260804190000_postbox_auth_feedback_correlation_v1.sql'
      - 'supabase/migrations/20260805071852_enforce_focus_auth_suppression_admission.sql'
      - 'supabase/tests/email_postbox_auth_feedback_contract.sql'
      - 'supabase/tests/postbox_auth_feedback_ci_bootstrap.sql'
      - 'scripts/ops/postbox_dlq_recover.py'
      - 'tests/test_postbox_dlq_recover.py'

permissions:
  contents: read

jobs:
  postbox-sql-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply Postbox prerequisite migrations and rollback-only contract
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/postbox_auth_feedback_ci_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260711203940_email_control_plane_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260712072912_email_postbox_event_consumer_v2.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260712083037_email_postbox_worker_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260801222242_focus_auth_delivery_attempt_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260804190000_postbox_auth_feedback_correlation_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260805071852_enforce_focus_auth_suppression_admission.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/email_postbox_auth_feedback_contract.sql
