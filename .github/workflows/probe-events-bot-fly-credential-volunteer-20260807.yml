name: Probe events-bot Fly credential in volunteer environment

on:
  push:
    branches:
      - ops/add-amber-excursion-digest-20260807
    paths:
      - .github/workflows/probe-events-bot-fly-credential-volunteer-20260807.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: volunteer-monitor-canary
    env:
      TOKEN_DEFAULT: ${{ secrets.FLY_API_TOKEN }}
      TOKEN_DEPLOY: ${{ secrets.FLY_API_TOKEN_DEPLOY }}
      TOKEN_EVENTS_BOT: ${{ secrets.FLY_API_TOKEN_EVENTS_BOT }}
      TOKEN_AUDIT: ${{ secrets.FLY_API_TOKEN_SMART_UPDATE_AUDIT }}
      TOKEN_PRODUCTION: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
      TOKEN_ACCESS: ${{ secrets.FLY_ACCESS_TOKEN }}
      TOKEN_SHORT: ${{ secrets.FLY_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.78
      - name: Find an existing app-scoped credential without exposing it
        shell: bash
        run: |
          set -euo pipefail
          app='events-bot-new-wngqia'
          found=''
          for name in TOKEN_DEFAULT TOKEN_DEPLOY TOKEN_EVENTS_BOT TOKEN_AUDIT TOKEN_PRODUCTION TOKEN_ACCESS TOKEN_SHORT; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              printf '%s=absent\n' "$name"
              continue
            fi
            printf '%s=present\n' "$name"
            if FLY_API_TOKEN="$value" flyctl status --app "$app" >/dev/null 2>&1; then
              found="$name"
              break
            fi
          done
          if [[ -z "$found" ]]; then
            echo '::error title=No usable Fly credential::No candidate secret in volunteer-monitor-canary can access events-bot-new-wngqia.'
            exit 1
          fi
          echo "USABLE_FLY_SECRET=$found"
