name: Live WSS consumer contracts
on:
  pull_request:
    paths:
      - 'static_site_live_*.py'
      - 'requirements.txt'
      - 'site/package*.json'
      - 'site/src/lib/liveEventSearch.js'
      - 'site/tests/live-*.test.mjs'
      - 'tests/test_static_site_live_*.py'
      - '.github/workflows/live-wss-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: python -m pip install pytest pytest-asyncio aiohttp aioresponses "$(grep '^live-interaction @ ' requirements.txt)"
      - run: python -m pytest --noconftest -q tests/test_static_site_live_search.py tests/test_static_site_live_socket.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: site
      - run: npm run test:live-wss
        working-directory: site
