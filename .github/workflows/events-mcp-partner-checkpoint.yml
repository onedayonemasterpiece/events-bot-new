name: Events MCP partner source checkpoint

# Deterministic application of ChatGPT-authored source. No code-generation agent,
# production credentials, deployment or provider calls. Self-removes on success.
on:
  push:
    branches: [feature/events-mcp-partner-product-20260906]
    paths: [.github/workflows/events-mcp-partner-checkpoint.yml]
permissions:
  contents: write
concurrency:
  group: events-mcp-partner-source-checkpoint
  cancel-in-progress: false
jobs:
  materialize-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact source changes without replacing parallel files
        run: |
          set -euo pipefail
          git status --short
          git apply --check scripts/ops/_partner_wiring.patch
          git apply scripts/ops/_partner_wiring.patch
          git diff --check
          python -m compileall -q private_events_mcp db.py tests/test_private_events_mcp_partner_access.py tests/test_private_events_mcp_partner_protocol.py
      - name: Install project test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate actual OAuth HTTP policy and existing protocol regressions
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p artifacts/partner-checkpoint
          python -m pytest -q --tb=short tests/test_private_events_mcp_partner_access.py tests/test_private_events_mcp_partner_protocol.py tests/test_private_events_mcp_server.py tests/test_private_events_mcp_protocol.py tests/test_private_events_mcp_config.py tests/test_private_events_mcp_social_oauth_policy.py | tee artifacts/partner-checkpoint/tests.log
      - name: Persist tested application sources on this feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db.py private_events_mcp/access_policy.py private_events_mcp/config.py private_events_mcp/oauth.py private_events_mcp/protocol.py private_events_mcp/server.py .env.example CHANGELOG.md docs/operations/private-events-mcp.md
          git rm scripts/ops/_partner_wiring.patch .github/workflows/events-mcp-partner-checkpoint.yml
          git diff --cached --check
          git commit -m 'feat(mcp): wire tested partner OAuth and canonical access policy'
          git push origin HEAD:refs/heads/feature/events-mcp-partner-product-20260906
          git rev-parse HEAD > artifacts/partner-checkpoint/tested-source-sha.txt
          git show --stat --oneline HEAD > artifacts/partner-checkpoint/commit-stat.txt
      - name: Export exact checkpoint sources and evidence
        if: always()
        run: |
          mkdir -p artifacts/partner-checkpoint
          git rev-parse HEAD > artifacts/partner-checkpoint/checkout-sha.txt
          git diff --binary > artifacts/partner-checkpoint/uncommitted.patch
          git archive --format=tar.gz HEAD private_events_mcp tests/test_private_events_mcp_partner_access.py tests/test_private_events_mcp_partner_protocol.py db.py docs/operations/private-events-mcp.md .env.example CHANGELOG.md > artifacts/partner-checkpoint/source.tar.gz
          sha256sum artifacts/partner-checkpoint/source.tar.gz > artifacts/partner-checkpoint/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partner-checkpoint-${{ github.sha }}
          path: artifacts/partner-checkpoint/
          retention-days: 14
          if-no-files-found: error
