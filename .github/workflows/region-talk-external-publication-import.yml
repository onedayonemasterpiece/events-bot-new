name: Import trusted Region Talk external-publication research

on:
  workflow_dispatch:
    inputs:
      research_result:
        description: Approved, committed Region Talk research-result JSON to validate and stage
        required: true
        type: choice
        options:
          - docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-07-31-125052.json
          - docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-07-31-174033.json
          - docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-08-01-163142.json

# This workflow only reads its trusted main checkout. The protected environment
# is the approval boundary for the write-capable YDB import job.
permissions:
  contents: read
  id-token: write

concurrency:
  group: region-talk-ydb-import
  cancel-in-progress: false

jobs:
  validate-and-import:
    name: Validate then stage approved research JSON
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: region-talk-ydb-import
    env:
      # These are non-secret repository/environment variables. The federation
      # must trust the GitHub OIDC audience and this protected environment's
      # exact subject before the token exchange can succeed.
      YANDEX_WIF_OIDC_AUDIENCE: ${{ vars.YANDEX_WIF_OIDC_AUDIENCE }}
      YANDEX_WIF_SERVICE_ACCOUNT_ID: ${{ vars.YANDEX_WIF_SERVICE_ACCOUNT_ID }}
      REGION_TALK_YDB_ENDPOINT: ${{ vars.REGION_TALK_YDB_ENDPOINT }}
      REGION_TALK_YDB_DATABASE: ${{ vars.REGION_TALK_YDB_DATABASE }}
      INPUT_PATH: ${{ inputs.research_result }}

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          # Never honor a user-supplied ref: the selected JSON must be the
          # reviewed object currently reachable from the trusted default branch.
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Reject any path outside the approved research-result set
        shell: bash
        run: |
          set -euo pipefail
          case "$INPUT_PATH" in
            docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-07-31-125052.json|\
            docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-07-31-174033.json|\
            docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-08-01-163142.json)
              ;;
            *)
              echo "Refusing non-approved research-result path: $INPUT_PATH" >&2
              exit 1
              ;;
          esac
          test -f "$INPUT_PATH"
          test "$(git rev-parse --verify HEAD)" = "$(git rev-parse --verify origin/main)"

      - name: Install importer dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned runtime dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Hash trusted input and prepare deterministic report paths
        id: input
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum "$INPUT_PATH" | awk '{print $1}')"
          report_dir="artifacts/github-actions/region-talk-external-publication-import/$sha256"
          mkdir -p "$report_dir"
          printf '%s  %s\n' "$sha256" "$INPUT_PATH" > "$report_dir/input.sha256"
          {
            echo "sha256=$sha256"
            echo "report_dir=$report_dir"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Trusted input"
            echo
            echo "- path: \`$INPUT_PATH\`"
            echo "- SHA-256: \`$sha256\`"
            echo "- checkout: \`$(git rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate JSON before any YDB authentication or write
        shell: bash
        run: |
          set -euo pipefail
          python scripts/region_talk_external_publication_import.py "$INPUT_PATH" \
            --report "${{ steps.input.outputs.report_dir }}/validation.json"

      - name: Exchange GitHub OIDC token for short-lived Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is required}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is required}"
          : "${YANDEX_WIF_OIDC_AUDIENCE:?Set protected-environment variable YANDEX_WIF_OIDC_AUDIENCE}"
          : "${YANDEX_WIF_SERVICE_ACCOUNT_ID:?Set protected-environment variable YANDEX_WIF_SERVICE_ACCOUNT_ID}"
          : "${REGION_TALK_YDB_ENDPOINT:?Set protected-environment variable REGION_TALK_YDB_ENDPOINT}"
          : "${REGION_TALK_YDB_DATABASE:?Set protected-environment variable REGION_TALK_YDB_DATABASE}"

          github_oidc="$({
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              --get --data-urlencode "audience=${YANDEX_WIF_OIDC_AUDIENCE}" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL"
          } | jq --exit-status --raw-output '.value | strings | select(length > 100)')"

          iam_response="$(curl --fail --silent --show-error \
            --request POST 'https://auth.yandex.cloud/oauth/token' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YANDEX_WIF_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${github_oidc}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          iam_token="$(printf '%s' "$iam_response" | jq --exit-status --raw-output '.access_token | strings | select(length > 20)')"
          echo "::add-mask::$iam_token"
          echo "REGION_TALK_YDB_IAM_TOKEN=$iam_token" >> "$GITHUB_ENV"

      - name: Stage validated intake rows in YDB
        shell: bash
        run: |
          set -euo pipefail
          python scripts/region_talk_external_publication_import.py "$INPUT_PATH" \
            --execute \
            --report "${{ steps.input.outputs.report_dir }}/execute.json"

      - name: Publish deterministic import receipt
        if: ${{ always() && steps.input.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${{ steps.input.outputs.report_dir }}"
          python - "$report_dir" "${{ steps.input.outputs.sha256 }}" "$INPUT_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          report_dir, sha256, input_path = map(str, sys.argv[1:])
          root = Path(report_dir)
          receipt = {
              "input_path": input_path,
              "input_sha256": sha256,
              "validation_report_present": (root / "validation.json").is_file(),
              "execute_report_present": (root / "execute.json").is_file(),
          }
          for name in ("validation.json", "execute.json"):
              path = root / name
              if path.is_file():
                  try:
                      payload = json.loads(path.read_text(encoding="utf-8"))
                      receipt[name.removesuffix(".json")] = {
                          key: payload.get(key)
                          for key in ("executed", "planned_ydb_rows", "written_ydb_rows", "live_duplicate_guard_applied")
                      }
                  except json.JSONDecodeError:
                      receipt[name.removesuffix(".json")] = {"parse_error": True}
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY
          cat "$report_dir/input.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable validation and import reports
        if: ${{ always() && steps.input.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: region-talk-external-publication-import-${{ steps.input.outputs.sha256 }}
          path: ${{ steps.input.outputs.report_dir }}
          if-no-files-found: error
          retention-days: 30
