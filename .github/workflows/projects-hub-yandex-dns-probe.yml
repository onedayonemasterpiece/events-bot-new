name: Projects Hub Yandex DNS read-only probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/projects-hub-yandex-dns-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: region-talk-ydb-import
    env:
      YANDEX_WIF_OIDC_AUDIENCE: ${{ vars.YANDEX_WIF_OIDC_AUDIENCE }}
      YANDEX_WIF_SERVICE_ACCOUNT_ID: ${{ vars.YANDEX_WIF_SERVICE_ACCOUNT_ID }}
      DNS_ZONE_ID: dnsbhbtvj0l1lf8jpefb
      TARGET_NAME: projects-hub.kenigevents.ru.
      EXPECTED_IPV4: 78.111.90.230
    steps:
      - name: Exchange GitHub OIDC for short-lived Yandex IAM
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?missing GitHub OIDC URL}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?missing GitHub OIDC token}"
          : "${YANDEX_WIF_OIDC_AUDIENCE:?missing WIF audience}"
          : "${YANDEX_WIF_SERVICE_ACCOUNT_ID:?missing WIF service account}"

          github_oidc="$(
            curl --fail --silent --show-error               --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               --get --data-urlencode "audience=${YANDEX_WIF_OIDC_AUDIENCE}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}" |
            python -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"

          iam_token="$(
            curl --fail --silent --show-error               --request POST "https://auth.yandex.cloud/oauth/token"               --header "Content-Type: application/x-www-form-urlencoded"               --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange"               --data-urlencode "requested_token_type=urn:ietf:params:oauth:token-type:access_token"               --data-urlencode "audience=${YANDEX_WIF_SERVICE_ACCOUNT_ID}"               --data-urlencode "subject_token=${github_oidc}"               --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:id_token" |
            python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          )"

          test "${#iam_token}" -gt 20
          echo "::add-mask::$iam_token"
          echo "YANDEX_IAM_TOKEN=$iam_token" >> "$GITHUB_ENV"

      - name: Read Cloud DNS zone and target record
        shell: bash
        run: |
          set -euo pipefail

          zone_json="$(
            curl --fail --silent --show-error               --header "Authorization: Bearer ${YANDEX_IAM_TOKEN}"               "https://dns.api.cloud.yandex.net/dns/v1/zones/${DNS_ZONE_ID}"
          )"

          records_json="$(
            curl --fail --silent --show-error               --header "Authorization: Bearer ${YANDEX_IAM_TOKEN}"               "https://dns.api.cloud.yandex.net/dns/v1/zones/${DNS_ZONE_ID}:listRecordSets?pageSize=1000"
          )"

          ZONE_JSON="$zone_json" RECORDS_JSON="$records_json" python - <<'PY'
          import json, os
          zone = json.loads(os.environ["ZONE_JSON"])
          records = json.loads(os.environ["RECORDS_JSON"]).get("recordSets", [])
          target = os.environ["TARGET_NAME"]
          expected = os.environ["EXPECTED_IPV4"]
          assert zone.get("zone") == "kenigevents.ru.", "unexpected DNS zone"
          rows = [r for r in records if r.get("name") == target and r.get("type") == "A"]
          if rows:
              data = sorted({str(x) for r in rows for x in (r.get("data") or [])})
              print(f"DNS_PROBE_PASS target_present=yes expected_ip_present={expected in data} data={','.join(data)}")
          else:
              print("DNS_PROBE_PASS target_present=no expected_ip_present=no")
          PY
