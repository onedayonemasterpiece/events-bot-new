name: Product Atlas v1

on:
  pull_request:
    paths:
      - "docs/product-model/**"
      - "scripts/validate_product_atlas_v1.py"
      - "tests/test_product_atlas_v1.py"
      - ".github/workflows/product-atlas-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-product-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate semantic model and foreign keys
        run: python scripts/validate_product_atlas_v1.py
      - name: Run focused repository test
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_product_atlas_v1.py
