name: Product Atlas v1

on:
  pull_request:
    paths:
      - "docs/product-model/**"
      - "scripts/validate_product_atlas_v1.py"
      - "tests/test_product_atlas_v1.py"
      - ".github/workflows/product-atlas-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-product-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate semantic model and foreign keys
        id: semantic
        shell: bash
        run: |
          set +e
          python scripts/validate_product_atlas_v1.py > product-atlas-semantic.log 2>&1
          status=$?
          cat product-atlas-semantic.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Run focused repository test
        if: always()
        id: focused
        shell: bash
        run: |
          set +e
          python -m pip install --disable-pip-version-check pytest > product-atlas-test.log 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            python -m pytest --noconftest -q tests/test_product_atlas_v1.py >> product-atlas-test.log 2>&1
            status=$?
          else
            status=$install_status
          fi
          cat product-atlas-test.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-atlas-v1-validation-${{ github.run_id }}
          path: |
            product-atlas-semantic.log
            product-atlas-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Write validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Product Atlas v1"
            echo "- semantic exit: ${{ steps.semantic.outputs.exit_code }}"
            echo "- focused test exit: ${{ steps.focused.outputs.exit_code }}"
          } >> "$GITHUB_STEP_SUMMARY"
