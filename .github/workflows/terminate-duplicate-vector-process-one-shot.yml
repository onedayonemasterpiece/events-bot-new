name: Terminate exact duplicate vector process

on:
  push:
    branches: [main]
    paths: [.github/workflows/terminate-duplicate-vector-process-one-shot.yml]

permissions: { contents: write }
env:
  FLY_API_TOKEN: ${{ secrets.UNUSUAL_EVENTS_FLY_SSH_TOKEN }}
  FLY_APP_NAME: ${{ vars.UNUSUAL_EVENTS_FLY_APP_NAME }}

jobs:
  terminate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: { name: unusual-events-monitor }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Terminate only decoded manual recovery process
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/kill.py" <<'PY'
          import asyncio, base64, json, os, re, signal, sqlite3, time
          from pathlib import Path

          TARGET_RUN=8125
          OWNER_RUN=8124

          def decoded_payload(pid:int):
              try:
                  raw=Path(f'/proc/{pid}/cmdline').read_bytes().replace(b'\0',b' ').decode(errors='replace')
              except OSError:
                  return None
              m=re.search(r"b64decode\('([A-Za-z0-9+/=]+)'\)",raw)
              if not m:
                  return None
              try: return base64.b64decode(m.group(1)).decode(errors='replace')
              except Exception: return None

          mark1='run_event_'+'vector_sync'
          mark2='manual_'+'recovery'
          mark3='FOLLOW'+'UP=66980'
          matches=[]
          for entry in Path('/proc').iterdir():
              if not entry.name.isdigit(): continue
              pid=int(entry.name)
              if pid==os.getpid(): continue
              src=decoded_payload(pid)
              if src and all(x in src for x in (mark1,mark2,mark3)):
                  matches.append(pid)
          if len(matches)>1:
              raise SystemExit(f'ambiguous duplicate process set: {matches}')

          c=sqlite3.connect('file:/data/db.sqlite?mode=ro',uri=True); c.row_factory=sqlite3.Row
          ops={row['id']:dict(row) for row in c.execute('SELECT id,status,trigger,started_at,finished_at FROM ops_run WHERE id IN (?,?)',(OWNER_RUN,TARGET_RUN))}
          job=c.execute('SELECT id,status,event_id FROM joboutbox WHERE id=66114').fetchone()
          c.close()
          if ops.get(OWNER_RUN,{}).get('status')!='running' or not job or job['status']!='running':
              raise SystemExit(f'production owner is not running; refuse termination: ops={ops} job={dict(job) if job else None}')
          if ops.get(TARGET_RUN,{}).get('status')!='running':
              raise SystemExit(f'manual ops_run already terminal; refuse unexpected mutation: {ops.get(TARGET_RUN)}')

          killed=[]
          if matches:
              root=matches[0]
              def ppid(pid):
                  try: return int(Path(f'/proc/{pid}/stat').read_text().split()[3])
                  except Exception: return None
              descendants=[]; frontier=[root]
              while frontier:
                  parent=frontier.pop()
                  children=[]
                  for e in Path('/proc').iterdir():
                      if e.name.isdigit() and ppid(int(e.name))==parent:
                          children.append(int(e.name))
                  descendants.extend(children); frontier.extend(children)
              for pid in reversed(descendants):
                  try: os.kill(pid,signal.SIGTERM); killed.append(pid)
                  except ProcessLookupError: pass
              try: os.kill(root,signal.SIGTERM); killed.append(root)
              except ProcessLookupError: pass
              deadline=time.time()+5
              while time.time()<deadline and any(Path(f'/proc/{pid}').exists() for pid in killed): time.sleep(.2)
              for pid in killed:
                  if Path(f'/proc/{pid}').exists():
                      try: os.kill(pid,signal.SIGKILL)
                      except ProcessLookupError: pass

          async def finish():
              os.chdir('/app')
              from db import Database
              from ops_run import finish_ops_run
              db=Database('/data/db.sqlite')
              try:
                  await finish_ops_run(db,run_id=TARGET_RUN,status='failed',metrics={},details={'error':'duplicate manual recovery cancelled; production outbox owner preserved','failure_stage':'operator_recovery_cancellation'})
              finally: await db.close()
          asyncio.run(finish())

          c=sqlite3.connect('file:/data/db.sqlite?mode=ro',uri=True); c.row_factory=sqlite3.Row
          after={row['id']:dict(row) for row in c.execute('SELECT id,status,trigger,started_at,finished_at FROM ops_run WHERE id IN (?,?)',(OWNER_RUN,TARGET_RUN))}
          owner_job=dict(c.execute('SELECT id,status,event_id,updated_at FROM joboutbox WHERE id=66114').fetchone())
          c.close()
          if after[OWNER_RUN]['status']!='running' or owner_job['status']!='running' or after[TARGET_RUN]['status']!='failed':
              raise SystemExit(f'postcondition failed: ops={after} job={owner_job}')
          print(json.dumps({'status':'DUPLICATE_TERMINATED' if matches else 'DUPLICATE_ALREADY_GONE','matched_pid_count':len(matches),'killed_pid_count':len(killed),'ops':after,'production_job':owner_job},indent=2,default=str))
          PY
          e="$(base64 -w0 "$RUNNER_TEMP/kill.py")"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false --command "python3 -c \"import base64;exec(base64.b64decode('$e'))\"" | tee termination.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: duplicate-vector-termination, path: termination.json, if-no-files-found: error, retention-days: 7 }
      - name: Remove one-shot workflow
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main; git rebase origin/main; git rm .github/workflows/terminate-duplicate-vector-process-one-shot.yml
          git commit -m 'ops: remove duplicate vector termination workflow'; git push origin HEAD:main
