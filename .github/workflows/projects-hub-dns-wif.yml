name: Projects Hub DNS via Yandex WIF

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: projects-hub-dns-wif
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile projects-hub.kenigevents.ru A record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: region-talk-ydb-import
    env:
      YANDEX_WIF_OIDC_AUDIENCE: ${{ vars.YANDEX_WIF_OIDC_AUDIENCE }}
      YANDEX_WIF_SERVICE_ACCOUNT_ID: ${{ vars.YANDEX_WIF_SERVICE_ACCOUNT_ID }}
      DNS_ZONE_ID: dnsbhbtvj0l1lf8jpefb
      DNS_NAME: projects-hub.kenigevents.ru.
      EDGE_HOST: mcp-datahub.kenigevents.ru

    steps:
      - name: Exchange GitHub OIDC token for short-lived Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is required}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is required}"
          : "${YANDEX_WIF_OIDC_AUDIENCE:?YANDEX_WIF_OIDC_AUDIENCE is required}"
          : "${YANDEX_WIF_SERVICE_ACCOUNT_ID:?YANDEX_WIF_SERVICE_ACCOUNT_ID is required}"

          github_oidc="$({
            curl --fail --silent --show-error               --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               --get --data-urlencode "audience=${YANDEX_WIF_OIDC_AUDIENCE}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}"
          } | jq --exit-status --raw-output '.value | strings | select(length > 100)')"

          iam_response="$(curl --fail --silent --show-error             --request POST 'https://auth.yandex.cloud/oauth/token'             --header 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode "audience=${YANDEX_WIF_SERVICE_ACCOUNT_ID}"             --data-urlencode "subject_token=${github_oidc}"             --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"

          iam_token="$(printf '%s' "$iam_response" | jq --exit-status --raw-output '.access_token | strings | select(length > 20)')"
          echo "::add-mask::$iam_token"
          echo "YANDEX_IAM_TOKEN=$iam_token" >> "$GITHUB_ENV"

      - name: Reconcile one fixed A record
        shell: bash
        run: |
          set -euo pipefail
          : "${YANDEX_IAM_TOKEN:?short-lived IAM token is required}"
          : "${DNS_ZONE_ID:?zone id is required}"
          : "${DNS_NAME:?dns name is required}"

          mapfile -t ips < <(getent ahostsv4 "$EDGE_HOST" | awk '{print $1}' | sort -u)
          test "${#ips[@]}" -eq 1
          ip="${ips[0]}"
          [[ "$ip" =~ ^([0-9]{1,3}.){3}[0-9]{1,3}$ ]]
          echo "Fixed edge IPv4 resolved."

          record_url="https://dns.api.cloud.yandex.net/dns/v1/zones/${DNS_ZONE_ID}:getRecordSet"
          code="$(curl --silent --show-error             --output "$RUNNER_TEMP/record.json"             --write-out '%{http_code}'             --header "Authorization: Bearer ${YANDEX_IAM_TOKEN}"             --get             --data-urlencode "name=${DNS_NAME}"             --data-urlencode 'type=A'             "$record_url")"

          if [ "$code" = "200" ]; then
            current="$(jq -r '.data[]?' "$RUNNER_TEMP/record.json" | sort -u)"
            if [ "$current" = "$ip" ]; then
              echo "DNS record already matches fixed edge."
              exit 0
            fi
            echo "Refusing to overwrite conflicting Projects Hub A record." >&2
            exit 3
          fi

          if [ "$code" != "404" ]; then
            echo "Cloud DNS read failed with HTTP $code." >&2
            jq -c '{code,message}' "$RUNNER_TEMP/record.json" 2>/dev/null || true
            exit 4
          fi

          jq -n             --arg name "$DNS_NAME"             --arg ip "$ip"             '{merges:[{name:$name,type:"A",ttl:"300",data:[$ip]}]}'             > "$RUNNER_TEMP/upsert.json"

          curl --fail --silent --show-error             --request POST             --header "Authorization: Bearer ${YANDEX_IAM_TOKEN}"             --header 'Content-Type: application/json'             --data-binary "@$RUNNER_TEMP/upsert.json"             "https://dns.api.cloud.yandex.net/dns/v1/zones/${DNS_ZONE_ID}:upsertRecordSets"             > "$RUNNER_TEMP/operation.json"

          jq -e '.id | strings | length > 0' "$RUNNER_TEMP/operation.json" >/dev/null

          for attempt in $(seq 1 30); do
            sleep 2
            code="$(curl --silent --show-error               --output "$RUNNER_TEMP/readback.json"               --write-out '%{http_code}'               --header "Authorization: Bearer ${YANDEX_IAM_TOKEN}"               --get               --data-urlencode "name=${DNS_NAME}"               --data-urlencode 'type=A'               "$record_url")"
            if [ "$code" = "200" ] && [ "$(jq -r '.data[]?' "$RUNNER_TEMP/readback.json" | sort -u)" = "$ip" ]; then
              echo "PROJECTS_HUB_DNS_PASS"
              exit 0
            fi
          done

          echo "DNS mutation did not reach verified readback." >&2
          exit 5
