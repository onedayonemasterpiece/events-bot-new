name: Apply amber digest through production superadmin bot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-apply-amber-via-telegram-20260807.yml
      - scripts/ops/apply_amber_digest_via_telegram_20260807.py
      - scripts/ops/add_amber_excursion_digest_20260807.py

permissions:
  contents: read

concurrency:
  group: ops-apply-amber-via-telegram-20260807
  cancel-in-progress: false

jobs:
  apply:
    name: Dump, patch, restore and verify production digest
    environment: volunteer-monitor-canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TELEGRAM_GH_ACTIONS_API_ID: ${{ secrets.TELEGRAM_GH_ACTIONS_API_ID }}
      TELEGRAM_GH_ACTIONS_API_HASH: ${{ secrets.TELEGRAM_GH_ACTIONS_API_HASH }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned Telegram client
        run: python -m pip install --disable-pip-version-check 'Telethon==1.40.0'
      - name: Apply and verify exact production digest card
        run: python scripts/ops/apply_amber_digest_via_telegram_20260807.py
