name: Build standalone Region Talk transfer package

on:
  push:
    branches:
      - agent/region-talk-transfer-package-20260805
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install source dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prove source Region Talk baseline
        run: python -m pytest -q tests/test_region_talk*.py
      - name: Materialize migration tool
        env:
          MIGRATION_TOOL_GZIP_B64: 
        run: |
          python - <<'PYTOOL'
          import base64, gzip, os
          from pathlib import Path
          path = Path('transfer/tools/migrate_from_events_bot.py')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(gzip.decompress(base64.b64decode(os.environ['MIGRATION_TOOL_GZIP_B64'])))
          path.chmod(0o755)
          PYTOOL
      - name: Build standalone transfer tree
        run: >-
          python transfer/tools/migrate_from_events_bot.py
          --source .
          --target transfer
          --source-sha 5bbdb681623d5e4e0bff2133e487a6663c1a838a
      - name: Validate transferred runtime and full product suite
        run: |
          python -m compileall -q transfer/scripts transfer/kaggle transfer/tests
          cd transfer
          python scripts/run_region_talk_product_tests.py --full
      - name: Produce immutable transfer archive
        run: |
          tar -czf region-talk-transfer-5bbdb681.tar.gz -C transfer .
          sha256sum region-talk-transfer-5bbdb681.tar.gz > region-talk-transfer-5bbdb681.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: region-talk-transfer-5bbdb681
          path: |
            region-talk-transfer-5bbdb681.tar.gz
            region-talk-transfer-5bbdb681.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
