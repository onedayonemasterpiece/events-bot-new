name: Static site Search canary
run-name: Search canary · ${{ inputs.variant || github.event.action || github.event.schedule }} · ${{ inputs.platform || 'scheduled' }}

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Server-authoritative execution variant
        required: true
        default: cold_vector
        type: choice
        options: [cached_vector, cold_vector, cold_vector_llm, degraded_vector_fallback]
      platform:
        description: Independent Search stage
        required: true
        default: browser
        type: choice
        options: [browser, android, ios, mobile, all]
  repository_dispatch:
    types: [static-site-search-post-deploy]
  schedule:
    - cron: '17,47 * * * *'
    - cron: '23 */3 * * *'
    - cron: '41 1,7,13,19 * * *'
    - cron: '19 2 * * *'

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: static-site-search-${{ inputs.platform || github.event.schedule || github.event.action }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
      platform: ${{ steps.plan.outputs.platform }}
      blocking: ${{ steps.plan.outputs.blocking }}
      incident_key: ${{ steps.plan.outputs.incident_key }}
    steps:
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME:$SCHEDULE" in
            workflow_dispatch:*) variants="[\"$INPUT_VARIANT\"]"; platform="$INPUT_PLATFORM"; blocking=false ;;
            repository_dispatch:*) variants='["cold_vector","degraded_vector_fallback"]'; platform=browser; blocking=true ;;
            schedule:'17,47 * * * *') variants='["cached_vector"]'; platform=browser; blocking=false ;;
            schedule:'23 */3 * * *') variants='["cold_vector"]'; platform=browser; blocking=false ;;
            schedule:'41 1,7,13,19 * * *') variants='["cold_vector_llm"]'; platform=browser; blocking=false ;;
            schedule:'19 2 * * *') variants='["cached_vector"]'; platform=mobile; blocking=false ;;
            *) echo 'Unsupported Search trigger' >&2; exit 1 ;;
          esac
          case "$platform" in browser|android|ios|mobile|all) ;; *) exit 1;; esac
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          key="$(printf '%s-%s' "$platform" "$variants" | sha256sum | cut -c1-12)"
          echo "incident_key=$key" >> "$GITHUB_OUTPUT"

  browser:
    needs: plan
    if: ${{ needs.plan.outputs.platform == 'browser' || needs.plan.outputs.platform == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: { name: search-e2e }
    env:
      FLY_APP_NAME: ${{ vars.SEARCH_E2E_FLY_APP_NAME }}
      FLY_API_TOKEN: ${{ secrets.SEARCH_E2E_FLY_SSH_TOKEN }}
      AUTH_SESSION_BROKER_URL: ${{ secrets.SEARCH_E2E_AUTH_BROKER_URL }}
      AUTH_SESSION_BROKER_OIDC_AUDIENCE: kenigevents-static-search-broker
      PERSONALIZATION_SUPABASE_URL: ${{ vars.SEARCH_E2E_SUPABASE_URL }}
      PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEARCH_E2E_SUPABASE_PUBLISHABLE_KEY }}
      SEARCH_E2E_PERSONA_EMAIL_CACHED_BROWSER: ${{ secrets.SEARCH_E2E_PERSONA_EMAIL_CACHED_BROWSER }}
      SEARCH_E2E_PERSONA_EMAIL_COLD_BROWSER: ${{ secrets.SEARCH_E2E_PERSONA_EMAIL_COLD_BROWSER }}
      SEARCH_E2E_PERSONA_EMAIL_DEGRADED_BROWSER: ${{ secrets.SEARCH_E2E_PERSONA_EMAIL_DEGRADED_BROWSER }}
      E2E_SEARCH_PLATFORM: browser
      E2E_SEARCH_VARIANT: ${{ matrix.variant }}
      E2E_EVIDENCE_DIR: artifacts/search-live-browser-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22.22.0', cache: npm, cache-dependency-path: site/package-lock.json }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - run: npm --prefix site ci --no-audit --no-fund
      - working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Resolve latest accepted immutable Search target
        run: .github/scripts/resolve-static-search-target.sh
      - name: Bound scheduled LLM run to three non-paginated provider attempts
        if: ${{ matrix.variant == 'cold_vector_llm' }}
        run: |
          echo 'E2E_SEARCH_QUERIES_JSON=[{"id":"family_nature_v1","value":"На природу с детьми","paginate":false},{"id":"seaside_art_v1","value":"искусство у моря","paginate":false},{"id":"friday_free_v1","value":"в пятницу бесплатно","paginate":false}]' >> "$GITHUB_ENV"
      - name: Run exact-target fixture acceptance and Search journey
        run: node .github/scripts/run-browser-static-search.mjs
      - name: Upload sanitized Search evidence
        if: ${{ always() && hashFiles('artifacts/search-live-browser-*/.redaction-ok') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: search-live-browser-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/search-live-browser-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  android:
    needs: plan
    if: ${{ needs.plan.outputs.platform == 'android' || needs.plan.outputs.platform == 'mobile' || needs.plan.outputs.platform == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: { name: search-e2e }
    env:
      FLY_APP_NAME: ${{ vars.SEARCH_E2E_FLY_APP_NAME }}
      FLY_API_TOKEN: ${{ secrets.SEARCH_E2E_FLY_SSH_TOKEN }}
      AUTH_SESSION_BROKER_URL: ${{ secrets.SEARCH_E2E_AUTH_BROKER_URL }}
      AUTH_SESSION_BROKER_OIDC_AUDIENCE: kenigevents-static-search-broker
      E2E_SEARCH_PLATFORM: android
      E2E_SEARCH_VARIANT: cached_vector
      E2E_DEVICE_NAME: Pixel 7
      E2E_PLATFORM_VERSION: '15'
      E2E_APPIUM_HOST: 127.0.0.1
      E2E_APPIUM_PORT: '4723'
      E2E_APPIUM_PATH: /wd/hub
      E2E_EVIDENCE_DIR: artifacts/search-live-android-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22.22.0', cache: npm, cache-dependency-path: site/package-lock.json }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - run: npm --prefix site ci --no-audit --no-fund
      - working-directory: site
        run: npx appium driver list --installed
      - run: .github/scripts/resolve-static-search-target.sh
      - name: Issue a fresh device-bound callback
        run: node .github/scripts/issue-static-search-session.mjs
      - name: Enable KVM
        run: test -c /dev/kvm && sudo chmod 0666 /dev/kvm
      - name: Run native Android Chrome Search journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          working-directory: site
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -timezone UTC
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            npx appium --base-path /wd/hub --port 4723 --allow-insecure uiautomator2:chromedriver_autodownload > "${RUNNER_TEMP}/appium-search-android.log" 2>&1 &
            for n in $(seq 1 60); do curl -fsS http://127.0.0.1:4723/wd/hub/status >/dev/null && break; sleep 1; done
            npm run e2e:search-live
      - name: Upload sanitized Android evidence
        if: ${{ always() && hashFiles('site/artifacts/search-live-android-*/.redaction-ok') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: search-live-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/artifacts/search-live-android-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: plan
    if: ${{ needs.plan.outputs.platform == 'ios' || needs.plan.outputs.platform == 'mobile' || needs.plan.outputs.platform == 'all' }}
    runs-on: macos-15
    timeout-minutes: 45
    environment: { name: search-e2e }
    env:
      FLY_APP_NAME: ${{ vars.SEARCH_E2E_FLY_APP_NAME }}
      FLY_API_TOKEN: ${{ secrets.SEARCH_E2E_FLY_SSH_TOKEN }}
      AUTH_SESSION_BROKER_URL: ${{ secrets.SEARCH_E2E_AUTH_BROKER_URL }}
      AUTH_SESSION_BROKER_OIDC_AUDIENCE: kenigevents-static-search-broker
      E2E_SEARCH_PLATFORM: ios
      E2E_SEARCH_VARIANT: cached_vector
      E2E_DEVICE_NAME: iPhone 16
      E2E_PLATFORM_VERSION: '18.5'
      E2E_APPIUM_HOST: 127.0.0.1
      E2E_APPIUM_PORT: '4723'
      E2E_APPIUM_PATH: /wd/hub
      E2E_EVIDENCE_DIR: artifacts/search-live-ios-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.6.0
        with: { xcode-version: '16.4' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22.22.0', cache: npm, cache-dependency-path: site/package-lock.json }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - run: npm --prefix site ci --no-audit --no-fund
      - run: .github/scripts/resolve-static-search-target.sh
      - run: node .github/scripts/issue-static-search-session.mjs
      - name: Download matching WebDriverAgent
        working-directory: site
        run: npx appium driver run xcuitest download-wda -- --outdir "${RUNNER_TEMP}/search-wda" --platform iOS --kind sim
      - name: Create iOS simulator
        id: sim
        run: |
          udid="$(xcrun simctl create 'KenigEvents Search iPhone 16' 'com.apple.CoreSimulator.SimDeviceType.iPhone-16' 'com.apple.CoreSimulator.SimRuntime.iOS-18-5')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run native Mobile Safari Search journey
        working-directory: site
        env:
          E2E_DEVICE_UDID: ${{ steps.sim.outputs.udid }}
          E2E_PREBUILT_WDA_PATH: ${{ runner.temp }}/search-wda/WebDriverAgentRunner-Runner.app
        run: |
          npx appium --base-path /wd/hub --port 4723 > "${RUNNER_TEMP}/appium-search-ios.log" 2>&1 &
          for n in $(seq 1 120); do curl -fsS http://127.0.0.1:4723/wd/hub/status >/dev/null && break; sleep 1; done
          npm run e2e:search-live
      - name: Delete simulator
        if: ${{ always() && steps.sim.outputs.udid != '' }}
        run: xcrun simctl shutdown '${{ steps.sim.outputs.udid }}' || true; xcrun simctl delete '${{ steps.sim.outputs.udid }}' || true
      - name: Upload sanitized iOS evidence
        if: ${{ always() && hashFiles('site/artifacts/search-live-ios-*/.redaction-ok') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: search-live-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/artifacts/search-live-ios-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  terminal:
    if: ${{ always() }}
    needs: [plan, browser, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Emit blocking result and deduplicated repeated-failure incident
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: ${{ needs.browser.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          EVENT_NAME: ${{ github.event_name }}
          INCIDENT_KEY: ${{ needs.plan.outputs.incident_key }}
          VARIANTS: ${{ needs.plan.outputs.variants }}
        run: |
          set -euo pipefail
          failed=false
          for result in "$BROWSER" "$ANDROID" "$IOS"; do
            case "$result" in success|skipped) ;; *) failed=true;; esac
          done
          title="[Search canary] repeated failure ${INCIDENT_KEY}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ "$failed" = false ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
            exit 0
          fi
          repeated=false
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            repeated=true
          elif [ "$EVENT_NAME" = schedule ]; then
            prior="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/static-site-search-canary.yml/runs?event=schedule&status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // ""')"
            [ "$prior" = failure ] && repeated=true
          fi
          if [ "$repeated" = true ]; then
            body="Search canary failed repeatedly. Variants: ${VARIANTS}. Current sanitized run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No target/session/query evidence is copied into this issue."
            if [ -n "$existing" ]; then gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body";
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body";
            fi
          fi
          exit 1
