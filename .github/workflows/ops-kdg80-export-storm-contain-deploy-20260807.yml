name: Contain KDG80 export storm and deploy hotfix

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-kdg80-export-storm-contain-deploy-20260807.yml

permissions:
  contents: read

concurrency:
  group: kdg80-export-storm-contain-deploy-20260807
  cancel-in-progress: false

jobs:
  contain-deploy-verify:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: znanie-kgd80-fest
      KDG80_HOTFIX_SHA: 69ef8037f6bae118b79ac8812e08e893324b9001
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.78

      - name: Validate access and prepare the exact hotfix source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}"
          flyctl status --app "$FLY_APP" >/dev/null

          workdir="$RUNNER_TEMP/kdg80-hotfix"
          rm -rf "$workdir"
          git clone --quiet --filter=blob:none https://github.com/onedayonemasterpiece/kdg80.git "$workdir"
          git -C "$workdir" checkout --quiet --detach "$KDG80_HOTFIX_SHA"
          test "$(git -C "$workdir" rev-parse HEAD)" = "$KDG80_HOTFIX_SHA"
          grep -Fq 'memory = "512mb"' "$workdir/fly.toml"
          grep -Fq 'telegram_stale_export_update_skipped' "$workdir/registration/src/services/telegram-bot.ts"
          grep -Fq 'telegram_duplicate_export_update_skipped' "$workdir/registration/src/services/telegram-bot.ts"
          test -f "$workdir/registration/src/db/migrations/021_telegram_update_claims.sql"
          echo "KDG80_SOURCE_READY_SHA=$KDG80_HOTFIX_SHA"

      - name: Disable the webhook, drop the poisoned update queue, and stop the old machine
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/kdg80-contain.js" <<'JS'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          if (!token) throw new Error('TELEGRAM_BOT_TOKEN is missing in the Fly machine');

          async function call(method, params = {}) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams(params),
            });
            const payload = await response.json();
            if (!payload.ok) throw new Error(`${method} failed`);
            return payload.result;
          }

          const before = await call('getWebhookInfo');
          console.log(JSON.stringify({
            webhookBefore: Boolean(before.url),
            pendingBefore: Number(before.pending_update_count || 0),
            lastErrorBefore: Boolean(before.last_error_message),
          }));

          await call('deleteWebhook', { drop_pending_updates: 'true' });
          const after = await call('getWebhookInfo');
          console.log(JSON.stringify({
            webhookAfter: Boolean(after.url),
            pendingAfter: Number(after.pending_update_count || 0),
          }));

          if (after.url || Number(after.pending_update_count || 0) !== 0) {
            throw new Error('Telegram queue containment verification failed');
          }
          console.log('KDG80_WEBHOOK_DISABLED_AND_QUEUE_DROPPED=true');
          JS

          contain_log="$RUNNER_TEMP/kdg80-contain.log"
          flyctl ssh console \
            --app "$FLY_APP" \
            --pty=false \
            --command "sh -lc 'cat > /tmp/kdg80-contain.js && node /tmp/kdg80-contain.js'" \
            < "$RUNNER_TEMP/kdg80-contain.js" | tee "$contain_log"
          grep -Fxq 'KDG80_WEBHOOK_DISABLED_AND_QUEUE_DROPPED=true' "$contain_log"

          machine_json="$RUNNER_TEMP/kdg80-machines.json"
          if ! flyctl machines list --app "$FLY_APP" --json > "$machine_json" 2>/dev/null; then
            flyctl machine list --app "$FLY_APP" --json > "$machine_json"
          fi

          mapfile -t machine_ids < <(jq -r '.[] | select(.state == "started" or .state == "starting") | .id' "$machine_json")
          for machine_id in "${machine_ids[@]}"; do
            flyctl machine stop "$machine_id" --app "$FLY_APP"
            echo "STOPPED_OLD_MACHINE=$machine_id"
          done
          echo 'KDG80_OLD_RUNTIME_STOPPED=true'

      - name: Deploy the exact production-tested hotfix
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kdg80-hotfix"
          flyctl deploy \
            --app "$FLY_APP" \
            --config fly.toml \
            --remote-only \
            --ha=false \
            --yes
          echo "KDG80_DEPLOYED_SOURCE_SHA=$KDG80_HOTFIX_SHA"

      - name: Verify health, webhook recovery, queue state, migration, and running code
        shell: bash
        run: |
          set -euo pipefail

          healthy=false
          for _ in $(seq 1 36); do
            body="$(curl --silent --show-error --max-time 10 https://znanie-kgd80-fest.fly.dev/api/v1/health || true)"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              healthy=true
              break
            fi
            sleep 5
          done
          test "$healthy" = true
          echo 'KDG80_HEALTH_OK=true'

          cat > "$RUNNER_TEMP/kdg80-verify.js" <<'JS'
          const fs = require('node:fs');
          const Database = require('better-sqlite3');

          const token = process.env.TELEGRAM_BOT_TOKEN;
          if (!token) throw new Error('TELEGRAM_BOT_TOKEN is missing');

          async function call(method) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, { method: 'POST' });
            const payload = await response.json();
            if (!payload.ok) throw new Error(`${method} failed`);
            return payload.result;
          }

          const webhook = await call('getWebhookInfo');
          const expectedSuffix = '/api/v1/telegram/webhook';
          const webhookOk = Boolean(webhook.url) && String(webhook.url).endsWith(expectedSuffix);
          const pending = Number(webhook.pending_update_count || 0);

          const sourcePath = '/app/registration/src/services/telegram-bot.ts';
          const source = fs.readFileSync(sourcePath, 'utf8');
          const codeOk = source.includes('telegram_stale_export_update_skipped')
            && source.includes('telegram_duplicate_export_update_skipped')
            && source.includes('reply.code(200).send({ ok: true })');

          const db = new Database(process.env.SQLITE_PATH || '/data/registration.sqlite', { readonly: true });
          const quickCheck = String(db.pragma('quick_check', { simple: true }));
          const migration = db.prepare(
            "SELECT name FROM sqlite_master WHERE type='table' AND name='telegram_update_claims' LIMIT 1",
          ).get();
          const recentClaims = migration
            ? Number(db.prepare('SELECT COUNT(*) AS count FROM telegram_update_claims').get().count || 0)
            : -1;
          db.close();

          console.log(JSON.stringify({
            webhookOk,
            pending,
            lastErrorPresent: Boolean(webhook.last_error_message),
            codeOk,
            quickCheck,
            migrationPresent: Boolean(migration),
            recentClaims,
          }));

          if (!webhookOk) throw new Error('Webhook was not restored to the expected URL');
          if (pending !== 0) throw new Error(`Pending Telegram updates remain: ${pending}`);
          if (!codeOk) throw new Error('Running image does not contain the export idempotency hotfix');
          if (quickCheck.toLowerCase() !== 'ok') throw new Error(`SQLite quick_check failed: ${quickCheck}`);
          if (!migration) throw new Error('telegram_update_claims migration is missing');
          console.log('KDG80_EXPORT_STORM_HOTFIX_VERIFIED=true');
          JS

          verify_log="$RUNNER_TEMP/kdg80-verify.log"
          flyctl ssh console \
            --app "$FLY_APP" \
            --pty=false \
            --command "sh -lc 'cd /app/registration && cat > /tmp/kdg80-verify.cjs && node /tmp/kdg80-verify.cjs'" \
            < "$RUNNER_TEMP/kdg80-verify.js" | tee "$verify_log"
          grep -Fxq 'KDG80_EXPORT_STORM_HOTFIX_VERIFIED=true' "$verify_log"

          flyctl status --app "$FLY_APP"
          flyctl scale show --app "$FLY_APP"
