name: Prelaunch production root release 20260808

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/publish-prelaunch-root-20260808.sh'
      - '.github/workflows/prelaunch-root-release-20260808.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: prelaunch-production-root-release
  cancel-in-progress: false

jobs:
  publish-production-root:
    if: ${{ github.event.pull_request.head.ref == 'automation/prelaunch-control-20260804' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      KENIGEVENTS_SITE_YC_BUCKET: ${{ secrets.KENIGEVENTS_SITE_YC_BUCKET || vars.KENIGEVENTS_SITE_YC_BUCKET }}
      KENIGEVENTS_SITE_YC_ACCESS_KEY_ID: ${{ secrets.KENIGEVENTS_SITE_YC_ACCESS_KEY_ID || vars.KENIGEVENTS_SITE_YC_ACCESS_KEY_ID }}
      KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY: ${{ secrets.KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY }}
      KENIGEVENTS_SITE_YC_ENDPOINT: ${{ secrets.KENIGEVENTS_SITE_YC_ENDPOINT || vars.KENIGEVENTS_SITE_YC_ENDPOINT || 'https://storage.yandexcloud.net' }}
      KENIGEVENTS_SITE_YC_REGION: ${{ secrets.KENIGEVENTS_SITE_YC_REGION || vars.KENIGEVENTS_SITE_YC_REGION || 'ru-central1' }}
      KENIGEVENTS_SITE_PUBLIC_BASE_URL: ${{ secrets.KENIGEVENTS_SITE_PUBLIC_BASE_URL || vars.KENIGEVENTS_SITE_PUBLIC_BASE_URL || 'https://kenigevents.ru' }}
      PUBLIC_PERSONALIZATION_SUPABASE_URL: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_URL || vars.PUBLIC_PERSONALIZATION_SUPABASE_URL }}
      PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || vars.PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL || vars.PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL }}
    steps:
      - name: Checkout publication control branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Validate one-use production publisher
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/scripts/publish-prelaunch-root-20260808.sh | cut -d' ' -f1)" = 'df673401c03713ce400541ba27b0593894dd7b546598b6f538f9e4b699fb1375'
          bash -n .github/scripts/publish-prelaunch-root-20260808.sh
          chmod 700 .github/scripts/publish-prelaunch-root-20260808.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Publish exact approved prelaunch stub to production root
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-prelaunch-root-20260808.sh

      - name: Upload production-root release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prelaunch-production-root-${{ github.run_id }}
          path: artifacts/prelaunch-root-release
          if-no-files-found: warn
          retention-days: 30
