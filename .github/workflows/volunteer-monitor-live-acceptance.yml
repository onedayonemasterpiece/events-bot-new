name: Volunteer monitor live acceptance

on:
  pull_request:
    paths:
      - "volunteer_monitor/**"
      - "scripts/run_volunteer_monitor.py"
      - ".github/workflows/volunteer-monitor-live-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: volunteer-monitor-live-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-live-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install bounded monitor dependencies
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 requests playwright
          python -m playwright install --with-deps --only-shell chromium

      - name: Run read-only live specimen
        env:
          VOLUNTEER_MONITOR_PERMISSION_REFERENCE: owner-requested-read-only-canary-20260805
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/volunteer-monitor-evidence"
          PYTHONPATH=. python scripts/run_volunteer_monitor.py \
            --mode live_canary \
            --output "$RUNNER_TEMP/volunteer-monitor-live.json" \
            --evidence-dir "$RUNNER_TEMP/volunteer-monitor-evidence" \
            --max-items 24 \
            --max-more-clicks 12 \
            --detail-timeout-seconds 12

      - name: Upload live receipt and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: volunteer-monitor-live-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/volunteer-monitor-live.json
            ${{ runner.temp }}/volunteer-monitor-evidence
          if-no-files-found: warn
          retention-days: 14
