name: Inspect production bot role management paths

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-user-role-inventory-20260807.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Print role mutation and user command snippets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          needles = (
              'is_superadmin', 'handle_users', 'Command("users")', 'superadmin',
              'is_partner', 'Not authorized', 'blocked=', 'has_admin_access',
          )
          for path in Path('.').rglob('*.py'):
              if any(part in {'.git', '.venv', 'node_modules'} for part in path.parts):
                  continue
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
              if not hits:
                  continue
              merged=[]
              for i in hits:
                  start=max(0,i-15); end=min(len(lines),i+35)
                  if merged and start <= merged[-1][1]: merged[-1]=(merged[-1][0], max(merged[-1][1],end))
                  else: merged.append((start,end))
              for start,end in merged:
                  print(f'FILE={path} START={start+1} END={end}')
                  for n in range(start,end): print(f'{n+1:06d}: {lines[n]}')
                  print('---END---')
          PY
