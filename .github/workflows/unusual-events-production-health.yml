name: Unusual events production health
run-name: Unusual health · ${{ github.event_name }} · ${{ github.run_id }}.${{ github.run_attempt }}

on:
  pull_request:
    paths:
      - ".github/scripts/unusual-events-health-*"
      - ".github/workflows/unusual-events-production-health.yml"
      - "docs/features/unusual-events/unusual-events-health-*.json"
      - "docs/features/unusual-events/unusual-events-production-health-v1.schema.json"
      - "scripts/unusual_events_health*.py"
      - "tests/test_unusual_events_health*.py"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: Same-pipeline builder cache mode; auto requests cold only on Sunday.
        required: true
        default: auto
        type: choice
        options: [auto, warm, cold]

permissions:
  contents: read

concurrency:
  group: unusual-events-production-health-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run bounded health contract tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.4.1'
          python -m py_compile scripts/unusual_events_health.py .github/scripts/unusual-events-health-issue.py
          python -m json.tool docs/features/unusual-events/unusual-events-health-policy-v1.json >/dev/null
          python -m json.tool docs/features/unusual-events/unusual-events-health-resolver-v1.schema.json >/dev/null
          python -m json.tool docs/features/unusual-events/unusual-events-production-health-v1.schema.json >/dev/null
          python -m pytest -q tests/test_unusual_events_health.py

  production-health:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      FLY_API_TOKEN: ${{ secrets.UNUSUAL_EVENTS_HEALTH_FLY_TOKEN }}
      UNUSUAL_EVENTS_FLY_APP: ${{ vars.UNUSUAL_EVENTS_HEALTH_FLY_APP }}
      UNUSUAL_EVENTS_HEALTH_ROLLOUT_ENABLED: ${{ vars.UNUSUAL_EVENTS_HEALTH_ROLLOUT_ENABLED }}
      UNUSUAL_EVENTS_HEALTH_REQUEST_COMMAND: ${{ vars.UNUSUAL_EVENTS_HEALTH_REQUEST_COMMAND }}
      UNUSUAL_EVENTS_HEALTH_RESOLVER_COMMAND: ${{ vars.UNUSUAL_EVENTS_HEALTH_RESOLVER_COMMAND }}
      UNUSUAL_EVENTS_HEALTH_SAME_PIPELINE_COLD_SUPPORTED: ${{ vars.UNUSUAL_EVENTS_HEALTH_SAME_PIPELINE_COLD_SUPPORTED }}
      UNUSUAL_EVENTS_BASE_URL: ${{ vars.UNUSUAL_EVENTS_BASE_URL }}
      HEALTH_FILE: artifacts/health.json
      SCREENSHOT_DIR: artifacts/browser
      BROWSER_RECEIPT: artifacts/browser-receipt.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1

      - name: Restore the previous bounded health result
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p previous raw artifacts
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=unusual-events-production-health-state&per_page=100" \
              --jq ".artifacts | map(select(.expired == false and ((.workflow_run.id // 0) | tostring) != \"${GITHUB_RUN_ID}\")) | sort_by(.created_at) | reverse | .[0].id // empty"
          )"
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/unusual-health-state.zip"
            unzip -q "$RUNNER_TEMP/unusual-health-state.zip" -d previous
          fi

      - name: Resolve requested same-pipeline mode
        id: mode
        shell: bash
        env:
          MANUAL_MODE: ${{ inputs.run_mode || 'auto' }}
        run: |
          set -euo pipefail
          mode="$MANUAL_MODE"
          if [[ "$mode" == auto ]]; then
            if [[ "$(date -u +%u)" == 7 ]]; then mode=cold; else mode=warm; fi
          fi
          [[ "$mode" == warm || "$mode" == cold ]]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Request and resolve the existing StaticSiteBuilder pipeline
        id: collect
        continue-on-error: true
        shell: bash
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p raw artifacts
          blocked() {
            python scripts/unusual_events_health.py blocked \
              --code "$1" --message "$2" \
              --output artifacts/health.json --markdown-output artifacts/health.md || true
            return 0
          }
          if [[ "${UNUSUAL_EVENTS_HEALTH_ROLLOUT_ENABLED:-}" != true ]]; then
            blocked rollout_gate_closed "The production health request gate is not enabled."
            exit 0
          fi
          if [[ "$RUN_MODE" == cold && "${UNUSUAL_EVENTS_HEALTH_SAME_PIPELINE_COLD_SUPPORTED:-}" != true ]]; then
            blocked same_pipeline_cold_unsupported "The existing builder has no integrated cacheless health request yet; no direct Kaggle launch was attempted."
            exit 0
          fi
          if [[ -z "${UNUSUAL_EVENTS_FLY_APP:-}" || -z "${FLY_API_TOKEN:-}" || -z "${UNUSUAL_EVENTS_HEALTH_REQUEST_COMMAND:-}" || -z "${UNUSUAL_EVENTS_HEALTH_RESOLVER_COMMAND:-}" ]]; then
            blocked same_pipeline_configuration_missing "Fly app, token, request command, or resolver command is missing."
            exit 0
          fi
          flyctl ssh console --app "$UNUSUAL_EVENTS_FLY_APP" --command "$UNUSUAL_EVENTS_HEALTH_REQUEST_COMMAND $RUN_MODE" > raw/request.json
          request_id="$(python scripts/unusual_events_health.py validate-request --input raw/request.json --expected-mode "$RUN_MODE")"
          resolver_command="${UNUSUAL_EVENTS_HEALTH_RESOLVER_COMMAND//\{request_id\}/$request_id}"
          flyctl ssh console --app "$UNUSUAL_EVENTS_FLY_APP" --command "$resolver_command" > raw/resolver.json
          args=(
            evaluate-bundle --input raw/resolver.json
            --output artifacts/health.json --markdown-output artifacts/health.md
          )
          previous="$(find previous -type f -name health.json -print -quit 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then args+=(--previous-health "$previous"); fi
          set +e
          python scripts/unusual_events_health.py "${args[@]}"
          rc=$?
          set -e
          echo "$rc" > artifacts/evaluator-exit-code.txt

      - name: Produce honest evidence when collection itself failed
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s artifacts/health.json ]]; then
            python scripts/unusual_events_health.py blocked \
              --code same_pipeline_collection_failed \
              --message "The Fly SSH request/resolver did not produce a valid bounded health contract." \
              --output artifacts/health.json --markdown-output artifacts/health.md || true
          fi
          python .github/scripts/unusual-events-health-issue.py \
            --health artifacts/health.json --output artifacts/issue-plan.json
          cat artifacts/health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Apply persistent issue plan
        if: ${{ always() && hashFiles('artifacts/issue-plan.json') != '' }}
        continue-on-error: true
        run: >-
          python .github/scripts/unusual-events-health-issue.py
          --health artifacts/health.json
          --output artifacts/issue-plan.json
          --apply --repository "$GITHUB_REPOSITORY"

      - name: Upload bounded health, summary, and issue plan
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unusual-events-production-health-state
          path: |
            artifacts/health.json
            artifacts/health.md
            artifacts/issue-plan.json
            artifacts/evaluator-exit-code.txt
          if-no-files-found: error
          retention-days: 90

      - name: Enforce INCIDENT failure and WATCH success
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('artifacts/health.json').read_text())
          status = health.get('health_status')
          if status == 'INCIDENT':
              raise SystemExit(2)
          if status not in {'HEALTHY', 'WATCH'}:
              raise SystemExit('unknown health status')
          PY
