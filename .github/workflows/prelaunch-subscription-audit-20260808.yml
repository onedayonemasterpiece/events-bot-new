name: Prelaunch subscription private audit 20260808

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prelaunch-subscription-audit-20260808.yml'

permissions:
  contents: read

jobs:
  read-production-secret-names:
    if: ${{ github.event.pull_request.head.ref == 'automation/prelaunch-control-20260804' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Print available production secret and variable names only
        shell: bash
        env:
          SECRET_NAMES_JSON: ${{ toJSON(secrets) }}
          VARIABLE_NAMES_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          echo 'SCOPE=production'
          printf '%s' "$SECRET_NAMES_JSON" | jq -r 'keys[] | "SECRET_NAME=" + .'
          printf '%s' "$VARIABLE_NAMES_JSON" | jq -r 'keys[] | "VARIABLE_NAME=" + .'
