name: Prelaunch visual review

on:
  push:
    branches:
      - agent/prelaunch-landing-20260803
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/prelaunch-visual-review.trigger'
      - '.github/workflows/prelaunch-visual-review.yml'
      - 'docs/features/static-site-pages/prelaunch.md'
      - 'docs/features/static-site-pages/prelaunch-handoff/**'
      - 'site/scripts/prepare-prelaunch-artwork.mjs'
      - 'site/src/components/PrelaunchPage.astro'
      - 'site/src/layouts/PrelaunchLayout.astro'
      - 'site/src/pages/index.astro'
      - 'site/src/lib/prelaunchEmail.ts'
      - 'site/src/lib/prelaunchEmail.test.ts'
      - 'site/src/scripts/prelaunchScene.ts'
      - 'site/src/scripts/prelaunchForm.ts'
      - 'site/src/styles/prelaunch-page.css'
      - 'site/scripts/check-prelaunch-scene.mjs'
      - 'site/scripts/check-prelaunch-viewport-fit.mjs'
      - 'site/scripts/check-prelaunch-form-security.mjs'
      - 'site/tests/prelaunch-landing.test.mjs'
      - 'site/tests/prelaunch-experience.test.mjs'
      - 'site/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prelaunch-visual-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run source and release contracts
        run: npm --prefix site run test:static-release

      - name: Build deterministic prelaunch artifact
        env:
          PUBLIC_PRELAUNCH_MODE: 'on'
          PUBLIC_PERSONALIZATION_SUPABASE_URL: https://direct.test
          PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL: https://relay.test
          PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY: prelaunch-actions-public-test-key
        run: npm --prefix site run build

      - name: Start immutable local artifact server
        run: |
          python3 -m http.server 4173 --directory site/dist > /tmp/prelaunch-http.log 2>&1 &
          echo $! > /tmp/prelaunch-http.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/prelaunch-http.log
          exit 1

      - name: Capture scene, viewport and resilient-form evidence
        shell: bash
        run: |
          set +e
          set -uo pipefail
          artifact_dir='artifacts/prelaunch-browser'
          mkdir -p "$artifact_dir/reference"

          npm --prefix site run check:prelaunch-scene -- \
            --url http://127.0.0.1:4173/ \
            --artifact-dir ../artifacts/prelaunch-browser
          scene_status=$?

          node site/scripts/check-prelaunch-viewport-fit.mjs \
            --url http://127.0.0.1:4173/ \
            --artifact-dir "$artifact_dir"
          viewport_status=$?

          node site/scripts/check-prelaunch-form-security.mjs \
            --url http://127.0.0.1:4173/ \
            --artifact-dir "$artifact_dir"
          form_status=$?

          cp docs/features/static-site-pages/prelaunch-handoff/reference/target-desktop.webp \
            "$artifact_dir/reference/target-desktop.webp"
          cp docs/features/static-site-pages/prelaunch-handoff/reference/PWA-icon.webp \
            "$artifact_dir/reference/PWA-icon.webp"
          cp docs/features/static-site-pages/prelaunch-handoff/reference/generated-lighting-desktop-v1.webp \
            "$artifact_dir/reference/generated-lighting-desktop-v1.webp"
          cp docs/features/static-site-pages/prelaunch-handoff/reference/generated-lighting-mobile-v1.webp \
            "$artifact_dir/reference/generated-lighting-mobile-v1.webp"

          repository_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$repository_sha" > "$artifact_dir/repository-sha.txt"
          cat > "$artifact_dir/github-actions-gates.json" <<JSON
          {
            "repository_sha": "$repository_sha",
            "scene_exit": $scene_status,
            "viewport_fit_exit": $viewport_status,
            "form_security_exit": $form_status,
            "manual_visual_review_required": true
          }
          JSON

          combined=0
          for status in "$scene_status" "$viewport_status" "$form_status"; do
            if [[ "$status" -ne 0 ]]; then combined=1; fi
          done
          exit "$combined"

      - name: Stop local server
        if: always()
        run: |
          if [[ -f /tmp/prelaunch-http.pid ]]; then
            kill "$(cat /tmp/prelaunch-http.pid)" || true
          fi
          cat /tmp/prelaunch-http.log || true

      - name: Upload complete visual and form evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-evidence-${{ github.run_id }}
          path: artifacts/prelaunch-browser
          if-no-files-found: error
          retention-days: 14
