name: Copy Supabase secrets to KDG80 registration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      SOURCE_APP: events-bot-new-wngqia
      TARGET_APP: znanie-kgd80-fest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Copy runtime Supabase secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tmp_raw="$(mktemp)"
          tmp_env="$(mktemp)"
          trap 'rm -f "$tmp_raw" "$tmp_env"' EXIT

          flyctl ssh console -a "$SOURCE_APP" -C 'python3 - <<'"'"'PY'"'"'
          import os
          import shlex

          keys = [
              "SUPABASE_URL",
              "SUPABASE_KEY",
              "SUPABASE_SERVICE_KEY",
              "SUPABASE_SCHEMA",
              "SUPABASE_BUCKET",
              "SUPABASE_ICS_BUCKET",
              "SUPABASE_MEDIA_BUCKET",
          ]

          for key in keys:
              value = os.environ.get(key)
              if value:
                  print(f"{key}={shlex.quote(value)}")
          PY' > "$tmp_raw"

          grep '^SUPABASE_' "$tmp_raw" > "$tmp_env"
          source "$tmp_env"

          required=(SUPABASE_URL SUPABASE_KEY)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required source secret: $key" >&2
              exit 1
            fi
          done

          keys=(
            SUPABASE_URL
            SUPABASE_KEY
            SUPABASE_SERVICE_KEY
            SUPABASE_SCHEMA
            SUPABASE_BUCKET
            SUPABASE_ICS_BUCKET
            SUPABASE_MEDIA_BUCKET
          )

          copied=()
          args=(secrets set -a "$TARGET_APP")
          for key in "${keys[@]}"; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              args+=("$key=$value")
              copied+=("$key")
            fi
          done

          flyctl "${args[@]}"
          printf 'Copied Supabase keys: %s\n' "${copied[*]}"
