name: Bootstrap tile mosaic material lab

on:
  pull_request:
    branches:
      - feature/static-launch-tile-mosaic-20260803
    paths:
      - .github/workflows/tile-mosaic-material-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tile-mosaic-material-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout laboratory branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Restore reviewed text payload
        shell: bash
        env:
          PAYLOAD_SHA256: 0a8736c380fa8604a5f3bcd342a007be0d467f19ff4962151f3f8c39228e6800
        run: |
          set -euo pipefail
          cat .github/tile-mosaic-bootstrap/payload.*.b64 \
            | base64 --decode > /tmp/tile-mosaic-material-lab.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/tile-mosaic-material-lab.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/tile-mosaic-material-lab.tar.gz | tee /tmp/tile-mosaic-material-lab.files
          if grep -E '(^/|(^|/)\.\.(/|$))' /tmp/tile-mosaic-material-lab.files; then
            echo 'Unsafe path in bootstrap payload.' >&2
            exit 1
          fi
          tar -xzf /tmp/tile-mosaic-material-lab.tar.gz -C .
          mv .github/workflows/tile-mosaic-material-lab.yml \
            .github/tile-mosaic-bootstrap/tile-mosaic-material-lab.yml.pending
          find .github/tile-mosaic-bootstrap -maxdepth 1 -name 'payload.*.b64' -delete

      - name: Compile, test and publish materialized laboratory
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow==12.2.0'
          python -m compileall -q tools/tile_mosaic tests/test_tile_mosaic_*.py
          python -m unittest discover -s tests -p 'test_tile_mosaic_*.py' -v
          git add -A .github/tile-mosaic-bootstrap \
            docs/features/static-site-pages/tile-mosaic-material-generator.md \
            docs/review-data/tile-mosaic-material-lab \
            tests/test_tile_mosaic_*.py tests/__init__.py \
            tools/__init__.py tools/tile_mosaic
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(tile-mosaic): materialize reproducible material laboratory'
          git push origin "HEAD:${HEAD_BRANCH}"
