name: Prelaunch visual control

# Updating the request file launches a mergeable pull_request run that checks
# an exact SHA from the long-lived prelaunch branch. This is the supported
# indirect trigger for integrations without direct workflow_dispatch access.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/prelaunch-visual-control.request'
      - '.github/workflows/prelaunch-visual-control.yml'

permissions:
  contents: read

concurrency:
  group: prelaunch-visual-control-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout control request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_file='.github/prelaunch-visual-control.request'
          test -f "$request_file"

          request_id=$(sed -n 's/^request_id=//p' "$request_file" | tail -n 1)
          target_branch=$(sed -n 's/^target_branch=//p' "$request_file" | tail -n 1)
          target_sha=$(sed -n 's/^target_sha=//p' "$request_file" | tail -n 1)

          [[ "$request_id" =~ ^[A-Za-z0-9._-]{8,120}$ ]]
          [[ "$target_branch" == 'agent/prelaunch-landing-20260803' ]]
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]

          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact prelaunch SHA
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          actual_sha=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "Target branch moved: requested=$TARGET_SHA actual=$actual_sha" >&2
            exit 1
          fi
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run source and release contracts
        run: npm --prefix site run test:static-release

      - name: Build prelaunch root
        env:
          PUBLIC_PRELAUNCH_MODE: 'on'
        run: npm --prefix site run build

      - name: Start immutable local artifact server
        run: |
          python3 -m http.server 4173 --directory site/dist > /tmp/prelaunch-http.log 2>&1 &
          echo $! > /tmp/prelaunch-http.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/prelaunch-http.log
          exit 1

      - name: Capture visual, no-scroll and light-model evidence
        id: visual_gate
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/prelaunch-browser/reference

          set +e
          npm --prefix site run check:prelaunch-browser -- \
            --url http://127.0.0.1:4173/ \
            --artifact-dir ../artifacts/prelaunch-browser
          visual_status=$?

          node site/scripts/check-prelaunch-viewport-fit.mjs \
            --url http://127.0.0.1:4173/ \
            --artifact-dir artifacts/prelaunch-browser
          fit_status=$?

          node site/scripts/check-prelaunch-light-model.mjs \
            --url http://127.0.0.1:4173/ \
            --artifact-dir artifacts/prelaunch-browser
          light_status=$?
          set -e

          cp docs/features/static-site-pages/prelaunch-handoff/reference/target-desktop.webp \
            artifacts/prelaunch-browser/reference/target-desktop.webp
          cp docs/features/static-site-pages/prelaunch-handoff/reference/PWA-icon.webp \
            artifacts/prelaunch-browser/reference/PWA-icon.webp
          printf '%s\n' "$TARGET_SHA" > artifacts/prelaunch-browser/repository-sha.txt

          combined_status=0
          if [[ "$visual_status" -ne 0 || "$fit_status" -ne 0 || "$light_status" -ne 0 ]]; then
            combined_status=1
          fi

          cat > artifacts/prelaunch-browser/control-receipt.json <<EOF
          {
            "schema_version": "prelaunch_visual_control_receipt_v3",
            "request_id": "$REQUEST_ID",
            "target_sha": "$TARGET_SHA",
            "control_run_id": "$GITHUB_RUN_ID",
            "control_run_attempt": "$GITHUB_RUN_ATTEMPT",
            "visual_gate_exit_code": $visual_status,
            "viewport_fit_exit_code": $fit_status,
            "light_model_exit_code": $light_status,
            "combined_exit_code": $combined_status
          }
          EOF
          exit "$combined_status"

      - name: Stop local server
        if: always()
        run: |
          if [[ -f /tmp/prelaunch-http.pid ]]; then
            kill "$(cat /tmp/prelaunch-http.pid)" || true
          fi
          cat /tmp/prelaunch-http.log || true

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-visual-control-${{ github.run_id }}
          path: artifacts/prelaunch-browser
          if-no-files-found: error
          retention-days: 14
