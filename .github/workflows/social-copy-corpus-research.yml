name: Social copy corpus research

on:
  push:
    branches:
      - agent/social-copy-corpus-run-2026-08-06
    paths:
      - tools/social_copy_corpus_research/**
      - .github/workflows/social-copy-corpus-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-copy-corpus-research
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    env:
      # Prefer the token names already used by the application; the fallbacks
      # cover older production secret names without exposing any value.
      VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN || secrets.VK_ACCESS_TOKEN4 || secrets.VK_ACCESS_TOKEN || secrets.VK_API_TOKEN || secrets.VK_SERVICE_TOKEN || secrets.VK_TOKEN }}
      TELEGRAM_AUTH_BUNDLE_CHECK_POPULAR: ${{ secrets.TELEGRAM_AUTH_BUNDLE_CHECK_POPULAR }}
      TELEGRAM_AUTH_BUNDLE_S22: ${{ secrets.TELEGRAM_AUTH_BUNDLE_S22 }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Collect bounded samples
        run: |
          python tools/social_copy_corpus_research/collect.py \
            --sources tools/social_copy_corpus_research/sources.json \
            --out social-copy-corpus-output \
            --target 100

      - name: Publish sanitized run summary
        if: always()
        run: |
          if [ -f social-copy-corpus-output/persist/run_summary.json ]; then
            {
              echo '## Social copy corpus collection'
              echo '```json'
              cat social-copy-corpus-output/persist/run_summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload short-lived research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-copy-corpus-2026-08-06
          path: social-copy-corpus-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
