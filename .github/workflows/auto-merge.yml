name: Auto ready + enable auto-merge (disabled)

# Release-control invariant: Draft PRs must never be made ready or merged by a
# workflow. A human-controlled release may invoke this no-op workflow only as
# an audit receipt; readiness and merge remain explicit GitHub operations.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm automatic merge is disabled
        run: echo "Draft readiness and merge require an explicit controlled release"
