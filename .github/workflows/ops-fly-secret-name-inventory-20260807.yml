name: Inventory Fly credential names without values

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-fly-secret-name-inventory-20260807.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Print Fly credential variable names only
        shell: bash
        run: |
          set -euo pipefail
          echo CURRENT_TREE_NAMES_START
          git grep -IhoE 'FLY_[A-Z0-9_]+' -- . ':!*.sqlite' ':!*.db' 2>/dev/null | sort -u || true
          echo CURRENT_TREE_NAMES_END
          echo HISTORY_NAMES_START
          git rev-list --all | while read -r commit; do
            git grep -IhoE 'FLY_[A-Z0-9_]+' "$commit" -- .github docs scripts 2>/dev/null || true
          done | sort -u
          echo HISTORY_NAMES_END
          echo SECRET_REFERENCES_START
          git grep -IhoE 'secrets\.[A-Z0-9_]+' -- .github 2>/dev/null | sort -u || true
          echo SECRET_REFERENCES_END
