name: Inventory referenced credential names

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-secret-reference-inventory-20260807.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Print secret reference names only
        shell: bash
        run: |
          set -euo pipefail
          echo CURRENT_SECRET_NAMES_START
          git grep -IhoE 'secrets\.[A-Z0-9_]+' -- .github 2>/dev/null | sed 's/^secrets\.//' | sort -u || true
          echo CURRENT_SECRET_NAMES_END
          echo HISTORY_SECRET_NAMES_START
          git rev-list --all | while read -r commit; do
            git grep -IhoE 'secrets\.[A-Z0-9_]+' "$commit" -- .github 2>/dev/null || true
          done | sed 's/^secrets\.//' | sort -u
          echo HISTORY_SECRET_NAMES_END
