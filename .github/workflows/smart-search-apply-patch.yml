name: Smart Search apply implementation patch

on:
  push:
    branches: [integration/smart-search-live-e2e-20260803]
    paths: [.github/smart-search-patch/ZZ-APPLY]
  pull_request:
    branches: [main]
    paths: [.github/smart-search-patch/ZZ-APPLY]

permissions:
  contents: write

concurrency:
  group: smart-search-implementation-patch
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: integration/smart-search-live-e2e-20260803
          fetch-depth: 0
      - name: Apply reviewed implementation patch and remove one-shot scaffolding
        run: |
          set -euo pipefail
          cat .github/smart-search-patch/*.part > "${RUNNER_TEMP}/smart-search-implementation.patch"
          git apply --check "${RUNNER_TEMP}/smart-search-implementation.patch"
          git apply "${RUNNER_TEMP}/smart-search-implementation.patch"
          rm -rf \
            .github/smart-search-patch \
            .github/workflows/smart-search-source-export.yml \
            .github/workflows/smart-search-apply-patch.yml
          git config user.name 'codex-agent'
          git config user.email 'codex-agent@example.local'
          git add -A
          git diff --cached --check
          git commit -m 'Implement live Smart Search E2E and transport matrix'
          git push origin HEAD:integration/smart-search-live-e2e-20260803
