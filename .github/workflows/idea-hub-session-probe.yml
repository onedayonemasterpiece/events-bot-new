name: Temporary Idea Hub Telegram session probe

on:
  pull_request:
    paths:
      - ".github/workflows/idea-hub-session-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
      TG_PREMIUM_EMOJI_SESSION: ${{ secrets.TG_PREMIUM_EMOJI_SESSION }}
      TELEGRAM_AUTH_BUNDLE: ${{ secrets.TELEGRAM_AUTH_BUNDLE }}
      TELEGRAM_AUTH_BUNDLE_E2E: ${{ secrets.TELEGRAM_AUTH_BUNDLE_E2E }}
      TELEGRAM_AUTH_BUNDLE_CHECK_POPULAR: ${{ secrets.TELEGRAM_AUTH_BUNDLE_CHECK_POPULAR }}
      TG_PREMIUM_EMOJI_AUTH_BUNDLE: ${{ secrets.TG_PREMIUM_EMOJI_AUTH_BUNDLE }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      SOCIAL_METRICS_TG_API_ID: ${{ secrets.SOCIAL_METRICS_TG_API_ID }}
      TG_PREMIUM_EMOJI_API_ID: ${{ secrets.TG_PREMIUM_EMOJI_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      SOCIAL_METRICS_TG_API_HASH: ${{ secrets.SOCIAL_METRICS_TG_API_HASH }}
      TG_PREMIUM_EMOJI_API_HASH: ${{ secrets.TG_PREMIUM_EMOJI_API_HASH }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Telegram client
        run: python -m pip install --disable-pip-version-check telethon==1.44.0
      - name: Verify authorization without reading chats
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import base64
          import json
          import os
          import sys

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          def first(*names):
              for name in names:
                  value = os.environ.get(name, "").strip()
                  if value:
                      return value
              return None

          def parse_bundle(raw):
              candidates = [raw]
              try:
                  candidates.append(base64.b64decode(raw, validate=True).decode("utf-8"))
              except Exception:
                  pass
              for candidate in candidates:
                  try:
                      value = json.loads(candidate)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(value, dict):
                      lowered = {str(key).lower(): item for key, item in value.items()}
                      session = first_dict(lowered, "session", "string_session", "session_string", "telegram_session")
                      api_id = first_dict(lowered, "api_id", "tg_api_id", "telegram_api_id")
                      api_hash = first_dict(lowered, "api_hash", "tg_api_hash", "telegram_api_hash")
                      if session and api_id and api_hash:
                          return session, api_id, api_hash
              return None

          def first_dict(value, *names):
              for name in names:
                  item = value.get(name)
                  if item is not None and str(item).strip():
                      return str(item).strip()
              return None

          bundle = first(
              "TELEGRAM_AUTH_BUNDLE",
              "TELEGRAM_AUTH_BUNDLE_E2E",
              "TELEGRAM_AUTH_BUNDLE_CHECK_POPULAR",
              "TG_PREMIUM_EMOJI_AUTH_BUNDLE",
          )
          parsed = parse_bundle(bundle) if bundle else None
          if parsed:
              session, api_id, api_hash = parsed
          else:
              session = first("TELEGRAM_SESSION", "TG_SESSION", "TELETHON_SESSION", "TG_PREMIUM_EMOJI_SESSION")
              api_id = first("TG_API_ID", "TELEGRAM_API_ID", "SOCIAL_METRICS_TG_API_ID", "TG_PREMIUM_EMOJI_API_ID")
              api_hash = first("TG_API_HASH", "TELEGRAM_API_HASH", "SOCIAL_METRICS_TG_API_HASH", "TG_PREMIUM_EMOJI_API_HASH")

          if not session or not api_id or not api_hash:
              print("IDEA_HUB_SESSION_PROBE=missing_credentials")
              sys.exit(2)

          async def main():
              client = TelegramClient(
                  StringSession(session),
                  int(api_id),
                  api_hash,
                  device_model="GitHub Actions idea-hub probe",
                  system_version="Linux",
                  app_version="idea-hub-probe/0.1",
              )
              await client.connect()
              try:
                  if not await client.is_user_authorized():
                      print("IDEA_HUB_SESSION_PROBE=unauthorized")
                      return 3
                  print("IDEA_HUB_SESSION_PROBE=authorized")
                  return 0
              finally:
                  await client.disconnect()

          raise SystemExit(asyncio.run(main()))
          PY
