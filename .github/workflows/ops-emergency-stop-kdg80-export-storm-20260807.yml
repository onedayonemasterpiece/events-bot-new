name: Emergency stop KDG80 Telegram export retry storm

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-emergency-stop-kdg80-export-storm-20260807.yml

permissions:
  contents: read

concurrency:
  group: emergency-stop-kdg80-export-storm-20260807
  cancel-in-progress: false

jobs:
  contain:
    environment: volunteer-monitor-canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TELEGRAM_GH_ACTIONS_API_ID: ${{ secrets.TELEGRAM_GH_ACTIONS_API_ID }}
      TELEGRAM_GH_ACTIONS_API_HASH: ${{ secrets.TELEGRAM_GH_ACTIONS_API_HASH }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned Telegram client
        run: python -m pip install --disable-pip-version-check 'Telethon==1.40.0'

      - name: Obtain the exact bot token through BotFather and drop queued updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import asyncio
          import base64
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          TARGET_BOT_ID = 8582027786
          TARGET_BOT_USERNAME = "kgd80regbot"
          TARGET_BOT_TITLE = "kgd80bot"
          TOKEN_RE = re.compile(r"\b\d{8,12}:[A-Za-z0-9_-]{30,}\b")


          def decode_bundle(value: str) -> dict:
              raw = str(value or "").strip()
              if not raw:
                  raise RuntimeError("Telegram auth bundle is empty")
              if raw.startswith("{"):
                  data = json.loads(raw)
              else:
                  padded = raw + ("=" * (-len(raw) % 4))
                  try:
                      decoded = base64.urlsafe_b64decode(padded.encode("ascii")).decode("utf-8")
                  except Exception:
                      decoded = base64.b64decode(padded.encode("ascii")).decode("utf-8")
                  data = json.loads(decoded)
              if not isinstance(data, dict) or not data.get("session"):
                  raise RuntimeError("Telegram auth bundle has no session")
              return data


          def bot_api(token: str, method: str, params: dict | None = None) -> dict:
              body = urllib.parse.urlencode(params or {}).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=body,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"Bot API {method} returned HTTP {error.code}") from error
              if payload.get("ok") is not True:
                  raise RuntimeError(f"Bot API {method} failed")
              return payload


          def buttons(message):
              return [button for row in (message.buttons or []) for button in row]


          def button_labels(message) -> list[str]:
              return [str(button.text or "").strip() for button in buttons(message)]


          def choose_button(message, candidates: list[str]):
              folded_candidates = [candidate.casefold() for candidate in candidates if candidate]
              for button in buttons(message):
                  text = str(button.text or "").strip()
                  folded = text.casefold()
                  if any(candidate == folded or candidate in folded or folded in candidate for candidate in folded_candidates):
                      return button
              return None


          async def wait_new_message(client, peer, after_id: int, timeout: int = 30):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  messages = await client.get_messages(peer, limit=30)
                  candidates = sorted(
                      [message for message in messages if int(message.id) > int(after_id) and not message.out],
                      key=lambda message: int(message.id),
                  )
                  if candidates:
                      return candidates[-1]
                  await asyncio.sleep(0.4)
              raise TimeoutError("BotFather did not send a new message")


          async def wait_changed_or_new(client, peer, original, old_labels: list[str], timeout: int = 30):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  refreshed = await client.get_messages(peer, ids=int(original.id))
                  if refreshed and button_labels(refreshed) != old_labels:
                      return refreshed
                  messages = await client.get_messages(peer, limit=20)
                  newer = sorted(
                      [message for message in messages if int(message.id) > int(original.id) and not message.out],
                      key=lambda message: int(message.id),
                  )
                  if newer:
                      return newer[-1]
                  await asyncio.sleep(0.4)
              raise TimeoutError("BotFather menu did not change")


          async def wait_token_message(client, peer, original_id: int, timeout: int = 30) -> str:
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  candidates = []
                  same = await client.get_messages(peer, ids=original_id)
                  if same:
                      candidates.append(same)
                  candidates.extend(await client.get_messages(peer, limit=30))
                  for message in candidates:
                      match = TOKEN_RE.search(str(message.raw_text or ""))
                      if match:
                          return match.group(0)
                  await asyncio.sleep(0.4)
              raise TimeoutError("BotFather did not return an API token")


          async def token_from_botfather(client: TelegramClient) -> str:
              botfather = await client.get_entity("BotFather")
              command = await client.send_message(botfather, "/mybots")
              menu = await wait_new_message(client, botfather, int(command.id))
              target_candidates = [
                  TARGET_BOT_USERNAME,
                  "@" + TARGET_BOT_USERNAME,
                  TARGET_BOT_TITLE,
              ]

              bot_button = choose_button(menu, target_candidates)
              visited: set[tuple[str, ...]] = set()
              for _ in range(20):
                  if bot_button is not None:
                      break
                  labels = button_labels(menu)
                  fingerprint = tuple(labels)
                  if fingerprint in visited:
                      break
                  visited.add(fingerprint)
                  next_button = choose_button(menu, ["next", "далее", "следующая", "›", ">", "»"])
                  if next_button is None:
                      break
                  old_labels = labels
                  await menu.click(data=next_button.data)
                  menu = await wait_changed_or_new(client, botfather, menu, old_labels)
                  bot_button = choose_button(menu, target_candidates)

              if bot_button is None:
                  raise RuntimeError(
                      "Target bot is absent from BotFather /mybots; visible buttons="
                      + json.dumps(button_labels(menu), ensure_ascii=False)
                  )

              old_labels = button_labels(menu)
              await menu.click(data=bot_button.data)
              controls = await wait_changed_or_new(client, botfather, menu, old_labels)
              token_button = choose_button(
                  controls,
                  ["api token", "token", "токен api", "api-токен", "токен"],
              )
              if token_button is None:
                  raise RuntimeError(
                      "BotFather API token control not found; visible buttons="
                      + json.dumps(button_labels(controls), ensure_ascii=False)
                  )

              old_labels = button_labels(controls)
              await controls.click(data=token_button.data)
              try:
                  response = await wait_changed_or_new(client, botfather, controls, old_labels)
                  response_id = int(response.id)
              except TimeoutError:
                  response_id = int(controls.id)
              return await wait_token_message(client, botfather, response_id)


          async def main() -> None:
              bundle = decode_bundle(os.environ.get("TELEGRAM_AUTH_BUNDLE_GH_ACTIONS", ""))
              api_id = int(os.environ.get("TELEGRAM_GH_ACTIONS_API_ID", "0") or 0)
              api_hash = str(os.environ.get("TELEGRAM_GH_ACTIONS_API_HASH", "")).strip()
              if api_id <= 0 or not api_hash:
                  raise RuntimeError("Telegram API credentials are missing")

              client = TelegramClient(
                  StringSession(str(bundle["session"])),
                  api_id,
                  api_hash,
                  device_model=str(bundle.get("device_model") or "GitHub Actions"),
                  system_version=str(bundle.get("system_version") or "Linux"),
                  app_version=str(bundle.get("app_version") or "1.0"),
                  lang_code=str(bundle.get("lang_code") or "ru"),
                  system_lang_code=str(bundle.get("system_lang_code") or "ru"),
              )

              await client.connect()
              try:
                  if not await client.is_user_authorized():
                      raise RuntimeError("Telegram session is not authorized")

                  target = await client.get_entity(TARGET_BOT_USERNAME)
                  if int(getattr(target, "id", 0) or 0) != TARGET_BOT_ID:
                      raise RuntimeError("The discovered KDG80 bot identity changed")
                  print(f"TARGET_BOT_USERNAME=@{TARGET_BOT_USERNAME}")
                  print(f"TARGET_BOT_ID={TARGET_BOT_ID}")

                  token = await token_from_botfather(client)
                  identity = bot_api(token, "getMe").get("result") or {}
                  if int(identity.get("id") or 0) != TARGET_BOT_ID:
                      raise RuntimeError("BotFather returned a token for a different bot")

                  before = bot_api(token, "getWebhookInfo").get("result") or {}
                  print(f"WEBHOOK_WAS_PRESENT={bool(before.get('url'))}")
                  print(f"PENDING_BEFORE={int(before.get('pending_update_count') or 0)}")
                  if before.get("last_error_message"):
                      print("WEBHOOK_LAST_ERROR_PRESENT=true")

                  bot_api(token, "deleteWebhook", {"drop_pending_updates": "true"})
                  after = bot_api(token, "getWebhookInfo").get("result") or {}
                  print(f"WEBHOOK_PRESENT_AFTER={bool(after.get('url'))}")
                  print(f"PENDING_AFTER={int(after.get('pending_update_count') or 0)}")
                  if after.get("url"):
                      raise RuntimeError("Webhook is still configured after emergency deletion")
                  if int(after.get("pending_update_count") or 0) != 0:
                      raise RuntimeError("Telegram still reports pending updates after drop")
                  print("KDG80_EXPORT_STORM_CONTAINED=true")
              finally:
                  await client.disconnect()


          asyncio.run(main())
          PY
