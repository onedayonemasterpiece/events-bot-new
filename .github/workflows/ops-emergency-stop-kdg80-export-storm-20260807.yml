name: Emergency stop KDG80 Telegram export retry storm

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-emergency-stop-kdg80-export-storm-20260807.yml

permissions:
  contents: read

concurrency:
  group: emergency-stop-kdg80-export-storm-20260807
  cancel-in-progress: false

jobs:
  contain:
    environment: volunteer-monitor-canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TELEGRAM_GH_ACTIONS_API_ID: ${{ secrets.TELEGRAM_GH_ACTIONS_API_ID }}
      TELEGRAM_GH_ACTIONS_API_HASH: ${{ secrets.TELEGRAM_GH_ACTIONS_API_HASH }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned Telegram client
        run: python -m pip install --disable-pip-version-check 'Telethon==1.40.0'

      - name: Drop the queued Bot API updates and disable the webhook
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import asyncio
          import base64
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          BOT_USERNAME = "kgd80bot"
          TOKEN_RE = re.compile(r"\b\d{8,12}:[A-Za-z0-9_-]{30,}\b")


          def decode_bundle(value: str) -> dict:
              raw = str(value or "").strip()
              if not raw:
                  raise RuntimeError("Telegram auth bundle is empty")
              if raw.startswith("{"):
                  data = json.loads(raw)
              else:
                  padded = raw + ("=" * (-len(raw) % 4))
                  try:
                      decoded = base64.urlsafe_b64decode(padded.encode("ascii")).decode("utf-8")
                  except Exception:
                      decoded = base64.b64decode(padded.encode("ascii")).decode("utf-8")
                  data = json.loads(decoded)
              if not isinstance(data, dict) or not data.get("session"):
                  raise RuntimeError("Telegram auth bundle has no session")
              return data


          async def wait_incoming(client, peer, after_id: int, timeout: int = 30):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  messages = await client.get_messages(peer, limit=20)
                  candidates = sorted(
                      [m for m in messages if int(m.id) > int(after_id) and not m.out],
                      key=lambda m: int(m.id),
                  )
                  if candidates:
                      return candidates[-1]
                  await asyncio.sleep(0.5)
              raise TimeoutError("BotFather did not answer")


          def button_texts(message) -> list[str]:
              return [
                  str(button.text or "").strip()
                  for row in (message.buttons or [])
                  for button in row
                  if str(button.text or "").strip()
              ]


          def choose_button(message, candidates: list[str]):
              normalized = [(value.casefold(), value) for value in candidates if value]
              for row in (message.buttons or []):
                  for button in row:
                      text = str(button.text or "").strip()
                      folded = text.casefold()
                      if any(needle in folded or folded in needle for needle, _ in normalized):
                          return button
              return None


          def bot_api(token: str, method: str, params: dict | None = None) -> dict:
              body = urllib.parse.urlencode(params or {}).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=body,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("ok") is not True:
                  raise RuntimeError(f"Bot API {method} failed")
              return payload


          async def main() -> None:
              bundle = decode_bundle(os.environ.get("TELEGRAM_AUTH_BUNDLE_GH_ACTIONS", ""))
              api_id = int(os.environ.get("TELEGRAM_GH_ACTIONS_API_ID", "0") or 0)
              api_hash = str(os.environ.get("TELEGRAM_GH_ACTIONS_API_HASH", "")).strip()
              if api_id <= 0 or not api_hash:
                  raise RuntimeError("Telegram API credentials are missing")

              client = TelegramClient(
                  StringSession(str(bundle["session"])),
                  api_id,
                  api_hash,
                  device_model=str(bundle.get("device_model") or "GitHub Actions"),
                  system_version=str(bundle.get("system_version") or "Linux"),
                  app_version=str(bundle.get("app_version") or "1.0"),
                  lang_code=str(bundle.get("lang_code") or "ru"),
                  system_lang_code=str(bundle.get("system_lang_code") or "ru"),
              )

              await client.connect()
              try:
                  if not await client.is_user_authorized():
                      raise RuntimeError("Telegram session is not authorized")

                  target_bot = await client.get_entity(BOT_USERNAME)
                  target_names = [
                      BOT_USERNAME.casefold(),
                      ("@" + BOT_USERNAME).casefold(),
                      str(getattr(target_bot, "first_name", "") or "").casefold(),
                  ]

                  botfather = await client.get_entity("BotFather")
                  command = await client.send_message(botfather, "/mybots")
                  menu = await wait_incoming(client, botfather, int(command.id))
                  bot_button = choose_button(menu, target_names)
                  if bot_button is None:
                      labels = " | ".join(button_texts(menu))
                      raise RuntimeError(f"kgd80bot is not present in BotFather bot list; buttons={labels}")

                  await menu.click(data=bot_button.data)
                  controls = await wait_incoming(client, botfather, int(menu.id))
                  token_button = choose_button(
                      controls,
                      ["api token", "token", "токен api", "api-токен", "токен"],
                  )
                  if token_button is None:
                      labels = " | ".join(button_texts(controls))
                      raise RuntimeError(f"BotFather API token control not found; buttons={labels}")

                  await controls.click(data=token_button.data)
                  token_message = await wait_incoming(client, botfather, int(controls.id))
                  match = TOKEN_RE.search(str(token_message.raw_text or ""))
                  if not match:
                      raise RuntimeError("BotFather did not return a bot token")
                  token = match.group(0)

                  identity = bot_api(token, "getMe").get("result") or {}
                  username = str(identity.get("username") or "")
                  if username.casefold() != BOT_USERNAME.casefold():
                      raise RuntimeError(f"BotFather returned token for unexpected bot @{username}")

                  before = bot_api(token, "getWebhookInfo").get("result") or {}
                  print(f"BOT_USERNAME=@{username}")
                  print(f"WEBHOOK_WAS_PRESENT={bool(before.get('url'))}")
                  print(f"PENDING_BEFORE={int(before.get('pending_update_count') or 0)}")
                  if before.get("last_error_message"):
                      print("WEBHOOK_LAST_ERROR_PRESENT=true")

                  bot_api(token, "deleteWebhook", {"drop_pending_updates": "true"})
                  after = bot_api(token, "getWebhookInfo").get("result") or {}
                  print(f"WEBHOOK_PRESENT_AFTER={bool(after.get('url'))}")
                  print(f"PENDING_AFTER={int(after.get('pending_update_count') or 0)}")
                  if after.get("url"):
                      raise RuntimeError("Webhook is still configured after emergency deletion")
                  if int(after.get("pending_update_count") or 0) != 0:
                      raise RuntimeError("Telegram still reports pending updates after drop")
                  print("KDG80_EXPORT_STORM_CONTAINED=true")
              finally:
                  await client.disconnect()


          asyncio.run(main())
          PY
