name: Emergency stop KDG80 Telegram export retry storm

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-emergency-stop-kdg80-export-storm-20260807.yml

permissions:
  contents: read

concurrency:
  group: emergency-stop-kdg80-export-storm-20260807
  cancel-in-progress: false

jobs:
  contain:
    environment: volunteer-monitor-canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TELEGRAM_GH_ACTIONS_API_ID: ${{ secrets.TELEGRAM_GH_ACTIONS_API_ID }}
      TELEGRAM_GH_ACTIONS_API_HASH: ${{ secrets.TELEGRAM_GH_ACTIONS_API_HASH }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned Telegram client
        run: python -m pip install --disable-pip-version-check 'Telethon==1.40.0'

      - name: Discover the bot by the repeated export and drop queued updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import asyncio
          import base64
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          EXPORT_FILENAME = "registrations-all.xlsx"
          EXPORT_CAPTION = "Сводный XLSX по всем событиям."
          TOKEN_RE = re.compile(r"\b\d{8,12}:[A-Za-z0-9_-]{30,}\b")


          def decode_bundle(value: str) -> dict:
              raw = str(value or "").strip()
              if not raw:
                  raise RuntimeError("Telegram auth bundle is empty")
              if raw.startswith("{"):
                  data = json.loads(raw)
              else:
                  padded = raw + ("=" * (-len(raw) % 4))
                  try:
                      decoded = base64.urlsafe_b64decode(padded.encode("ascii")).decode("utf-8")
                  except Exception:
                      decoded = base64.b64decode(padded.encode("ascii")).decode("utf-8")
                  data = json.loads(decoded)
              if not isinstance(data, dict) or not data.get("session"):
                  raise RuntimeError("Telegram auth bundle has no session")
              return data


          def bot_api(token: str, method: str, params: dict | None = None) -> dict:
              body = urllib.parse.urlencode(params or {}).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=body,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"Bot API {method} returned HTTP {error.code}") from error
              if payload.get("ok") is not True:
                  raise RuntimeError(f"Bot API {method} failed")
              return payload


          async def find_export_bot(client: TelegramClient):
              matches = []
              async for dialog in client.iter_dialogs(limit=500):
                  entity = dialog.entity
                  if not bool(getattr(entity, "bot", False)):
                      continue
                  messages = await client.get_messages(entity, limit=50)
                  matching_ids = []
                  for message in messages:
                      filename = str(getattr(getattr(message, "file", None), "name", "") or "")
                      caption = str(message.raw_text or "").strip()
                      if filename == EXPORT_FILENAME and EXPORT_CAPTION in caption:
                          matching_ids.append(int(message.id))
                  if matching_ids:
                      matches.append((entity, matching_ids))
              if len(matches) != 1:
                  safe = [
                      {
                          "id": int(getattr(entity, "id", 0) or 0),
                          "username": str(getattr(entity, "username", "") or ""),
                          "title": str(getattr(entity, "first_name", "") or ""),
                          "matching_export_messages": len(message_ids),
                      }
                      for entity, message_ids in matches
                  ]
                  raise RuntimeError(
                      "Expected exactly one bot dialog with repeated registrations-all.xlsx; "
                      + json.dumps(safe, ensure_ascii=False)
                  )
              return matches[0]


          async def find_existing_bot_token(client: TelegramClient, target_id: int) -> str:
              botfather = await client.get_entity("BotFather")
              checked: set[str] = set()
              async for message in client.iter_messages(botfather, limit=10000):
                  for match in TOKEN_RE.finditer(str(message.raw_text or "")):
                      token = match.group(0)
                      if token in checked:
                          continue
                      checked.add(token)
                      try:
                          identity = bot_api(token, "getMe").get("result") or {}
                      except RuntimeError:
                          continue
                      if int(identity.get("id") or 0) == target_id:
                          print(f"BOTFATHER_TOKENS_CHECKED={len(checked)}")
                          return token
              raise RuntimeError(
                  f"No still-valid BotFather token found for target bot id {target_id}; "
                  f"checked={len(checked)}"
              )


          async def main() -> None:
              bundle = decode_bundle(os.environ.get("TELEGRAM_AUTH_BUNDLE_GH_ACTIONS", ""))
              api_id = int(os.environ.get("TELEGRAM_GH_ACTIONS_API_ID", "0") or 0)
              api_hash = str(os.environ.get("TELEGRAM_GH_ACTIONS_API_HASH", "")).strip()
              if api_id <= 0 or not api_hash:
                  raise RuntimeError("Telegram API credentials are missing")

              client = TelegramClient(
                  StringSession(str(bundle["session"])),
                  api_id,
                  api_hash,
                  device_model=str(bundle.get("device_model") or "GitHub Actions"),
                  system_version=str(bundle.get("system_version") or "Linux"),
                  app_version=str(bundle.get("app_version") or "1.0"),
                  lang_code=str(bundle.get("lang_code") or "ru"),
                  system_lang_code=str(bundle.get("system_lang_code") or "ru"),
              )

              await client.connect()
              try:
                  if not await client.is_user_authorized():
                      raise RuntimeError("Telegram session is not authorized")

                  target_bot, matching_ids = await find_export_bot(client)
                  target_id = int(getattr(target_bot, "id", 0) or 0)
                  target_username = str(getattr(target_bot, "username", "") or "")
                  target_title = str(getattr(target_bot, "first_name", "") or "")
                  if target_id <= 0:
                      raise RuntimeError("Discovered export bot has no valid Telegram id")

                  print(f"TARGET_BOT_ID={target_id}")
                  print(f"TARGET_BOT_USERNAME=@{target_username}" if target_username else "TARGET_BOT_USERNAME=<none>")
                  print(f"TARGET_BOT_TITLE={target_title}")
                  print(f"MATCHING_EXPORT_MESSAGES={len(matching_ids)}")

                  token = await find_existing_bot_token(client, target_id)
                  identity = bot_api(token, "getMe").get("result") or {}
                  if int(identity.get("id") or 0) != target_id:
                      raise RuntimeError("Resolved token identity changed before containment")

                  before = bot_api(token, "getWebhookInfo").get("result") or {}
                  print(f"WEBHOOK_WAS_PRESENT={bool(before.get('url'))}")
                  print(f"PENDING_BEFORE={int(before.get('pending_update_count') or 0)}")
                  if before.get("last_error_message"):
                      print("WEBHOOK_LAST_ERROR_PRESENT=true")

                  bot_api(token, "deleteWebhook", {"drop_pending_updates": "true"})
                  after = bot_api(token, "getWebhookInfo").get("result") or {}
                  print(f"WEBHOOK_PRESENT_AFTER={bool(after.get('url'))}")
                  print(f"PENDING_AFTER={int(after.get('pending_update_count') or 0)}")
                  if after.get("url"):
                      raise RuntimeError("Webhook is still configured after emergency deletion")
                  if int(after.get("pending_update_count") or 0) != 0:
                      raise RuntimeError("Telegram still reports pending updates after drop")
                  print("KDG80_EXPORT_STORM_CONTAINED=true")
              finally:
                  await client.disconnect()


          asyncio.run(main())
          PY
