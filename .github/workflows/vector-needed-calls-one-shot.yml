name: Vector exact needed-calls probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/vector-needed-calls-one-shot.yml]
permissions: { contents: write }
env:
  FLY_API_TOKEN: ${{ secrets.UNUSUAL_EVENTS_FLY_SSH_TOKEN }}
  FLY_APP_NAME: ${{ vars.UNUSUAL_EVENTS_FLY_APP_NAME }}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: { name: unusual-events-monitor }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Calculate exact hash mismatches without embedding
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/p.py" <<'PY'
          import json,runpy
          from pathlib import Path
          root=Path('/tmp/event-vector-sync-kks563k9')
          fixture_path=root/'preview-events.json'
          if not fixture_path.is_file(): raise SystemExit('active vector export fixture missing')
          ns=runpy.run_path('/app/scripts/sync_event_search_vectors_to_supabase.py')
          fixture=json.loads(fixture_path.read_text(encoding='utf-8'))
          events=[dict(e) for e in (fixture.get('events') or [])]
          occ=ns['build_occurrence_projections'](events)
          for e in events: e.update(occ.get(int(e.get('id') or 0),{}))
          docs=[ns['build_search_doc'](e,site_origin='https://kenigevents.ru',base_path='',ics_base_url='https://static.kenigevents.ru/ics') for e in events]
          computed=ns['exported_search_catalog_revision'](events)
          fixture_rev=str(((fixture.get('build') or {}).get('catalog_revision') or '')).strip()
          catalog=fixture_rev or computed
          contract=ns['build_revision_contract'](docs,catalog_revision=catalog,embedding_model='gemini-embedding-2',embedding_dim=768)
          ns['annotate_search_documents'](docs,contract)
          out={'events':len(docs),'expected_embeddings':len(docs)*2,'catalog_revision':catalog,'kinds':{}}
          total=0
          changed_ids=set()
          for kind in ('search_v3','related_v1'):
              existing=ns['fetch_existing_embeddings']([d.event_id for d in docs],model='gemini-embedding-2',dim=768,doc_kind=kind)
              same=0; mismatch=0; missing=0; ids=[]
              for d in docs:
                  wanted=str(d.document['text_hash'] if kind=='search_v3' else d.document['related_text_hash'])
                  current=existing.get(d.event_id)
                  if current==wanted: same+=1
                  else:
                      mismatch+=1; ids.append(d.event_id); changed_ids.add(d.event_id)
                      if current is None: missing+=1
              out['kinds'][kind]={'same':same,'needed_calls':mismatch,'missing_rows':missing,'sample_event_ids':ids[:25]}
              total+=mismatch
          out['needed_calls_total']=total
          out['events_with_any_needed_call']=len(changed_ids)
          out['fits_single_owner_cap_500']=total<=500
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          e="$(base64 -w0 "$RUNNER_TEMP/p.py")"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false --command "python3 -c \"import base64;exec(base64.b64decode('$e'))\"" | tee needed.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: vector-needed-calls, path: needed.json, retention-days: 7 }
      - name: Remove probe
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main; git rebase origin/main; git rm .github/workflows/vector-needed-calls-one-shot.yml
          git commit -m 'ops: remove vector needed-calls probe'; git push origin HEAD:main
