name: Probe exact Fly SSH token for amber digest update

on:
  push:
    branches:
      - ops/add-amber-excursion-digest-20260807
    paths:
      - .github/workflows/probe-fly-ssh-token-20260807.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_SSH_TOKEN }}
      FLY_APP_NAME: events-bot-new-wngqia
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.78
      - name: Verify exact secret without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FLY_API_TOKEN:-}" ]]; then
            echo 'FLY_SSH_TOKEN_PRESENT=false'
            exit 1
          fi
          flyctl status --app "${FLY_APP_NAME}" >/dev/null
          echo 'FLY_SSH_TOKEN_PRESENT=true'
          echo 'FLY_SSH_TOKEN_APP_ACCESS=true'
