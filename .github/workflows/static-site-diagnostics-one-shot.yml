name: StaticSiteBuilder one-shot diagnostics

on:
  push:
    branches:
      - ops/static-site-diagnostics-20260903

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.UNUSUAL_EVENTS_FLY_SSH_TOKEN }}
  FLY_APP_NAME: ${{ vars.UNUSUAL_EVENTS_FLY_APP_NAME }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Collect redacted StaticSiteBuilder diagnostics from Fly
        run: |
          set -euo pipefail
          test -n "${FLY_APP_NAME:-}"
          test -n "${FLY_API_TOKEN:-}"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false \
            --command "python3 scripts/static_site_build_diagnostics.py --db /data/db.sqlite --hours 24 --format json --limit 100" \
            | tee static-site-diagnostics.json
      - name: Upload redacted diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site-diagnostics
          path: static-site-diagnostics.json
          if-no-files-found: error
          retention-days: 7
