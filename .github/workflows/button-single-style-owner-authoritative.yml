name: Button single visual owner authoritative gate

on:
  push:
    branches:
      - work/ui-normalization-button-single-style-owner-20260904
    paths:
      - .github/workflows/button-single-style-owner-authoritative.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: button-single-visual-owner-authoritative
  cancel-in-progress: false

jobs:
  validate-and-deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
