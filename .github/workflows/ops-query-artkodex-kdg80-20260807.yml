name: Locate direct KDG80 remote execution workspace

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-query-artkodex-kdg80-20260807.yml

permissions:
  contents: read

concurrency:
  group: locate-artkodex-kdg80-20260807
  cancel-in-progress: true

jobs:
  query:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TELEGRAM_GH_ACTIONS_API_ID: ${{ secrets.TELEGRAM_GH_ACTIONS_API_ID }}
      TELEGRAM_GH_ACTIONS_API_HASH: ${{ secrets.TELEGRAM_GH_ACTIONS_API_HASH }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'Telethon==1.40.0'
      - name: Query ArtKodex status and workspaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, base64, json, os, time
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          def bundle(raw):
              value = raw.strip()
              if value.startswith('{'):
                  return json.loads(value)
              padded = value + '=' * (-len(value) % 4)
              for decoder in (base64.urlsafe_b64decode, base64.b64decode):
                  try:
                      return json.loads(decoder(padded.encode()).decode())
                  except Exception:
                      pass
              raise RuntimeError('cannot decode Telegram auth bundle')

          async def wait_reply(client, peer, after_id, timeout=30):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  messages = await client.get_messages(peer, limit=20)
                  replies = sorted(
                      [m for m in messages if int(m.id) > int(after_id) and not m.out],
                      key=lambda m: int(m.id),
                  )
                  if replies:
                      return replies[-1]
                  await asyncio.sleep(0.5)
              raise TimeoutError('ArtKodex did not reply')

          async def main():
              data = bundle(os.environ['TELEGRAM_AUTH_BUNDLE_GH_ACTIONS'])
              client = TelegramClient(
                  StringSession(str(data['session'])),
                  int(os.environ['TELEGRAM_GH_ACTIONS_API_ID']),
                  os.environ['TELEGRAM_GH_ACTIONS_API_HASH'],
              )
              await client.connect()
              try:
                  if not await client.is_user_authorized():
                      raise RuntimeError('Telegram session is not authorized')
                  peer = await client.get_entity('ArtKodexBot')
                  for command in ('/status', '/workspaces', '/projects'):
                      sent = await client.send_message(peer, command)
                      reply = await wait_reply(client, peer, sent.id)
                      text = str(reply.raw_text or '').replace('\x00', '')
                      print(f'COMMAND={command}')
                      print(text[:8000])
                      print('---')
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY
