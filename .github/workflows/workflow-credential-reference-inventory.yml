name: Workflow credential reference inventory

on:
  push:
    branches: [main]
    paths:
      - .github/workflow-credential-reference-trigger.txt

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: List referenced secret and variable names only
        shell: bash
        run: |
          set -euo pipefail
          echo 'REFERENCED_SECRETS_START'
          grep -RhoE 'secrets\.[A-Z0-9_]+' .github/workflows | sed 's/^secrets\.//' | sort -u
          echo 'REFERENCED_SECRETS_END'
          echo 'REFERENCED_VARS_START'
          grep -RhoE 'vars\.[A-Z0-9_]+' .github/workflows | sed 's/^vars\.//' | sort -u
          echo 'REFERENCED_VARS_END'
          echo 'REFERENCED_ENVIRONMENTS_START'
          grep -RhE '^\s*environment:\s*' .github/workflows | sed -E 's/^\s*environment:\s*//' | sort -u
          echo 'REFERENCED_ENVIRONMENTS_END'
