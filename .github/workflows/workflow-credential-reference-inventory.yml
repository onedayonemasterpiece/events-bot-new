name: Workflow credential reference inventory

on:
  push:
    branches: [main]
    paths:
      - .github/workflow-credential-reference-trigger.txt

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Find existing publisher routes and destination mappings
        shell: bash
        run: |
          set -euo pipefail
          echo 'SOCIAL_EXISTING_CONTEXT_START'
          grep -RInE --exclude-dir=.git --exclude='social-*.yml' --exclude='workflow-credential-reference-inventory.yml' \
            'YC_SA_BOT_STORAGE|TELEGRAM_AUTH_BUNDLE|TG_SESSION|VK_ACCESS_TOKEN|VK_TOKEN|kenigevents|lovekenig|wheretogo39|youwillsee39|kenigeventsofficial|uhtykaliningrad|231828790|238875824|Полюбить Калининград|Ух ты, Калининград' . \
            | head -n 1500
          echo 'SOCIAL_EXISTING_CONTEXT_END'
