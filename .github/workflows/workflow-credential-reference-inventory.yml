name: Workflow credential reference inventory

on:
  push:
    branches: [main]
    paths:
      - .github/workflow-credential-reference-trigger.txt

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: List social credential references with file context
        shell: bash
        run: |
          set -euo pipefail
          echo 'SOCIAL_REFERENCE_CONTEXT_START'
          grep -RInE 'FLY_API_TOKEN|KAGGLE_|TELEGRAM_|TG_API_|TG_SESSION|KPSK_TELETHON|VK_' .github/workflows \
            | sed -E 's/:[[:space:]]+/ : /' \
            | sort
          echo 'SOCIAL_REFERENCE_CONTEXT_END'
          echo 'REFERENCED_ENVIRONMENTS_START'
          grep -RhE '^\s*environment:\s*' .github/workflows | sed -E 's/^\s*environment:\s*//' | sort -u
          echo 'REFERENCED_ENVIRONMENTS_END'
