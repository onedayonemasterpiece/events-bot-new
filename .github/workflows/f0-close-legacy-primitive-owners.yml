name: F0 owner-review correction and evidence
# Existing F0 runner only. No published build, external agent, model or production promotion.
on:
  push:
    branches: [work/owner-audioreview-card-geometry-20260905]
    paths: [.github/workflows/f0-close-legacy-primitive-owners.yml]
permissions:
  contents: write
concurrency:
  group: f0-owner-review-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owner-review-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify and apply only the exact personally authored source patch
        run: |
          mkdir -p artifacts/owner-review
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 89e621cf2143579f2cc21835b46f37ff5befe230 HEAD -- site
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          directory=pathlib.Path('.github/owner-review-patch')
          parts=[(directory/f'{i}.b64').read_text().strip() for i in range(5)]
          # Two identified transcription errors in transport only. Exact old Git
          # blob and complete decompressed SHA are checked before any application.
          damaged=parts[3].encode()
          assert hashlib.sha1(b'blob '+str(len(damaged)).encode()+b'\0'+damaged).hexdigest()=='5bca617652b3a3047c0b14f82c134449402cab78'
          parts[3]=parts[3].replace('V85V85Knj','V85KNj').replace('P+o/uvvvt7s','P+o/vvvbt7s')
          patch=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert len(patch)==74308
          assert hashlib.sha256(patch).hexdigest()=='93427d0458875062cb66fafb43536d3c5544c38d226825c0320bb3a9623da7cf'
          paths=[line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')]
          assert len(paths)==12 and all(p.startswith('site/') and '..' not in p for p in paths)
          destination=pathlib.Path('artifacts/owner-review/applied-source.patch');destination.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(destination)],check=True)
          subprocess.run(['git','apply',str(destination)],check=True)
          for i in range(5):(directory/f'{i}.b64').unlink()
          PY
      - name: Install and run source regressions plus the existing SoT checks
        run: |
          cd site && npm ci --no-audit --no-fund && cd ..
          node site/scripts/generate-astro-family-consumer-graph.mjs --write > artifacts/owner-review/family-generation.json
          node site/scripts/generate-token-impact-graph.mjs --write > artifacts/owner-review/token-generation.json
          node site/scripts/check-astro-family-sot.mjs > artifacts/owner-review/family-check.json
          node --experimental-strip-types --test site/tests/owner-audioreview-card-geometry.test.mjs site/tests/adaptive-event-card-grid.test.mjs site/tests/unusual-listing-typography-token-adoption.test.mjs site/tests/event-date-availability.test.mjs site/tests/keyboard-event-navigation-production.test.mjs > artifacts/owner-review/source-regressions.tap
      - name: Save applicable source to the existing correction branch, without overwriting another writer
        run: |
          test "$(git ls-remote origin refs/heads/work/owner-audioreview-card-geometry-20260905 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site .github/owner-review-patch
          git diff --cached --check
          git commit -m 'fix(ui): restore current Hero Talk scenes and schematic page context'
          git push origin HEAD:refs/heads/work/owner-audioreview-card-geometry-20260905
          git rev-parse HEAD > artifacts/owner-review/source-sha.txt
      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Execute the existing browser-gate regression suite
        run: node --experimental-strip-types --test site/scripts/browser-release-gate.behavior.test.mjs > artifacts/owner-review/browser-regressions.tap
      - name: Focused diagnostics and real browser actions, not review-snapshot acceptance
        env:
          PUBLIC_SITE_MODE: preview
          PUBLIC_PREVIEW_BUILD_ID: local-owner-review
          PUBLIC_INTEREST_CLUBS_ENABLED: '1'
          ENABLE_INTEREST_CLUB_STATIC_PROJECTION: '1'
        run: |
          for CLASS in collection date weekend; do
            (cd site && STATIC_SITE_PAGE_CLASSES="$CLASS" node_modules/.bin/astro build) > "artifacts/owner-review/build-$CLASS.log" 2>&1
            CLASS="$CLASS" node --input-type=module <<'JS'
          import {chromium} from './site/node_modules/playwright/index.mjs';
          import {assertOwnerReviewPages,assertSchematicPageContext,assertRestoredHomeHero,startReleaseServer} from './site/scripts/check-browser-release-gate.mjs';
          import {writeFileSync,mkdirSync} from 'node:fs';
          const kind=process.env.CLASS;
          const routes={collection:['/vystavki/','/populyarnoe/','/festivali/','/neobychnoe/','/kluby-po-interesam/','/podborki/besplatnye-sobytiya/','/podborki/besplatno-s-detmi/','/podborki/'],date:['/segodnya/','/zavtra/'],weekend:['/vyhodnye/']}[kind];
          const out=`artifacts/owner-review/after-${kind}`;mkdirSync(out,{recursive:true});
          const server=await startReleaseServer('site/dist'),browser=await chromium.launch(),page=await browser.newPage();
          page.setDefaultTimeout(12000);page.setDefaultNavigationTimeout(45000);
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          let report;
          try {
            report=await assertOwnerReviewPages(page,server.origin,'',{routes,artifactDir:out,captureOnly:true});
            report.evidence_class='FOCUSED_FIXTURE_DIAGNOSTIC_NOT_REAL_REVIEW_ACCEPTANCE';
            if(kind==='collection')report.floating=await assertSchematicPageContext(page,server.origin,'/vystavki/',out);
            if(kind==='date')report.home=await assertRestoredHomeHero(page,server.origin,'/',out);
          } catch(error) {
            report ||= {ok:false,errors:[]};report.ok=false;report.errors.push({step:'browser-actions',error:String(error.stack||error)});
            await page.screenshot({path:`${out}/failure.png`});
          } finally {
            report ||= {ok:false,errors:[{error:'No report'}]};report.page_errors=errors;
            report.source_sha=(await import('node:child_process')).execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            writeFileSync(`artifacts/owner-review/${kind}-result.json`,JSON.stringify(report,null,2));
            await browser.close();await server.close();
          }
          JS
          done
      - name: Export exact remote-readable source and diagnostic metadata
        if: always()
        run: |
          mkdir -p artifacts/owner-review
          git archive --format=tar HEAD site docs .codex/skills AGENTS.md .github CHANGELOG.md | gzip > artifacts/owner-review/source.tar.gz
          git rev-parse HEAD > artifacts/owner-review/checked-out-sha.txt
          echo 'Focused fixture diagnostics only. Full real build requires the existing Kaggle publisher. Production and Penpot unchanged.' > artifacts/owner-review/NOT-ACCEPTANCE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-review-reading-flow-${{ github.sha }}
          path: artifacts/owner-review/
          retention-days: 14
      - name: Fail on any captured behavioral or semantic-role defect
        run: |
          python - <<'PY'
          import json,pathlib
          for name in ['collection','date','weekend']:
            d=json.loads(pathlib.Path(f'artifacts/owner-review/{name}-result.json').read_text())
            assert d['ok'],d['errors']
          PY
