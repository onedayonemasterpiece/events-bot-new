name: F0 close legacy primitive owners

on:
  push:
    branches:
      - work/ui-normalization-f0-wave-3-20260903
    paths:
      - .github/workflows/f0-close-legacy-primitive-owners.yml

permissions:
  contents: write

concurrency:
  group: f0-close-legacy-primitive-owners
  cancel-in-progress: false

jobs:
  close-owner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact F0 branch
        uses: actions/checkout@v4
        with:
          ref: work/ui-normalization-f0-wave-3-20260903
          fetch-depth: 0

      - name: Apply bounded owner and icon-role repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('site/src/styles/design-system.css')
          source = path.read_text(encoding='utf-8')
          start_marker = '\n.ke-badge {\n'
          end_marker = '\n/* Shared date-listing system: Today, Tomorrow and Weekend use this exact\n'

          if source.count(start_marker) == 1:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              removed = source[start:end]
              for required in ('.ke-badge', '.ke-field', '.ke-state-panel'):
                  if required not in removed:
                      raise SystemExit(f'bounded legacy block does not contain {required}')
              replacement = (
                  '\n\n/* Badge, Field and StatePanel visual ownership moved to\n'
                  '   site/src/components/design-system/component-foundations.css. */\n'
              )
              source = source[:start] + replacement + source[end:]
          elif source.count(start_marker) != 0:
              raise SystemExit(f'expected zero or one legacy Badge owner, found {source.count(start_marker)}')

          replacements = {
              '.ke-button .icon { width: 1.18rem; height: 1.18rem; flex: 0 0 auto; fill: currentColor; }':
                  '.ke-button .icon { width: var(--ke-icon-size-control); height: var(--ke-icon-size-control); flex: 0 0 auto; fill: currentColor; }',
              '.ke-copy-action__icon { width: 1.18rem; height: 1.18rem; display: grid; place-items: center; }':
                  '.ke-copy-action__icon { width: var(--ke-icon-size-control); height: var(--ke-icon-size-control); display: grid; place-items: center; }',
              '.ke-filter-chip__check { width: 1.15rem; height: 1.15rem; display: grid; place-items: center; border: 1px solid color-mix(in srgb, currentColor 28%, transparent); border-radius: 50%; color: transparent; font-size: 0.72rem; line-height: 1; }':
                  '.ke-filter-chip__check { width: var(--ke-icon-size-control); height: var(--ke-icon-size-control); display: grid; place-items: center; border: 1px solid color-mix(in srgb, currentColor 28%, transparent); border-radius: 50%; color: transparent; font-size: 0.72rem; line-height: 1; }',
              '.ke-filter-chip__check { width: 1rem; height: 1rem; }':
                  '.ke-filter-chip__check { width: var(--ke-icon-size-inline); height: var(--ke-icon-size-inline); }',
              '.ke-listing-card__free-medallion .icon { width: 24px; height: 24px; fill: currentColor; }':
                  '.ke-listing-card__free-medallion .icon { width: var(--ke-icon-size-action); height: var(--ke-icon-size-action); fill: currentColor; }',
              'grid-template-columns: 20px auto;':
                  'grid-template-columns: var(--ke-icon-size-control) auto;',
              '.ke-listing-card__utility .icon { width: 20px; height: 20px; fill: currentColor; }':
                  '.ke-listing-card__utility .icon { width: var(--ke-icon-size-control); height: var(--ke-icon-size-control); fill: currentColor; }',
              'grid-template-columns: 17px minmax(0, 1fr);':
                  'grid-template-columns: var(--ke-icon-size-inline) minmax(0, 1fr);',
              '.ke-listing-card__social-proof .icon { width: 17px; height: 17px; fill: currentColor; }':
                  '.ke-listing-card__social-proof .icon { width: var(--ke-icon-size-inline); height: var(--ke-icon-size-inline); fill: currentColor; }',
              'grid-template-rows: 14px auto;':
                  'grid-template-rows: var(--ke-icon-size-inline) auto;',
              '    width: 14px;\n    height: 14px;\n  }\n  .ke-popular-listing [data-popular-representation="mobile-adaptive"] .ke-listing-card__social-proof:not(.ke-listing-card__social-proof--inside) b {':
                  '    width: var(--ke-icon-size-inline);\n    height: var(--ke-icon-size-inline);\n  }\n  .ke-popular-listing [data-popular-representation="mobile-adaptive"] .ke-listing-card__social-proof:not(.ke-listing-card__social-proof--inside) b {',
              '  .ke-listing-mobile-density-switch__icon {\n    width: 16px;\n    height: 16px;':
                  '  .ke-listing-mobile-density-switch__icon {\n    width: var(--ke-icon-size-inline);\n    height: var(--ke-icon-size-inline);',
          }

          for old, new in replacements.items():
              old_count = source.count(old)
              new_count = source.count(new)
              if old_count == 1:
                  source = source.replace(old, new, 1)
              elif old_count == 0 and new_count >= 1:
                  continue
              else:
                  raise SystemExit(
                      f'expected one old source or an existing replacement; old={old_count}, new={new_count}: {old[:80]}'
                  )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Run F0 ownership probes
        shell: bash
        run: node site/src/components/design-system/f0-normalization-negative-probes.mjs

      - name: Record unrelated legacy check result without blocking F0 owner repair
        shell: bash
        run: |
          set +e
          node site/scripts/check-design-system.mjs > /tmp/check-design-system.log 2>&1
          status=$?
          set -e
          cat /tmp/check-design-system.log
          if [ "$status" -ne 0 ] && ! grep -Fq 'Root page does not load the canonical design-system CSS' /tmp/check-design-system.log; then
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Known non-F0 drift retained for A0/N0: stale direct-import assertion.'
          fi

      - name: Commit bounded source repair before census
        shell: bash
        run: |
          git config user.name 'f0-normalization-bot'
          git config user.email 'f0-normalization-bot@users.noreply.github.com'
          if ! git diff --quiet -- site/src/styles/design-system.css; then
            git add site/src/styles/design-system.css
            git commit -m 'refactor(ui): finish physical icon-role binding'
          fi

      - name: Materialize F0 branch and current candidate checklist census
        shell: bash
        run: |
          git fetch origin \
            work/ui-normalization-f0-wave-3-20260903 \
            r0/ui-normalization-current-candidate-20260903
          node site/src/components/design-system/f0-candidate-consumer-census.mjs HEAD \
            > site/src/components/design-system/f0-role-branch-census.v1.json
          node site/src/components/design-system/f0-candidate-consumer-census.mjs origin/r0/ui-normalization-current-candidate-20260903 \
            > site/src/components/design-system/f0-current-candidate-census.v1.json
          node -e "for (const p of process.argv.slice(1)) { const x=require('./'+p); if (!x.resolved_ref || !x.checklist_evidence) throw new Error('invalid census '+p); console.log(p, x.resolved_ref); }" \
            site/src/components/design-system/f0-role-branch-census.v1.json \
            site/src/components/design-system/f0-current-candidate-census.v1.json

      - name: Commit census evidence and push
        shell: bash
        run: |
          git add \
            site/src/components/design-system/f0-role-branch-census.v1.json \
            site/src/components/design-system/f0-current-candidate-census.v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(ui): record F0 branch and candidate census'
          fi
          git push origin HEAD:work/ui-normalization-f0-wave-3-20260903
