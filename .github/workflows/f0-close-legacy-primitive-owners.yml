name: F0 owner-review correction and evidence
on:
  push:
    branches: [work/owner-audioreview-card-geometry-20260905]
    paths: [.github/workflows/f0-close-legacy-primitive-owners.yml]
permissions:
  contents: write
concurrency:
  group: f0-owner-review-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owner-review-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply only the exact ChatGPT-authored five-file correction
        run: |
          mkdir -p artifacts/owner-review
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded=''
          # The exact patch is supplied as a normal UTF-8 diff below; no inferred edits.
          patch = '''diff --git a/site/src/components/Reference4MobileMenu.astro b/site/src/components/Reference4MobileMenu.astro
          --- a/site/src/components/Reference4MobileMenu.astro
          +++ b/site/src/components/Reference4MobileMenu.astro
          @@ -158 +158,3 @@
          -    body.mobile-shell-reference4[data-mobile-bottom-mode="nav"] > main { padding-top:84px; }
          +    /* Semantic route wrappers retain the same shared chrome inset. */
          +    body.mobile-shell-reference4[data-mobile-bottom-mode="nav"] > :is(main, [data-ds-family$="RouteComposition"]) { padding-top:84px; }
          +
          diff --git a/site/src/components/FreeCollectionSurface.astro b/site/src/components/FreeCollectionSurface.astro
          --- a/site/src/components/FreeCollectionSurface.astro
          +++ b/site/src/components/FreeCollectionSurface.astro
          @@ -190 +190 @@
          -      grid-template-columns:minmax(0,1fr) var(--ke-free-medallion-hero-size-compact);
          +      grid-template-columns:minmax(0,1fr);
          @@ -195 +195 @@
          -    .free-collection__copy h1 { overflow-wrap:normal; word-break:normal; hyphens:none; }
          +    .free-collection__copy h1 { max-width:100%; overflow-wrap:normal; word-break:normal; hyphens:none; }
          @@ -202 +202 @@
          -      margin-top:44px;
          +      margin-top:0;
          diff --git a/site/src/pages/festivali/index.astro b/site/src/pages/festivali/index.astro
          --- a/site/src/pages/festivali/index.astro
          +++ b/site/src/pages/festivali/index.astro
          @@ -1054 +1054 @@
          -    .festival-hero { grid-template-columns: 1fr; min-height: 0; }
          +    .festival-hero { grid-template-columns: minmax(0, 1fr); min-height: 0; }
          @@ -1069 +1069 @@
          -      overflow-wrap: normal;
          +      overflow-wrap: anywhere;
          '''
          # Ignore line offsets only; git still requires the exact removed source.
          destination=pathlib.Path('artifacts/owner-review/occlusion.patch');destination.write_text(patch)
          applied=subprocess.run(['git','apply','--reverse','--check','--unidiff-zero',str(destination)],capture_output=True).returncode==0
          if not applied:
            subprocess.run(['git','diff','--exit-code','df9d6e2c0f349c12f9a311baf252f4b7f272bc3b','HEAD','--','site'],check=True)
            subprocess.run(['git','apply','--check','--unidiff-zero',str(destination)],check=True)
            subprocess.run(['git','apply','--unidiff-zero',str(destination)],check=True)
          PY
      - name: Install exact lockfile dependencies and regenerate the existing graphs
        run: |
          cd site && npm ci --no-audit --no-fund && cd ..
          node site/scripts/generate-astro-family-consumer-graph.mjs --write
          node site/scripts/generate-token-impact-graph.mjs --write
          node site/scripts/check-astro-family-sot.mjs > artifacts/owner-review/family-check.json
          node --experimental-strip-types --test site/tests/owner-audioreview-card-geometry.test.mjs site/tests/adaptive-event-card-grid.test.mjs site/tests/unusual-listing-typography-token-adoption.test.mjs site/tests/event-date-availability.test.mjs site/tests/keyboard-event-navigation-production.test.mjs > artifacts/owner-review/source-regressions.tap
      - name: Save the mechanically applied, source-tested correction
        run: |
          test "$(git ls-remote origin refs/heads/work/owner-audioreview-card-geometry-20260905 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ui): preserve heading room and shared mobile chrome clearance'
            git push origin HEAD:refs/heads/work/owner-audioreview-card-geometry-20260905
          fi
          git rev-parse HEAD > artifacts/owner-review/source-sha.txt
      - name: Read the exact historical Hero Talk dependency closure for ChatGPT
        run: |
          mkdir -p artifacts/owner-review/donor
          git rev-parse 4243401a4 > artifacts/owner-review/donor/commit.txt
          for P in site/src/components/HomeHeroTalk.astro site/src/lib/homeHeroTalk.ts site/src/data/homeHeroTalkEditorial.ts; do
            git show "4243401a4:$P" > "artifacts/owner-review/donor/$(basename "$P")"
          done
      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Execute the existing browser regression suite
        run: node --experimental-strip-types --test site/scripts/browser-release-gate.behavior.test.mjs > artifacts/owner-review/browser-regressions.tap
      - name: Focused page-class diagnostics, never a publication or owner acceptance
        env:
          PUBLIC_SITE_MODE: preview
          PUBLIC_PREVIEW_BUILD_ID: local-owner-review
          PUBLIC_INTEREST_CLUBS_ENABLED: '1'
          ENABLE_INTEREST_CLUB_STATIC_PROJECTION: '1'
        run: |
          for CLASS in collection date weekend; do
            (cd site && STATIC_SITE_PAGE_CLASSES="$CLASS" node_modules/.bin/astro build) > "artifacts/owner-review/build-$CLASS.log" 2>&1
            CLASS="$CLASS" node --input-type=module <<'JS'
          import {chromium} from './site/node_modules/playwright/index.mjs';
          import {assertOwnerReviewPages,startReleaseServer} from './site/scripts/check-browser-release-gate.mjs';
          import {writeFileSync} from 'node:fs';
          const routes={collection:['/vystavki/','/populyarnoe/','/festivali/','/neobychnoe/','/kluby-po-interesam/','/podborki/besplatnye-sobytiya/','/podborki/besplatno-s-detmi/','/podborki/'],date:['/segodnya/','/zavtra/'],weekend:['/vyhodnye/']}[process.env.CLASS];
          const server=await startReleaseServer('site/dist');const browser=await chromium.launch();
          try {const page=await browser.newPage();const report=await assertOwnerReviewPages(page,server.origin,'',{routes,artifactDir:`artifacts/owner-review/after-${process.env.CLASS}`,captureOnly:true});report.evidence_class='FOCUSED_FIXTURE_DIAGNOSTIC_NOT_OWNER_ACCEPTANCE';writeFileSync(`artifacts/owner-review/${process.env.CLASS}-result.json`,JSON.stringify(report,null,2));}
          finally{await browser.close();await server.close();}
          JS
          done
      - name: Export exact source and metadata without credentials
        if: always()
        run: |
          git archive --format=tar HEAD site docs .codex/skills AGENTS.md .github CHANGELOG.md | gzip > artifacts/owner-review/source.tar.gz
          git rev-parse HEAD > artifacts/owner-review/checked-out-sha.txt
          echo 'Source diagnostic only; no publication, production change or Penpot check.' > artifacts/owner-review/NOT-ACCEPTANCE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-review-occlusion-${{ github.sha }}
          path: artifacts/owner-review/
          retention-days: 14
      - name: Fail on any captured role mismatch
        run: |
          python - <<'PY'
          import json,pathlib
          for name in ['collection','date','weekend']:
            d=json.loads(pathlib.Path(f'artifacts/owner-review/{name}-result.json').read_text())
            assert d['ok'],d['errors']
          PY
