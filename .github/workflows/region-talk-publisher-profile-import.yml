name: Import trusted Region Talk publisher profiles

on:
  push:
    branches: [main]
    paths:
      - 'docs/features/region-talk-channel/region-talk-publisher-profile-enrichment-*.json'
  workflow_dispatch:
    inputs:
      profile_result:
        description: Approved publisher-profile enrichment JSON on trusted main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: region-talk-ydb-import
  cancel-in-progress: false

jobs:
  validate-and-import:
    name: Validate and import publisher dossiers sequentially
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: region-talk-ydb-import
    env:
      YANDEX_WIF_OIDC_AUDIENCE: ${{ vars.YANDEX_WIF_OIDC_AUDIENCE }}
      YANDEX_WIF_SERVICE_ACCOUNT_ID: ${{ vars.YANDEX_WIF_SERVICE_ACCOUNT_ID }}
      REGION_TALK_YDB_ENDPOINT: ${{ vars.REGION_TALK_YDB_ENDPOINT }}
      REGION_TALK_YDB_DATABASE: ${{ vars.REGION_TALK_YDB_DATABASE }}
      REGION_TALK_YDB_NAMESPACE: ${{ vars.REGION_TALK_YDB_NAMESPACE }}
      SELECTED_INPUT: ${{ inputs.profile_result }}
      REPORT_ROOT: artifacts/github-actions/region-talk-publisher-profile-import

    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select only reviewed publisher-profile inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$(git rev-parse --verify origin/main)"
          if [[ "$EVENT_NAME" == "push" ]]; then
            test "$(git rev-parse --verify HEAD)" = "$PUSH_SHA"
          fi
          mkdir -p "$REPORT_ROOT"

          python3 - "$EVENT_NAME" "$BEFORE_SHA" "$PUSH_SHA" "$SELECTED_INPUT" \
            "$REPORT_ROOT/inputs.txt" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import re
          import subprocess
          import sys
          from pathlib import Path

          event, before, after, selected, output, github_output = sys.argv[1:]
          approved = re.compile(
              r"^docs/features/region-talk-channel/"
              r"region-talk-publisher-profile-enrichment-[A-Za-z0-9][A-Za-z0-9._-]*\.json$"
          )
          if event == "push":
              if not re.fullmatch(r"[0-9a-f]{40}", before or ""):
                  raise SystemExit("invalid trusted-main before SHA")
              candidates = subprocess.run(
                  ["git", "diff", "--diff-filter=AM", "--name-only", before, after, "--"],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.splitlines()
          else:
              candidates = [selected]

          root = Path("docs/features/region-talk-channel").resolve()
          accepted: list[str] = []
          for raw in sorted(set(candidates)):
              path = raw.strip()
              if not approved.fullmatch(path):
                  raise SystemExit(f"refusing non-approved publisher-profile path: {path!r}")
              candidate = Path(path)
              if candidate.is_symlink() or not candidate.is_file() or candidate.resolve().parent != root:
                  raise SystemExit(f"refusing non-regular publisher-profile input: {path}")
              accepted.append(path)
          if not accepted:
              raise SystemExit("no approved publisher-profile input selected")
          Path(output).write_text("".join(f"{path}\n" for path in accepted), encoding="utf-8")
          manifest_sha = hashlib.sha256("\n".join(accepted).encode()).hexdigest()
          with Path(github_output).open("a", encoding="utf-8") as handle:
              handle.write(f"count={len(accepted)}\n")
              handle.write(f"manifest_sha={manifest_sha}\n")
          PY

          {
            echo "### Trusted publisher profile inputs"
            echo
            echo "- main checkout: \`$(git rev-parse HEAD)\`"
            sed 's/^/- `/' "$REPORT_ROOT/inputs.txt" | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned runtime dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate every selected profile before Yandex authentication
        shell: bash
        run: |
          set -euo pipefail
          : > "$REPORT_ROOT/validation-summary.ndjson"
          while IFS= read -r input_path; do
            input_sha="$(sha256sum "$input_path" | awk '{print $1}')"
            report_dir="$REPORT_ROOT/$input_sha"
            mkdir -p "$report_dir"
            printf '%s  %s\n' "$input_sha" "$input_path" > "$report_dir/input.sha256"
            python scripts/region_talk_publisher_profile_import.py "$input_path" \
              --expected-input-sha256 "$input_sha" \
              --report "$report_dir/validation.json"
            python - "$input_path" "$input_sha" "$report_dir/validation.json" <<'PY' \
              >> "$REPORT_ROOT/validation-summary.ndjson"
          import json
          import sys
          from pathlib import Path
          path, expected, report_path = sys.argv[1:]
          report = json.loads(Path(report_path).read_text(encoding="utf-8"))
          if report.get("executed") is not False or report.get("execution_status") != "validated":
              raise SystemExit(f"dry validation did not pass for {path}")
          if report.get("input_json_sha256") != expected or report.get("publication_effect") != "none":
              raise SystemExit(f"exact-byte or no-publication contract failed for {path}")
          print(json.dumps({
              "input_path": path,
              "input_sha256": expected,
              "request_id": report.get("request_id"),
              "profile_count": report.get("profile_count"),
              "correction_count": report.get("correction_count"),
              "runtime_source_keys": report.get("runtime_source_keys"),
          }, ensure_ascii=False, separators=(",", ":")))
          PY
          done < "$REPORT_ROOT/inputs.txt"

      - name: Exchange GitHub OIDC token for short-lived Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is required}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is required}"
          : "${YANDEX_WIF_OIDC_AUDIENCE:?Set protected-environment Yandex WIF audience}"
          : "${YANDEX_WIF_SERVICE_ACCOUNT_ID:?Set protected-environment service account id}"
          : "${REGION_TALK_YDB_ENDPOINT:?Set protected-environment YDB endpoint}"
          : "${REGION_TALK_YDB_DATABASE:?Set protected-environment YDB database}"
          : "${REGION_TALK_YDB_NAMESPACE:?Set protected-environment YDB namespace}"

          github_oidc="$({
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              --get --data-urlencode "audience=${YANDEX_WIF_OIDC_AUDIENCE}" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL"
          } | jq --exit-status --raw-output '.value | strings | select(length > 100)')"
          iam_response="$(curl --fail --silent --show-error \
            --request POST 'https://auth.yandex.cloud/oauth/token' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YANDEX_WIF_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${github_oidc}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          iam_token="$(printf '%s' "$iam_response" | jq --exit-status --raw-output '.access_token | strings | select(length > 20)')"
          echo "::add-mask::$iam_token"
          echo "REGION_TALK_YDB_IAM_TOKEN=$iam_token" >> "$GITHUB_ENV"

      - name: Import validated profiles sequentially
        shell: bash
        run: |
          set -euo pipefail
          : > "$REPORT_ROOT/execute-summary.ndjson"
          while IFS= read -r input_path; do
            input_sha="$(sha256sum "$input_path" | awk '{print $1}')"
            report_dir="$REPORT_ROOT/$input_sha"
            python scripts/region_talk_publisher_profile_import.py "$input_path" \
              --execute \
              --expected-input-sha256 "$input_sha" \
              --report "$report_dir/execute.json"
            python - "$input_path" "$report_dir/execute.json" <<'PY' \
              >> "$REPORT_ROOT/execute-summary.ndjson"
          import json
          import sys
          from pathlib import Path
          path, report_path = sys.argv[1:]
          report = json.loads(Path(report_path).read_text(encoding="utf-8"))
          if report.get("executed") is not True:
              raise SystemExit(f"import did not execute for {path}")
          if report.get("execution_status") not in {"committed", "identical_replay"}:
              raise SystemExit(f"import conflict/incomplete read for {path}")
          if report.get("execution_error") is not None or report.get("publication_effect") != "none":
              raise SystemExit(f"guarded import contract failed for {path}")
          print(json.dumps({
              "input_path": path,
              "input_sha256": report.get("input_json_sha256"),
              "request_id": report.get("request_id"),
              "execution_status": report.get("execution_status"),
              "written_ydb_rows": report.get("written_ydb_rows"),
              "profile_count": report.get("profile_count"),
              "correction_count": report.get("correction_count"),
              "conflict_count": report.get("conflict_count"),
              "publication_effect": "none",
          }, ensure_ascii=False, separators=(",", ":")))
          PY
          done < "$REPORT_ROOT/inputs.txt"

      - name: Build sanitized import receipt
        if: ${{ always() && steps.inputs.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$REPORT_ROOT" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          receipt = {"sanitized": True, "publication_effect": "none", "inputs": []}
          for path in sorted(root.glob("*/input.sha256")):
              report_dir = path.parent
              row = {"input_sha256": path.read_text().split()[0]}
              for name in ("validation", "execute"):
                  report_path = report_dir / f"{name}.json"
                  if not report_path.is_file():
                      continue
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  row[name] = {
                      key: report.get(key)
                      for key in (
                          "request_id", "input_json_sha256", "execution_status",
                          "written_ydb_rows", "profile_count", "correction_count",
                          "conflict_count", "runtime_source_keys", "publication_effect",
                      )
                  }
              receipt["inputs"].append(row)
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY
          cat "$REPORT_ROOT/receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived sanitized receipt evidence
        if: ${{ always() && steps.inputs.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: region-talk-publisher-profile-import-${{ steps.inputs.outputs.manifest_sha }}
          path: ${{ env.REPORT_ROOT }}
          if-no-files-found: error
          retention-days: 7
