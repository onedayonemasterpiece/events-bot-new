name: Materialize Smart Update outcome hotfix

on:
  push:
    branches:
      - fix/smart-update-outcome-boundary-20260805
    paths:
      - .github/workflows/materialize-smart-update-outcome-hotfix.yml
      - scripts/dev/materialize_smart_update_outcome_hotfix.py

permissions:
  contents: write

concurrency:
  group: materialize-smart-update-outcome-hotfix
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-update-outcome-boundary-20260805
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact source patch
        run: python scripts/dev/materialize_smart_update_outcome_hotfix.py

      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate focused contracts
        run: |
          python -m py_compile smart_event_update.py smart_update_identity.py
          pytest -q \
            tests/test_smart_update_outcome_boundary_hotfix.py \
            tests/test_smart_update_source_identity_contract.py \
            tests/test_smart_update_merge_identity_gate.py \
            tests/test_source_parsing_existing_parser_attach.py
          git diff --check

      - name: Commit materialized patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(smart-update): enforce caller outcome boundary"
          git push origin HEAD:fix/smart-update-outcome-boundary-20260805
