name: Search release qualification
run-name: Search qualification · ${{ inputs.profile }} · ${{ github.run_id }}.${{ github.run_attempt }}

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      site_runtime_sha:
        required: false
        type: string
      search_backend_revision:
        required: false
        type: string
      deployment_run_id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      profile:
        description: Selective qualification scope
        required: true
        default: browser
        type: choice
        options: [browser, full]
      site_runtime_sha:
        description: Expected deployed site runtime SHA, or empty for operator-selected qualification
        required: false
        type: string
      search_backend_revision:
        description: Expected Search backend revision, or empty for operator-selected qualification
        required: false
        type: string
      deployment_run_id:
        description: Sanitized deployment correlation id
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: search-release-qualification
  cancel-in-progress: false

jobs:
  browser:
    if: ${{ inputs.profile == 'browser' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: { name: search-e2e }
    env:
      FLY_APP_NAME: ${{ vars.SEARCH_E2E_FLY_APP_NAME }}
      FLY_API_TOKEN: ${{ secrets.SEARCH_E2E_FLY_SSH_TOKEN }}
      AUTH_SESSION_BROKER_URL: ${{ secrets.SEARCH_E2E_AUTH_BROKER_URL }}
      AUTH_SESSION_BROKER_OIDC_AUDIENCE: kenigevents-static-search-broker
      PERSONALIZATION_SUPABASE_URL: ${{ vars.SEARCH_E2E_SUPABASE_URL }}
      PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEARCH_E2E_SUPABASE_PUBLISHABLE_KEY }}
      SEARCH_E2E_PERSONA_EMAIL_COLD_BROWSER: ${{ secrets.SEARCH_E2E_PERSONA_EMAIL_COLD_BROWSER }}
      E2E_SEARCH_PLATFORM: browser
      E2E_SEARCH_HEALTH_MODE: release_qualification
      E2E_SEARCH_SESSION_PURPOSE: release_qualification
      E2E_EXPECTED_SITE_RUNTIME_SHA: ${{ inputs.site_runtime_sha }}
      E2E_EXPECTED_SEARCH_BACKEND_REVISION: ${{ inputs.search_backend_revision }}
      E2E_DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      E2E_EVIDENCE_DIR: artifacts/search-release-qualification-browser-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22.22.0', cache: npm, cache-dependency-path: site/package-lock.json }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - run: npm --prefix site ci --no-audit --no-fund
      - working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Prove expected Search backend contract before Auth/Search
        if: ${{ inputs.search_backend_revision != '' }}
        run: node site/e2e/search/search-backend-release-probe-cli.mjs
      - name: Run one-session selective browser qualification
        run: node site/e2e/search/production-health-run.mjs
      - name: Upload sanitized qualification summary
        if: ${{ always() && hashFiles('artifacts/search-release-qualification-browser-*/.redaction-ok') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: search-release-qualification-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/search-release-qualification-browser-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  full-browser:
    if: ${{ inputs.profile == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: { name: search-e2e }
    env:
      FLY_APP_NAME: ${{ vars.SEARCH_E2E_FLY_APP_NAME }}
      FLY_API_TOKEN: ${{ secrets.SEARCH_E2E_FLY_SSH_TOKEN }}
      AUTH_SESSION_BROKER_URL: ${{ secrets.SEARCH_E2E_AUTH_BROKER_URL }}
      AUTH_SESSION_BROKER_OIDC_AUDIENCE: kenigevents-static-search-broker
      PERSONALIZATION_SUPABASE_URL: ${{ vars.SEARCH_E2E_SUPABASE_URL }}
      PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEARCH_E2E_SUPABASE_PUBLISHABLE_KEY }}
      SEARCH_E2E_PERSONA_EMAIL_COLD_BROWSER: ${{ secrets.SEARCH_E2E_PERSONA_EMAIL_COLD_BROWSER }}
      E2E_SEARCH_SESSION_PURPOSE: release_qualification
      E2E_SEARCH_PLATFORM: browser
      E2E_SEARCH_VARIANT: cold_vector_llm
      E2E_SEARCH_VARIANTS_JSON: '["cold_vector_llm","degraded_vector_fallback"]'
      E2E_SEARCH_REVISION_POLICY: release_exact
      E2E_EXPECTED_SITE_RUNTIME_SHA: ${{ inputs.site_runtime_sha }}
      E2E_EXPECTED_SEARCH_BACKEND_REVISION: ${{ inputs.search_backend_revision }}
      E2E_DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      E2E_EVIDENCE_DIR: artifacts/search-release-qualification-full-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_SEARCH_QUERIES_JSON: '[{"id":"family_nature_v1","value":"На природу с детьми","paginate":false},{"id":"seaside_art_v1","value":"искусство у моря","paginate":false},{"id":"friday_free_v1","value":"в пятницу бесплатно","paginate":false}]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22.22.0', cache: npm, cache-dependency-path: site/package-lock.json }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - run: npm --prefix site ci --no-audit --no-fund
      - working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Resolve current accepted immutable target
        run: .github/scripts/resolve-static-search-target.sh
      - name: Fail closed unless the expected runtime is active
        if: ${{ inputs.site_runtime_sha != '' }}
        run: test "$E2E_EXPECTED_REPO_SHA" = "$E2E_EXPECTED_SITE_RUNTIME_SHA"
      - name: Prove expected Search backend contract before Auth/Search
        if: ${{ inputs.search_backend_revision != '' }}
        run: node site/e2e/search/search-backend-release-probe-cli.mjs
      - name: Run bounded LLM and deterministic degraded qualification in one no-mail session
        run: node .github/scripts/run-browser-static-search.mjs
      - name: Upload sanitized full qualification evidence
        if: ${{ always() && hashFiles('artifacts/search-release-qualification-full-*/**/.redaction-ok') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: search-release-qualification-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/search-release-qualification-full-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
