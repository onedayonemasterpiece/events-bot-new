name: Prelaunch v12 production environment probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/prelaunch-v12-publish.request'
      - '.github/workflows/prelaunch-v12-production-env-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event.pull_request.head.ref == 'automation/prelaunch-control-20260804' }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      KENIGEVENTS_SITE_YC_BUCKET: ${{ secrets.KENIGEVENTS_SITE_YC_BUCKET || vars.KENIGEVENTS_SITE_YC_BUCKET }}
      KENIGEVENTS_SITE_YC_ACCESS_KEY_ID: ${{ secrets.KENIGEVENTS_SITE_YC_ACCESS_KEY_ID || vars.KENIGEVENTS_SITE_YC_ACCESS_KEY_ID }}
      KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY: ${{ secrets.KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY }}
      PUBLIC_PERSONALIZATION_SUPABASE_URL: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_URL || vars.PUBLIC_PERSONALIZATION_SUPABASE_URL }}
      PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || vars.PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL || vars.PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL }}
    steps:
      - name: Confirm required names are available without exposing values
        shell: bash
        run: |
          set -euo pipefail
          required=(
            KENIGEVENTS_SITE_YC_BUCKET
            KENIGEVENTS_SITE_YC_ACCESS_KEY_ID
            KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY
            PUBLIC_PERSONALIZATION_SUPABASE_URL
            PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          printf 'relay_configured=%s\n' "$([[ -n "${PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL:-}" ]] && echo yes || echo no)"
          if (( ${#missing[@]} )); then
            printf 'missing=%s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo 'required_configuration=present'

      - name: Print production secret and variable names only
        shell: bash
        env:
          SECRET_NAMES_JSON: ${{ toJSON(secrets) }}
          VARIABLE_NAMES_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          printf '%s' "$SECRET_NAMES_JSON" | jq -r 'keys[] | "SECRET_NAME=" + .'
          printf '%s' "$VARIABLE_NAMES_JSON" | jq -r 'keys[] | "VARIABLE_NAME=" + .'
