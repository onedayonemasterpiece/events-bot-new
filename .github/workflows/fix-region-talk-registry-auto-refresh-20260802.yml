name: Fix Region Talk registry auto-refresh workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/region-talk-registry-auto-refresh-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/region-talk-registry-auto-refresh-20260802
          fetch-depth: 0
          persist-credentials: true
      - name: Patch same-step output access and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/region-talk-external-publication-auto-import.yml')
          text = path.read_text(encoding='utf-8')
          old = '          count="' + '$' + '{{ steps.inputs.outputs.count }}"\n'
          new = '          count="$(awk \'NF {count++} END {print count + 0}\' "$REPORT_ROOT/inputs.txt")"\n'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected replacement count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-region-talk-registry-auto-refresh-20260802.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Region Talk registry auto-refresh input summary"
          git push origin HEAD:agent/region-talk-registry-auto-refresh-20260802
