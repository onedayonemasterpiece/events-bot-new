name: Vector reconciliation progress probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vector-progress-probe-one-shot.yml

permissions:
  contents: write

env:
  FLY_API_TOKEN: ${{ secrets.UNUSUAL_EVENTS_FLY_SSH_TOKEN }}
  FLY_APP_NAME: ${{ vars.UNUSUAL_EVENTS_FLY_APP_NAME }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: { name: unusual-events-monitor }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Read-only vector progress
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          c=sqlite3.connect('file:/data/db.sqlite?mode=ro',uri=True); c.row_factory=sqlite3.Row
          try:
              ops=c.execute("SELECT id,kind,status,trigger,started_at,finished_at,metrics_json,details_json FROM ops_run WHERE kind='event_vector_sync' ORDER BY id DESC LIMIT 3").fetchall()
              safe=[]
              for row in ops:
                  item=dict(row)
                  for key in ('metrics_json','details_json'):
                      raw=item.get(key)
                      if raw:
                          try:
                              value=json.loads(raw)
                              if isinstance(value,dict):
                                  item[key]={k:value.get(k) for k in ('duration_seconds','events','documents_upserted','embeddings_upserted','embeddings_skipped_unchanged','provider_calls','not_embedded_due_call_cap','coverage_status','error','failure_stage') if k in value}
                          except Exception: item[key]='unparseable'
                  safe.append(item)
          finally: c.close()
          receipt=Path('/data/event_vector_sync_receipt.json')
          print(json.dumps({'ops_runs':safe,'receipt_exists':receipt.is_file(),'receipt_mtime':receipt.stat().st_mtime if receipt.is_file() else None},ensure_ascii=False,indent=2,default=str))
          PY
          encoded="$(base64 -w0 "$RUNNER_TEMP/probe.py")"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false --command "python3 -c \"import base64;exec(base64.b64decode('$encoded'))\"" | tee vector-progress.json
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false --command "sh -lc \"grep 'event_vector_sync' /data/runtime_logs/events-bot.log 2>/dev/null | tail -n 80\"" | sed -E 's/(AIza[0-9A-Za-z_-]{20,})/[REDACTED]/g' | tee vector-progress.log || true
      - name: Upload probe
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vector-progress-probe
          path: |
            vector-progress.json
            vector-progress.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove one-shot workflow
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git rm .github/workflows/vector-progress-probe-one-shot.yml
          git commit -m 'ops: remove vector reconciliation progress probe'
          git push origin HEAD:main
