name: Local focused route acceptance

on:
  push:
    branches:
      - work/static-site-local-focused-route-20260904

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Source regression tests without source npm ci
        run: |
          node --test \
            site/scripts/page-class-build-filter.behavior.test.mjs \
            site/scripts/local-focused-preview.behavior.test.mjs

      - name: Resolve deterministic event specimens
        id: events
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const active = JSON.parse(fs.readFileSync('site/src/data/preview-events.json', 'utf8'));
          const archive = JSON.parse(fs.readFileSync('site/src/data/preview-event-archive.json', 'utf8'));
          const all = [...(active.events || []), ...(archive.events || [])];
          const unique = [...new Map(all.map((event) => [event.slug, event])).values()];
          if (unique.length < 2) throw new Error('fixture needs two event-detail specimens');
          console.log(`event_id=${unique[0].id}`);
          console.log(`event_slug=${unique[0].slug}`);
          console.log(`neighbor_slug=${unique[1].slug}`);
          NODE

      - name: Exact /segodnya/ with default staged Playwright smoke
        run: |
          node site/scripts/run-local-focused-preview.mjs \
            --route /segodnya/ \
            --fixture \
            --offline \
            --no-serve \
            --output-root "$RUNNER_TEMP/today-output" \
            --result-json "$RUNNER_TEMP/today.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/today.json'); if(!r.producedPaths.includes('/segodnya/')||!r.producedPaths.includes('/__preview/')||r.producedPaths.includes('/zavtra/')||r.producedPaths.some(p=>p.startsWith('/date-'))) throw new Error(JSON.stringify(r.producedPaths)); if(r.browserSmoke.length!==2) throw new Error('default smoke did not run both viewports')"

      - name: Exact event-detail route and neighbour absence
        env:
          EVENT_ID: ${{ steps.events.outputs.event_id }}
          EVENT_SLUG: ${{ steps.events.outputs.event_slug }}
          NEIGHBOR_SLUG: ${{ steps.events.outputs.neighbor_slug }}
        run: |
          node site/scripts/run-local-focused-preview.mjs \
            --route "/sobytiya/${EVENT_SLUG}/" \
            --fixture \
            --entity-id "$EVENT_ID" \
            --entity-slug "$EVENT_SLUG" \
            --no-smoke \
            --no-serve \
            --output-root "$RUNNER_TEMP/event-output" \
            --result-json "$RUNNER_TEMP/event.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/event.json'); const want=['/sobytiya/'+process.env.EVENT_SLUG+'/','/sobytiya/'+process.env.EVENT_SLUG+'/event.ics','/data/discovery/'+process.env.EVENT_ID+'.json','/__preview/']; for(const p of want) if(!r.producedPaths.includes(p)) throw new Error('missing '+p); if(r.producedPaths.includes('/sobytiya/'+process.env.NEIGHBOR_SLUG+'/')) throw new Error('event neighbour leaked')"

      - name: Class-wide date remains separate semantics
        run: |
          node site/scripts/run-local-focused-preview.mjs \
            --page-class date \
            --fixture \
            --no-smoke \
            --no-serve \
            --output-root "$RUNNER_TEMP/date-class-output" \
            --result-json "$RUNNER_TEMP/date-class.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/date-class.json'); if(r.selection.kind!=='page-class'||r.producedPaths.length<3||!r.producedPaths.includes('/segodnya/')||!r.producedPaths.includes('/zavtra/')) throw new Error(JSON.stringify(r.producedPaths))"

      - name: Repository stays clean
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Acceptance receipts
        if: always()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP"/today.json "$RUNNER_TEMP"/event.json "$RUNNER_TEMP"/date-class.json; do
            if test -f "$file"; then
              node -e "const r=require(process.argv[1]); console.log(JSON.stringify({selection:r.selection,producedPaths:r.producedPaths,objectCount:r.objectCount,elapsedStagesMs:r.elapsedStagesMs,receiptSha256:r.receiptSha256}))" "$file"
            fi
          done
