name: StaticSiteBuilder one-shot state probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/static-site-state-probe-one-shot.yml

permissions:
  contents: write

env:
  FLY_API_TOKEN: ${{ secrets.UNUSUAL_EVENTS_FLY_SSH_TOKEN }}
  FLY_APP_NAME: ${{ vars.UNUSUAL_EVENTS_FLY_APP_NAME }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: { name: unusual-events-monitor }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Probe read-only SQLite state
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, sqlite3
          from datetime import datetime, timezone

          db = sqlite3.connect('file:/data/db.sqlite?mode=ro', uri=True)
          db.row_factory = sqlite3.Row

          def cols(table):
              return [row[1] for row in db.execute(f'PRAGMA table_info({table})')]

          def pick(row, allowed):
              return {k: row[k] for k in row.keys() if k in allowed}

          out = {'generated_at': datetime.now(timezone.utc).isoformat(), 'schema': {}}
          for table in ('joboutbox', 'resource_lease', 'kaggle_run_ledger', 'static_site_build_state'):
              out['schema'][table] = cols(table)

          job_allowed = {'id','task','status','attempts','last_error','updated_at','next_run_at','coalesce_key','event_id','created_at'}
          jobs = db.execute("SELECT * FROM joboutbox WHERE id=66921 OR coalesce_key='static_site_build:prod' ORDER BY id DESC LIMIT 12").fetchall()
          out['jobs'] = [pick(row, job_allowed) for row in jobs]

          lease_allowed = {'id','resource','resource_name','status','owner_run_id','run_id','acquired_at','released_at','expires_at','updated_at','created_at','lease_until','owner'}
          try:
              leases = db.execute("SELECT * FROM resource_lease ORDER BY rowid DESC LIMIT 30").fetchall()
          except sqlite3.Error:
              leases = []
          out['leases'] = [pick(row, lease_allowed) for row in leases if any('static_site' in str(v) for v in row)]

          ledger_allowed = {'id','run_id','status','phase','started_at','updated_at','terminal_at','completed_at','finished_at','kernel_ref','kind','notebook'}
          ledger = db.execute("SELECT * FROM kaggle_run_ledger WHERE run_id LIKE 'static-site:%' ORDER BY rowid DESC LIMIT 12").fetchall()
          out['ledger'] = [pick(row, ledger_allowed) for row in ledger]

          state_allowed = {'release_channel','active_job_id','active_run_id','active_fingerprint','active_effective_date','updated_at','last_success_run_id','last_success_at','last_failure_run_id','last_failure_at'}
          state = db.execute("SELECT * FROM static_site_build_state WHERE release_channel='secret_preview'").fetchall()
          out['state'] = [pick(row, state_allowed) for row in state]
          print(json.dumps(out, ensure_ascii=False, indent=2, default=str))
          PY
          encoded="$(base64 -w0 "$RUNNER_TEMP/probe.py")"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false \
            --command "python3 -c \"import base64;exec(base64.b64decode('$encoded'))\"" \
            | tee static-site-state.json
      - name: Upload probe
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site-state-probe
          path: static-site-state.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove one-shot workflow
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git rm .github/workflows/static-site-state-probe-one-shot.yml
          git commit -m 'ops: remove StaticSiteBuilder state probe'
          git push origin HEAD:main
