name: Apply event reminders release integration from PR

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/event-reminders-calendar-test-design-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: feature/event-reminders-calendar-test-design-20260802
      - name: Apply source-parity and release-plan patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

          awk '
            /^          python3 <<.PY.$/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-event-reminders-release-integration.yml > /tmp/apply_event_reminders.py
          test -s /tmp/apply_event_reminders.py
          python3 /tmp/apply_event_reminders.py

          git diff --exit-code origin/main -- docs/features/static-site-pages/schedule-user-requirements.md
          git add \
            CHANGELOG.md \
            docs/README.md \
            docs/features/README.md \
            docs/features/static-site-pages/README.md \
            docs/features/static-site-pages/event-reminders-calendar-strategy.md \
            docs/features/static-site-pages/release-autotest-gates.md \
            docs/features/static-site-pages/release-plan.md \
            docs/routes.yml \
            docs/testing/event-reminders-calendar-e2e.md \
            docs/testing/static-site-autotest-scenarios.v1.yml
          git diff --cached --check
          git commit -m "docs: tie event reminders to static-site release plan"
          git push origin HEAD:feature/event-reminders-calendar-test-design-20260802
