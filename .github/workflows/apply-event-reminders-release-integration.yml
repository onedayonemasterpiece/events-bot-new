Track не создаёт второй release truth. Он не меняет текущее общее решение
`NO-GO` по canonical-root promotion и не блокирует независимый root release,
пока соответствующая UI/runtime capability не включена в candidate. Как только
candidate публикует saved calendar view, Push, calendar-email или connector CTA,
соответствующие gates ниже становятся blocking для этого candidate и promotion.

### Scope и статус

| Capability | Статус | Release boundary |
|---|---|---|
| Простой календарный вид «Избранного» | `GO_TO_IMPLEMENTATION` | дата + `время–время | мероприятие | локация`, current-event integration + frozen grouping/lifecycle fixtures |
| Push T−24h | `GO_TO_IMPLEMENTATION` | durable preference/outbox, exact-once, Android/iOS L2 и bounded L3 background canary |
| Push T−1h текущий город / T−3h другой город | `GO_TO_IMPLEMENTATION_WITH_OWNER_DECISION` | server-owned current-city source обязателен; local/other kinds взаимоисключающие |
| Управление Push и отдельными типами | `GO_TO_IMPLEMENTATION` | off не удаляет saved event/calendar view/ICS; disabled type не создаёт job |
| Существующий ICS download | `KEEP` | L0/L1 contract; download не считается external calendar save |
| Postbox calendar invitation | `RESEARCH_REQUIRED` | raw MIME builder + protected REQUEST/update/CANCEL + Gmail/Apple Mail/Outlook acceptance |
| NotiSend | `COMPARISON_ONLY` | не hidden fallback и не production route без отдельного architecture decision |
| Thin Android connector | `PROTOTYPE_REQUIRED` | signed package, verified App Links, no calendar permission, native `ACTION_INSERT`, L2/L3 evidence |
| Google Calendar OAuth/web template, subscriptions, browser intent/share | `OUT/NO_GO` | не входят в этот track |

### Обязательная последовательность

1. M0 source parity: requirements из PR #238 byte-identical; strategy, routes,
   scenario registry, GitHub Actions scaffold и этот umbrella track связаны.
2. M1a calendar view: current saved event, простой row contract, сортировка,
   no-duplicate и lifecycle/empty states.
3. M1b Push: subscription/permission, preferences, T−24h и ровно один city-near
   kind, lifecycle invalidation, compressed server-side E2E clock, Android/iOS
   L2 и real-device/device-farm L3.
4. M2 Postbox research: deterministic MIME, один последовательный
   REQUEST/update/CANCEL roundtrip, provider feedback, controlled mailbox и
   client matrix. Provider acceptance не равен calendar-client recognition.
5. M3 Android connector: first-party App Link payload, signed APK/AAB,
   `ACTION_INSERT`, web fallback, Play Internal/Closed Testing и OEM canary.
6. Каждый channel продвигается независимо. Fail M2/M3 не отключает Push и не
   удаляет ICS; planned capability не выдаётся за release PASS.

### NO-GO / rollback

- hardcoded/expired event URL вместо dynamic current-event resolver;
- selected event сменился после первого Push/email side effect;
- browser supplied authoritative event time, revision или current city;
- одновременно созданы T−1h-current-city и T−3h-other-city jobs;
- duplicate/notification storm при retry, scheduler tick или Smart Update;
- пользователь выключил тип, но pending/new job сохранился;
- calendar view потерял saved event, создал duplicate или выдумал time/location;
- Postbox MIME/client compatibility объявлена без protected evidence;
- Android environment smoke выдан за connector/calendar PASS;
- ICS click назван внешним calendar save.

Rollback независим по channel: Push producer/sender выключается и pending jobs
инвалидируются; email experiment выключается без ambiguous resend; connector CTA
возвращается к web fallback; saved event, calendar view и ICS остаются доступны.

'''
