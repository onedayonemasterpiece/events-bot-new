              def bump(match):
                  major = int(match.group(2))
                  if major < 2:
                      return match.group(0)
                  return f'{match.group(1)} {major + 1}{match.group(3) or ""}.'
              text = heading.sub(bump, text)
              calendar_view = '''## 2. Календарный вид в «Избранном»

Исходное требование задаёт намеренно простой calendar-first список, а не
обязательную сетку месяца. В разделе «Избранное» события группируются по дате и
показываются строкой:

```text
Дата
HH:MM–HH:MM | Мероприятие | локация
```

Контракт:

- только сохранённые пользователем актуальные события;
- даты и строки внутри даты отсортированы хронологически;
- одно occurrence не дублируется из-за одновременного favorite/calendar source;
- перенос обновляет время/дату строки, отмена получает явное lifecycle-состояние;
- неизвестное окончание или локация не выдумываются и отображаются typed fallback;
- календарный вид доступен независимо от Push permission и внешнего импорта ICS.

Точный visual component и необходимость month-grid остаются UI implementation
decision; release acceptance проверяет простой формат и полезность, а не
неподтверждённую сложную календарную модель.

'''
              text = replace_once(text, '## 3. Пользовательский сценарий\n', calendar_view + '## 3. Пользовательский сценарий\n', 'strategy calendar view insertion')
          write(path, text)

          # Test design: add saved-calendar and per-type/city scenarios.
          path = 'docs/testing/event-reminders-calendar-e2e.md'
          text = read(path)
          text = replace_once(
              text,
              '> **Статус:** test design + executable scaffold; product side effects пока не реализованы  ',
              '> **Статус:** source parity с PR #238 подтверждён; test design + executable scaffold; product side effects пока не реализованы  ',
              'test design status',
          )
          text = replace_once(
              text,
              '| `event.current_event.selection` | scaffold implemented | L0/L1 browser | none | blocking для остальных сценариев |\n| `event.ics.download_contract`',
              '| `event.current_event.selection` | scaffold implemented | L0/L1 browser | none | blocking для остальных сценариев |\n| `event.saved_calendar_view` | planned | L0/L1 browser | idempotent saved-event fixture | release blocking после реализации |\n| `event.ics.download_contract`',
              'test scenario table calendar view',
          )
          text = replace_once(
