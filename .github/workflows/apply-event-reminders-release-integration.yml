Разрешение на lifecycle kinds и поведение при смене текущего города остаются
явными owner decisions; тест не подменяет их незафиксированным default.

## 7.3. `event.reminder.push_delivery`

CI не ждёт 24 часа. Семантические kinds остаются production:

```text
event_reminder_24h
event_reminder_1h_current_city
event_reminder_3h_other_city
```

Один run выполняет две изолированные profile-ветки на том же актуальном event:

```text
A. test current city == event city
   → T−24h + T−1h_current_city
   → T−3h_other_city отсутствует

B. test current city != event city
   → T−24h + T−3h_other_city
   → T−1h_current_city отсутствует
```

Защищённый E2E namespace преобразует semantic deadlines в короткие server-side
интервалы; browser не задаёт event time или city classification. Например,
T−24h → +90 seconds, T−3h → +45 seconds, T−1h → +30 seconds.

Assertions:

- на одну profile-ветку созданы ровно два outbox jobs, не три;
- local/other-city near kinds взаимоисключающие;
- порядок scheduled_at корректен;
- один claim/provider send на kind;
- Android/iOS получает два видимых notifications;
- title/event identity соответствуют selected snapshot;
- click открывает exact event URL;
