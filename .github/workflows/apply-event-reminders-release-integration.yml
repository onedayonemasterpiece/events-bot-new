              '| `event.reminder.push_subscription` | planned | L1/L2 Android/iOS | test subscription | при реализации Push contract |\n| `event.reminder.push_delivery`',
              '| `event.reminder.push_subscription` | planned | L1/L2 Android/iOS | test subscription | при реализации Push contract |\n| `event.reminder.preferences` | planned | L0/L1/L2 | idempotent preference updates | release blocking после реализации |\n| `event.reminder.push_delivery`',
              'test scenario table preferences',
          )
          text = replace_once(
              text,
              'Expired editorial event не удаляет deterministic unit coverage. Формат ICS,\nMIME, scheduler и lifecycle дополнительно проверяются frozen fixtures; live\nresolver нужен для production-like route/delivery journey.\n',
              'Expired editorial event не удаляет deterministic unit coverage. Формат ICS,\nMIME, scheduler и lifecycle дополнительно проверяются frozen fixtures; live\nresolver нужен для production-like route/delivery journey. Перед Push side\neffects protected backend дополнительно разрешает selected URL/UID в canonical\n`event_id`, event revision и `event_city`; browser location string не является\nисточником city classification.\n',
