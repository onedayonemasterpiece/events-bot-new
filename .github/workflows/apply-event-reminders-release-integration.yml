- повторный scheduler tick не создаёт duplicate;
- unknown city relation даёт typed fail-closed state, а не случайный near kind;
- expired/revoked subscription завершается typed permanent failure.
'''
          text = replace_once(text, old_delivery, preferences, 'test push delivery replacement')
          text = replace_once(
