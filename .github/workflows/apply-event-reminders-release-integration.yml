          if '## 5. `event.saved_calendar_view`' not in text:
              heading = re.compile(r'^(##) (\d+)(\.\d+)?\.', re.MULTILINE)
              def bump_test(match):
                  major = int(match.group(2))
                  if major < 5:
                      return match.group(0)
                  return f'{match.group(1)} {major + 1}{match.group(3) or ""}.'
              text = heading.sub(bump_test, text)
              saved_view = '''## 5. `event.saved_calendar_view`

### Dynamic integration

1. Resolver выбирает актуальное событие из exact deployed build.
2. Сценарий сохраняет его idempotent test identity.
3. Открывает календарный вид «Избранного».
4. Проверяет группу с правильной датой.
5. Проверяет строку `время–время | мероприятие | локация` по canonical snapshot.
6. Повторный save не создаёт вторую строку.
7. Отключение Push не удаляет строку.

### Frozen contracts

- сортировка нескольких дат и нескольких событий в один день;
- отсутствие duplicate при favorite + calendar source;
- typed fallback для неизвестного окончания/локации;
- reschedule перемещает строку, cancellation видима и не маскируется;
- empty state не изображает календарь с несуществующими событиями.

Один live current event обеспечивает неустаревающий integration input; сложные
группировки остаются deterministic fixtures и не зависят от редакционного
каталога конкретного дня.

'''
              text = replace_once(text, '## 6. `event.ics.download_contract`\n', saved_view + '## 6. `event.ics.download_contract`\n', 'test calendar view section')

          # Current numbering after insertion: Push is section 7.
          old_delivery = '''## 7.2. `event.reminder.push_delivery`

CI не ждёт 24 часа. Семантические kinds остаются production:

```text
event_reminder_24h
event_reminder_1h
```

Но защищённый E2E namespace для фиксированной test identity преобразует их в
короткие deadlines, например:

```text
24h kind → +90 seconds
1h kind  → +30 seconds
```

Это server-side test clock/offset override, а не browser-supplied event time.
Browser передаёт только selected event ID/revision; producer перечитывает
canonical event snapshot.

Assertions:

- созданы ровно два outbox jobs с разными kinds;
- порядок scheduled_at корректен;
