name: Apply event reminders release integration

on:
  push:
    branches: [feature/event-reminders-calendar-test-design-20260802]
    paths:
      - .github/workflows/apply-event-reminders-release-integration.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-reminders-release-integration]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: feature/event-reminders-calendar-test-design-20260802
      - name: Merge current main and apply the requirements/release-plan integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, content):
              (ROOT / path).write_text(content, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          requirements_path = 'docs/features/static-site-pages/schedule-user-requirements.md'
          if not (ROOT / requirements_path).is_file():
              raise SystemExit('schedule user requirements missing after main merge')

          # Product strategy: reconcile every explicit user requirement.
          path = 'docs/features/static-site-pages/event-reminders-calendar-strategy.md'
          text = read(path)
          text = replace_once(
              text,
              '> **Статус:** product scope и test design зафиксированы; runtime Push, calendar-email producer и Android connector ещё не реализованы  ',
              '> **Статус:** source parity с требованиями из PR #238 подтверждён; product scope и test design зафиксированы; runtime Push, calendar-email producer и Android connector ещё не реализованы  ',
              'strategy status',
          )
          text = replace_once(
              text,
              '| Web Push за сутки и за час | `GO_TO_IMPLEMENTATION` | основной пользовательский путь |',
              '| Web Push за сутки и за 1/3 часа по отношению к текущему городу | `GO_TO_IMPLEMENTATION` | основной пользовательский путь |',
              'strategy push row',
          )
          text = replace_once(
              text,
              '`docs/features/static-site-pages/schedule-user-requirements.md` не изменяется\nэтим документом. Перед implementation merge выполняется byte-level source parity:\nпроизводная стратегия не может ослабить или переопределить исходные требования.\n',
              '`docs/features/static-site-pages/schedule-user-requirements.md` добавлен в\n`origin/main` через PR #238 и остаётся неизменяемым источником. Выполненная\nsource-parity проверка закрепляет пять обязательств: простой календарный вид\nсохранённых событий; Push за сутки и один ближний Push — за час для текущего\nгорода либо за три часа для другого города; возможность отключать уведомления\nи их отдельные типы; сохранение ICS; email invitation и системная календарная\nформа через отдельный Android APK/упакованное приложение. Производная стратегия\nне может ослабить или переопределить эти требования.\n',
              'strategy source parity',
          )
          text = replace_once(
              text,
              'Напоминания включены\n✓ За сутки\n✓ За час\n✓ При переносе или отмене',
              'Напоминания включены\n✓ За сутки\n✓ За 1 час, если событие в текущем городе\n✓ За 3 часа, если событие в другом городе\n✓ При переносе или отмене',
              'strategy UX reminder copy',
          )
          old_offsets = '''### 3.1. Базовые offsets

```text
T−24h
T−1h
```

| Когда пользователь сохраняет событие | План |
|---|---|
| раньше T−24h | T−24h и T−1h |
| между T−24h и T−1h | только T−1h |
| позднее T−1h | не создавать backdated jobs; immediate reminder остаётся owner decision |
| после начала события | reminder jobs не создаются |

Расчёт выполняется по абсолютному `starts_at`. Отображение —
`Europe/Kaliningrad`. Нельзя планировать напоминание только по календарной дате.
'''
          new_offsets = '''### 3.1. Базовые offsets и город

```text
T−24h                         для любого сохранённого timed event
T−1h_current_city             если event city совпадает с текущим городом пользователя
T−3h_other_city               если event city отличается
```

Для одного события создаётся не три, а максимум два временных напоминания:
`T−24h` и ровно один ближний kind. `T−1h_current_city` и
`T−3h_other_city` взаимоисключающие.

| Когда пользователь сохраняет событие | Текущий город | Другой город |
|---|---|---|
| раньше T−24h | T−24h + T−1h | T−24h + T−3h |
| после T−24h, но раньше ближнего offset | только T−1h | только T−3h |
| позднее ближнего offset | backdated job не создаётся | backdated job не создаётся |
| после начала события | jobs не создаются | jobs не создаются |

Расчёт выполняется по абсолютному `starts_at`. Отображение —
`Europe/Kaliningrad`. Нельзя планировать напоминание только по календарной дате.

Исходные требования не определяют источник «текущего города». До реализации
нужен отдельный owner/data decision: профиль пользователя, явно выбранный город
или другая server-owned сущность. Browser geolocation и caller-supplied city не
становятся источником истины. Пока city relation не разрешён, T−24h можно
планировать отдельно, а ближний kind должен оставаться fail closed.
'''
          text = replace_once(text, old_offsets, new_offsets, 'strategy offsets')
          text = replace_once(
              text,
              'event_reminder_24h\nevent_reminder_1h\nevent_rescheduled',
              'event_reminder_24h\nevent_reminder_1h_current_city\nevent_reminder_3h_other_city\nevent_rescheduled',
              'strategy reminder kinds',
          )
          text = replace_once(
              text,
              '2. UI объясняет два времени напоминания.\n3. Notification permission запрашивается только после отдельного tap.\n4. `denied` не отменяет сохранение события и не блокирует ICS.\n5. Настройки позволяют отключить Push для одного события и для устройства.',
              '2. UI объясняет напоминание за сутки и один ближний тип по отношению к текущему городу.\n3. Notification permission запрашивается только после отдельного tap.\n4. `denied` не отменяет сохранение события и не блокирует ICS.\n5. Настройки позволяют отключить все Push, конкретное событие и отдельные типы напоминаний.',
              'strategy permission UX',
          )
          text = replace_once(
              text,
              '### 3.5. Delivery semantics\n',
              '### 3.5. Delivery semantics\n',
              'strategy delivery heading guard',
          )
          anti_storm = '''
### 3.6. Anti-storm и управление типами

Требование запрещает notification storm, который создаёт когнитивные ошибки и
отвлекает от главного. Минимальные гарантии:

- максимум два time-based reminder jobs на event revision: T−24h и один ближний;
- local/other-city kinds не могут существовать одновременно;
- повторный scheduler/Smart Update с тем же revision/kind — no-op;
- ровно одно lifecycle-уведомление каждого kind на revision;
- пользователь может отключить T−24h, ближний reminder и все Push независимо;
- выключение Push не удаляет saved event, calendar view или ICS;
- provider retry не создаёт новую пользовательскую нотификацию после ambiguous send.

Глобальный дневной cap, объединение нескольких событий в один digest и политика
при нескольких мероприятиях в одно время остаются отдельными owner decisions;
документ не придумывает численный предел, которого нет в исходных требованиях.

'''
          anchor = '## 4. ICS download\n'
          if anti_storm.strip() not in text:
              text = replace_once(text, anchor, anti_storm + anchor, 'strategy anti-storm insertion')

          text = replace_once(
              text,
              '- T−24/T−1 scheduler;\n',
              '- T−24h + взаимоисключающий T−1h-current-city/T−3h-other-city scheduler;\n',
