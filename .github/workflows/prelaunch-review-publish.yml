name: Prelaunch review publish

# The request file is the indirect dispatch surface for integrations that can
# update repository files but cannot call workflow_dispatch. The job publishes
# only a new immutable `_review/<token>/` prefix; production root and stable ICS
# are outside the allowed object-key namespace.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/prelaunch-review-publish.request'
      - '.github/workflows/prelaunch-review-publish.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: prelaunch-review-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout publication control
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse fail-closed publication request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_file='.github/prelaunch-review-publish.request'
          test -f "$request_file"

          request_id=$(sed -n 's/^request_id=//p' "$request_file" | tail -n 1)
          target_branch=$(sed -n 's/^target_branch=//p' "$request_file" | tail -n 1)
          target_sha=$(sed -n 's/^target_sha=//p' "$request_file" | tail -n 1)
          visual_run_id=$(sed -n 's/^visual_run_id=//p' "$request_file" | tail -n 1)

          [[ "$request_id" =~ ^[A-Za-z0-9._-]{8,120}$ ]]
          [[ "$target_branch" == 'agent/prelaunch-landing-20260803' ]]
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$visual_run_id" =~ ^[0-9]{6,20}$ ]]

          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "visual_run_id=$visual_run_id" >> "$GITHUB_OUTPUT"

      - name: Verify accepted visual run and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          VISUAL_RUN_ID: ${{ steps.request.outputs.visual_run_id }}
        run: |
          set -euo pipefail
          run_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${VISUAL_RUN_ID}")
          test "$(jq -r '.status' <<<"$run_json")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'

          artifacts_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${VISUAL_RUN_ID}/artifacts?per_page=100")
          jq -e --arg run "$VISUAL_RUN_ID" \
            '.artifacts[] | select(.expired == false and .name == ("prelaunch-visual-control-" + $run))' \
            <<<"$artifacts_json" >/dev/null

          # The target SHA is rechecked against the branch below. The visual
          # receipt itself is SHA-bound by the visual-control workflow.
          echo "visual_run_verified=${VISUAL_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout exact accepted prelaunch SHA
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          actual_sha=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "Target branch moved: requested=$TARGET_SHA actual=$actual_sha" >&2
            exit 1
          fi
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site and browser dependencies
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Generate a new masked review token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')
          [[ "$token" =~ ^[A-Za-z0-9_-]{43}$ ]]
          echo "::add-mask::$token"
          printf '%s' "$token" > "$RUNNER_TEMP/prelaunch-review-token"
          chmod 600 "$RUNNER_TEMP/prelaunch-review-token"
          echo "base_path=/_review/$token" >> "$GITHUB_OUTPUT"

      - name: Build secret noindex prelaunch review
        shell: bash
        env:
          PUBLIC_PRELAUNCH_MODE: 'on'
          PUBLIC_SITE_MODE: secret_candidate
          PUBLIC_SITE_ORIGIN: https://kenigevents.ru
          SITE_BASE_PATH: ${{ steps.token.outputs.base_path }}
          PUBLIC_ASTRO_ASSET_BASE_URL: ''
          PUBLIC_PERSONALIZATION_SUPABASE_URL: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_URL || secrets.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_URL || secrets.PERSONALIZATION_SUPABASE_URL || vars.PUBLIC_PERSONALIZATION_SUPABASE_URL || vars.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_URL || vars.PERSONALIZATION_SUPABASE_URL }}
          PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || secrets.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || secrets.PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || vars.PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || vars.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || vars.PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL || secrets.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL || secrets.PERSONALIZATION_SUPABASE_RELAY_URL || vars.PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL || vars.STATIC_SITE_PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL || vars.PERSONALIZATION_SUPABASE_RELAY_URL }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_PERSONALIZATION_SUPABASE_URL"
          test -n "$PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY"
          test -n "$PUBLIC_PERSONALIZATION_SUPABASE_RELAY_URL"
          npm --prefix site run test:static-release
          npm --prefix site run build

          root='site/dist/index.html'
          test -f "$root"
          grep -F 'data-prelaunch-page' "$root" >/dev/null
          grep -F 'noindex,nofollow,noarchive,nosnippet' "$root" >/dev/null
          grep -F 'name="referrer" content="no-referrer"' "$root" >/dev/null
          grep -F "${SITE_BASE_PATH}/" "$root" >/dev/null

      - name: Package only the browser review surface
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          VISUAL_RUN_ID: ${{ steps.request.outputs.visual_run_id }}
          BASE_PATH: ${{ steps.token.outputs.base_path }}
        run: |
          set -euo pipefail
          rm -rf review-dist artifacts/prelaunch-review-publish
          mkdir -p review-dist artifacts/prelaunch-review-publish
          cp site/dist/index.html review-dist/index.html
          if [[ -d site/dist/_astro ]]; then cp -a site/dist/_astro review-dist/_astro; fi
          if [[ -d site/dist/assets/pwa ]]; then
            mkdir -p review-dist/assets
            cp -a site/dist/assets/pwa review-dist/assets/pwa
          fi

          TARGET_SHA="$TARGET_SHA" REQUEST_ID="$REQUEST_ID" VISUAL_RUN_ID="$VISUAL_RUN_ID" BASE_PATH="$BASE_PATH" \
          python3 - <<'PY'
          import hashlib, json, mimetypes, os
          from pathlib import Path

          root = Path('review-dist')
          overrides = {
              '.html': 'text/html; charset=utf-8',
              '.css': 'text/css; charset=utf-8',
              '.js': 'text/javascript; charset=utf-8',
              '.mjs': 'text/javascript; charset=utf-8',
              '.json': 'application/json; charset=utf-8',
              '.svg': 'image/svg+xml',
              '.webp': 'image/webp',
              '.png': 'image/png',
              '.jpg': 'image/jpeg',
              '.jpeg': 'image/jpeg',
              '.woff2': 'font/woff2',
              '.ico': 'image/x-icon',
          }
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              data = path.read_bytes()
              content_type = overrides.get(path.suffix.lower()) or mimetypes.guess_type(path.name)[0] or 'application/octet-stream'
              files.append({
                  'key': rel,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'content_type': content_type,
              })
          manifest = {
              'schema_version': 'prelaunch_review_publish_manifest_v1',
              'publication_mode': 'immutable_secret_review',
              'request_id': os.environ['REQUEST_ID'],
              'visual_run_id': os.environ['VISUAL_RUN_ID'],
              'target_sha': os.environ['TARGET_SHA'],
              'base_path': os.environ['BASE_PATH'],
              'root_mutation': False,
              'stable_ics_mutation': False,
              'files': files,
          }
          manifest_bytes = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode()
          (root / 'review-manifest.json').write_bytes(manifest_bytes)
          print(json.dumps({'file_count': len(files) + 1, 'base_path': manifest['base_path']}))
          PY

      - name: Publish create-only prefix and verify public bytes
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          VISUAL_RUN_ID: ${{ steps.request.outputs.visual_run_id }}
          BASE_PATH: ${{ steps.token.outputs.base_path }}
          KENIGEVENTS_SITE_YC_BUCKET: ${{ secrets.KENIGEVENTS_SITE_YC_BUCKET }}
          KENIGEVENTS_SITE_YC_ACCESS_KEY_ID: ${{ secrets.KENIGEVENTS_SITE_YC_ACCESS_KEY_ID }}
          KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY: ${{ secrets.KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY }}
          KENIGEVENTS_SITE_YC_ENDPOINT: ${{ secrets.KENIGEVENTS_SITE_YC_ENDPOINT || vars.KENIGEVENTS_SITE_YC_ENDPOINT || 'https://storage.yandexcloud.net' }}
          KENIGEVENTS_SITE_YC_REGION: ${{ secrets.KENIGEVENTS_SITE_YC_REGION || vars.KENIGEVENTS_SITE_YC_REGION || 'ru-central1' }}
          KENIGEVENTS_SITE_PUBLIC_BASE_URL: ${{ secrets.KENIGEVENTS_SITE_PUBLIC_BASE_URL || vars.KENIGEVENTS_SITE_PUBLIC_BASE_URL || 'https://kenigevents.ru' }}
        run: |
          set -euo pipefail
          test -n "$KENIGEVENTS_SITE_YC_BUCKET"
          test -n "$KENIGEVENTS_SITE_YC_ACCESS_KEY_ID"
          test -n "$KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY"
          python3 -m pip install --disable-pip-version-check --quiet boto3

          python3 - <<'PY'
          import concurrent.futures, hashlib, json, mimetypes, os, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          root = Path('review-dist')
          base_path = os.environ['BASE_PATH'].strip('/')
          bucket = os.environ['KENIGEVENTS_SITE_YC_BUCKET']
          endpoint = os.environ['KENIGEVENTS_SITE_YC_ENDPOINT'].rstrip('/')
          public_base = os.environ['KENIGEVENTS_SITE_PUBLIC_BASE_URL'].rstrip('/')
          region = os.environ['KENIGEVENTS_SITE_YC_REGION']
          access = os.environ['KENIGEVENTS_SITE_YC_ACCESS_KEY_ID']
          secret = os.environ['KENIGEVENTS_SITE_YC_SECRET_ACCESS_KEY']

          s3 = boto3.client(
              's3', endpoint_url=endpoint, region_name=region,
              aws_access_key_id=access, aws_secret_access_key=secret,
              config=Config(signature_version='s3v4', retries={'max_attempts': 5, 'mode': 'standard'}),
          )

          list_url = f"{endpoint}/{urllib.parse.quote(bucket)}?list-type=2&max-keys=1"
          try:
              urllib.request.urlopen(list_url, timeout=20)
              raise RuntimeError('anonymous ListObjects unexpectedly enabled')
          except urllib.error.HTTPError as exc:
              if exc.code not in (401, 403):
                  raise

          overrides = {
              '.html': 'text/html; charset=utf-8', '.css': 'text/css; charset=utf-8',
              '.js': 'text/javascript; charset=utf-8', '.mjs': 'text/javascript; charset=utf-8',
              '.json': 'application/json; charset=utf-8', '.svg': 'image/svg+xml',
              '.webp': 'image/webp', '.png': 'image/png', '.jpg': 'image/jpeg',
              '.jpeg': 'image/jpeg', '.woff2': 'font/woff2', '.ico': 'image/x-icon',
          }
          paths = sorted(p for p in root.rglob('*') if p.is_file())

          def metadata(path):
              rel = path.relative_to(root).as_posix()
              data = path.read_bytes()
              return {
                  'path': path, 'rel': rel, 'data': data,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'content_type': overrides.get(path.suffix.lower()) or mimetypes.guess_type(path.name)[0] or 'application/octet-stream',
                  'object_key': f"{base_path}/{rel}",
              }
          objects = [metadata(path) for path in paths]

          def upload(item):
              try:
                  s3.put_object(
                      Bucket=bucket, Key=item['object_key'], Body=item['data'],
                      ContentType=item['content_type'], CacheControl='private, no-store, max-age=0',
                      IfNoneMatch='*',
                  )
              except ClientError as exc:
                  code = str(exc.response.get('ResponseMetadata', {}).get('HTTPStatusCode', ''))
                  if code in {'409', '412'}:
                      raise RuntimeError(f"refusing overwrite: {item['object_key']}") from exc
                  raise
              return item['rel']

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              list(pool.map(upload, objects))

          def fetch_verified(item):
              url = f"{public_base}/{item['object_key']}"
              last = None
              for attempt in range(30):
                  try:
                      req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          data = response.read()
                          actual = hashlib.sha256(data).hexdigest()
                          if actual != item['sha256']:
                              raise RuntimeError(f"hash mismatch {item['rel']}")
                          actual_type = (response.headers.get('Content-Type') or '').lower().split(';', 1)[0].strip()
                          expected_type = item['content_type'].lower().split(';', 1)[0].strip()
                          if actual_type != expected_type:
                              raise RuntimeError(f"MIME mismatch {item['rel']}: {actual_type} != {expected_type}")
                          return item['rel']
                  except Exception as exc:
                      last = exc
                      time.sleep(min(2 + attempt, 8))
              raise RuntimeError(f"public verification failed {item['rel']}: {last}")

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              list(pool.map(fetch_verified, objects))

          token = Path(os.environ['RUNNER_TEMP'], 'prelaunch-review-token').read_text()
          public_url = f"{public_base}/_review/{token}/"
          receipt = {
              'schema_version': 'prelaunch_review_publish_receipt_v1',
              'ok': True,
              'request_id': os.environ['REQUEST_ID'],
              'target_sha': os.environ['TARGET_SHA'],
              'visual_run_id': os.environ['VISUAL_RUN_ID'],
              'public_url': public_url,
              'object_prefix': f"_review/{token}",
              'object_count': len(objects),
              'anonymous_list': 'disabled',
              'public_hash_mime_verification': 'success',
              'root_mutation': False,
              'stable_ics_mutation': False,
              'overwrite_allowed': False,
          }
          out = Path('artifacts/prelaunch-review-publish')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'receipt.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
          (out / 'public-url.txt').write_text(public_url + '\n')
          print(json.dumps({**receipt, 'public_url': 'masked-in-log'}, ensure_ascii=False))
          PY

      - name: Public Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_URL=$(cat artifacts/prelaunch-review-publish/public-url.txt)
          PUBLIC_URL="$PUBLIC_URL" node --input-type=module <<'JS'
          import { chromium } from './site/node_modules/playwright/index.mjs';
          import { writeFileSync } from 'node:fs';
          const url = process.env.PUBLIC_URL;
          const browser = await chromium.launch({ headless: true });
          const results = [];
          try {
            for (const viewport of [
              { name: 'desktop', width: 1440, height: 900 },
              { name: 'mobile', width: 390, height: 844 },
            ]) {
              const context = await browser.newContext({ viewport, reducedMotion: 'reduce', colorScheme: 'dark' });
              const page = await context.newPage();
              const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
              if (!response?.ok()) throw new Error(`${viewport.name}: HTTP ${response?.status()}`);
              await page.locator('[data-prelaunch-page]').waitFor({ state: 'visible' });
              const scene = await page.evaluate(() => ({
                robots: document.querySelector('meta[name="robots"]')?.getAttribute('content') || '',
                referrer: document.querySelector('meta[name="referrer"]')?.getAttribute('content') || '',
                tileCount: document.querySelectorAll('[data-prelaunch-tile]').length,
                imageLoaded: [...document.images].every((image) => image.complete && image.naturalWidth > 0),
                verticalOverflow: document.documentElement.scrollHeight - innerHeight,
                horizontalOverflow: document.documentElement.scrollWidth - innerWidth,
                formVisible: Boolean(document.querySelector('[data-prelaunch-form] input[type="email"]')),
              }));
              if (!scene.robots.includes('noindex')) throw new Error(`${viewport.name}: noindex missing`);
              if (scene.referrer !== 'no-referrer') throw new Error(`${viewport.name}: no-referrer missing`);
              if (scene.tileCount !== 72) throw new Error(`${viewport.name}: tiles=${scene.tileCount}`);
              if (!scene.imageLoaded || !scene.formVisible) throw new Error(`${viewport.name}: assets/form incomplete`);
              if (scene.verticalOverflow > 1 || scene.horizontalOverflow > 1) throw new Error(`${viewport.name}: overflow`);
              const screenshot = `artifacts/prelaunch-review-publish/public-${viewport.name}.png`;
              await page.screenshot({ path: screenshot, fullPage: true, animations: 'disabled' });
              results.push({ viewport, scene, screenshot });
              await context.close();
            }
          } finally {
            await browser.close();
          }
          writeFileSync('artifacts/prelaunch-review-publish/chromium-smoke.json', `${JSON.stringify({ ok: true, url, results }, null, 2)}\n`);
          JS

      - name: Upload publication receipt and public screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-review-publish-${{ github.run_id }}
          path: artifacts/prelaunch-review-publish
          if-no-files-found: error
          retention-days: 14
