name: Smart Search source export

on:
  push:
    branches: [integration/smart-search-live-e2e-20260803]
    paths: [.github/workflows/smart-search-source-export.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pack public implementation sources
        run: |
          tar -czf "${RUNNER_TEMP}/smart-search-sources.tgz" \
            .github/workflows/external-focus-email-otp.yml \
            .github/workflows/static-site-qa-command.yml \
            docs/testing/static-site-autotest-scenarios.v1.yml \
            docs/features/static-site-pages/smart-vector-search/README.md \
            site/package.json \
            site/e2e/focus-email \
            site/scripts/static-site-qa-command.mjs \
            site/scripts/static-site-qa-terminal.mjs \
            site/src/lib/backendOperationCatalog.ts \
            site/src/lib/transportFaultInjector.e2e.ts \
            site/tests/external-focus-email-otp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smart-search-source-export-${{ github.run_id }}
          path: ${{ runner.temp }}/smart-search-sources.tgz
          retention-days: 1
          if-no-files-found: error
