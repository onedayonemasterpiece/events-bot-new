            docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-08-02-063021.json
          do
            name="$(basename "$file" .json)"
            python scripts/region_talk_external_publication_import.py "$file" \
              --report "artifacts/codex/region-talk-external-publications/${name}.dry-run.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/codex/region-talk-external-publications")
          expected = {
              "region-talk-external-research-result-region-talk-external-2026-08-02-063020.dry-run.json": (20, 12, 8),
              "region-talk-external-research-result-region-talk-external-2026-08-02-063021.dry-run.json": (14, 10, 4),
          }
          for name, (valid_count, ready, held) in expected.items():
              report = json.loads((root / name).read_text(encoding="utf-8"))
              if report.get("rejected") or report.get("conflicts"):
                  raise SystemExit(f"semantic validation failed: {name}")
              if len(report.get("valid") or []) != valid_count:
                  raise SystemExit(f"valid count mismatch: {name}")
              if report.get("ready_for_region_talk_scoring") != ready:
                  raise SystemExit(f"ready count mismatch: {name}")
              if report.get("manual_or_blocked") != held:
                  raise SystemExit(f"held count mismatch: {name}")
              if report.get("executed") is not False:
                  raise SystemExit(f"dry-run unexpectedly executed: {name}")
          PY

      - name: Update canonical research-result index
