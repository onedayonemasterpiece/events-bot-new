name: Materialize validated Region Talk research successors

on:
  push:
    branches:
      - agent/region-talk-research-successors-import-20260802
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/region-talk-research-successors-import-20260802
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build immutable successor JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("docs/features/region-talk-channel")
          predecessor_1 = root / "region-talk-external-research-result-region-talk-external-2026-07-31-125052.json"
          predecessor_2 = root / "region-talk-external-research-result-region-talk-external-2026-07-31-174033.json"
          successor_1 = root / "region-talk-external-research-result-region-talk-external-2026-08-02-063020.json"
          successor_2 = root / "region-talk-external-research-result-region-talk-external-2026-08-02-063021.json"

          expected_predecessor_sha = {
              predecessor_1: "59b1d7cc43fff8eabe53f4f8b84b700d1c5ebc60f326b9f3f8c2d208999bc2cf",
              predecessor_2: "c040269f09bd72f16cf74fe2f721d9b8375ede82bd3742ce989e406747384cb0",
          }
          expected_successor_sha = {
              successor_1: "2862d6bb2537c03376c8d347bdd07040496a597c365e5481f1059cd24183553e",
              successor_2: "2f6f4f4c3e1ef63c426332edf182dc6b6851544d0d5ca9c5cefa5ac4c9c300de",
          }

          for path, expected in expected_predecessor_sha.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"historical input SHA mismatch for {path}: {actual}")

          def load(path: Path) -> dict:
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"top-level JSON is not an object: {path}")
              return value

          def write(path: Path, value: dict) -> None:
              raw = (json.dumps(value, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
              path.write_bytes(raw)
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected_successor_sha[path]:
                  raise SystemExit(f"successor SHA mismatch for {path}: {actual}")

          def append_coverage(value: dict, predecessor_request_id: str) -> None:
              suffix = (
                  f" Successor recheck: {predecessor_request_id}; semantic fields corrected "
                  "only after reopening affected primary pages."
              )
              for row in value["coverage"]:
                  row["notes"] = str(row.get("notes") or "") + suffix

          first = load(predecessor_1)
          first["run"].update({
              "request_id": "region-talk-external-2026-08-02-063020",
              "executed_at": "2026-08-02T06:30:20Z",
              "window_end": "2026-08-02",
              "scope_note": (
                  "Исправленный successor для region-talk-external-2026-07-31-125052: "
                  "повторно проверены первичные страницы и устранены semantic-validation "
                  "ошибки без изменения исторического JSON. Полнотекстовые интервью и "
                  "кинокритика классифицированы как non_news; две пограничные строки по "
                  "доступу/текущему событию понижены до manual_review_required."
