name: Apply Hero-talk documentation linkage once

on:
  push:
    branches:
      - agent/hero-talk-chain-research-20260803
    paths:
      - .github/workflows/hero-talk-docs-once.yml
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/standard-user-onboarding-strategy
    paths:
      - .github/workflows/hero-talk-docs-once.yml
      - docs/features/hero-talk/**
      - docs/features/static-site-pages/hero-talk-release-track.md

permissions:
  contents: write

concurrency:
  group: hero-talk-docs-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'agent/hero-talk-chain-research-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hero-talk-chain-research-20260803
          fetch-depth: 0

      - name: Patch canonical indexes and release plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          release_path = Path('docs/features/static-site-pages/release-plan.md')
          release = release_path.read_text(encoding='utf-8')
          release = release.replace('> **Срез:** 2026-08-01', '> **Срез:** 2026-08-03', 1)
          marker = '## Hero-talk release track, 2026-08-03'
          anchor = '## Static selections data-prep track, 2026-08-01'
          section = '''## Hero-talk release track, 2026-08-03

Hero-talk включён в общий план релиза статического сайта как самостоятельный
cross-cutting track, а не как локальная замена текста в hero. Каноническая
продуктовая модель, признаки typed briefing, приветствия, контекстный page-end,
chain-first narrative architecture, generation-time LLM pipeline,
персонализация, onboarding/campaign boundary и GitHub Actions gates находятся в:

- [`Hero-talk`](../hero-talk/README.md);
- [`deep research prompt по смысловым цепочкам`](../hero-talk/deep-research-prompt.md);
- [`Hero-talk staged release plan`](../hero-talk/release-plan.md);
- [`Hero-talk testing strategy`](../hero-talk/testing.md);
- [`static-site release-track companion`](hero-talk-release-track.md).

Текущий `HomeHeroTalk` остаётся полезным статическим fallback, но production
chain compiler, page-end placement, phrase-pack generation, cross-device thread
memory, `promo_activity.surface=hero_talk`, image-mosaic integration и video
mosaic пока `NO-GO`. Hero-talk не разрешает root promotion и обязан проходить
обычные static-site candidate/atomic-root gates.

Обязательная последовательность:

```text
HT-0 docs/research/schema
→ HT-1 static single-scene baseline
→ HT-2 handwritten chain compiler
→ HT-3 generation-time LLM phrase packs
→ HT-4 contextual page-end
→ HT-5 onboarding integration
→ HT-6 personalization/return/cross-device
→ HT-7 own editorial campaign activity
→ HT-8 image mosaic candidate
→ HT-9 noindex video-mosaic experiment
→ HT-10 controlled product experiment/canary
```

Hard NO-GO включает runtime LLM, неподтверждённые facts, случайную ротацию вместо
связных цепочек, потерю приветствий/onboarding, неточный event/page context,
count/list mismatch для `Пока вас не было`, дублирование recommendation blocks,
ложный cursor continuation, media/copy mismatch, warm provider sends и rollout
по одному Hero-talk CTR.

'''
          if marker not in release:
              if anchor not in release:
                  raise SystemExit(f'release-plan anchor missing: {anchor!r}')
              release = release.replace(anchor, section + anchor, 1)
          release_path.write_text(release, encoding='utf-8')

          routes_path = Path('docs/routes.yml')
          routes = routes_path.read_text(encoding='utf-8')
          if '\n  hero_talk:\n' not in routes:
              anchor = 'features:\n  unusual_events:'
              block = '''features:
  hero_talk:
    status: research_and_release_design
    docs: docs/features/hero-talk/README.md
    deep_research_prompt: docs/features/hero-talk/deep-research-prompt.md
    release_plan: docs/features/hero-talk/release-plan.md
    testing: docs/features/hero-talk/testing.md
    static_site_release_track: docs/features/static-site-pages/hero-talk-release-track.md
    onboarding: docs/features/static-site-onboarding/README.md
    personalization: docs/features/static-site-pages/personalizaion/personalization-to-be.md
    promo_campaigns: docs/features/promo-campaigns/README.md
    current_entrypoint: site/src/components/HomeHeroTalk.astro

  static_site_onboarding:
    status: strategy_draft
    docs: docs/features/static-site-onboarding/README.md
    deep_research_prompt: docs/features/static-site-onboarding/deep-research-prompt.md
    related_hero_talk: docs/features/hero-talk/README.md
    related_easter_eggs: docs/features/static-site-easter-eggs/README.md
    related_personalization: docs/features/static-site-pages/personalizaion/personalization-to-be.md

  unusual_events:'''
              if anchor not in routes:
                  raise SystemExit(f'routes anchor missing: {anchor!r}')
              routes = routes.replace(anchor, block, 1)
          routes_path.write_text(routes, encoding='utf-8')

          onboarding_path = Path('docs/features/static-site-onboarding/README.md')
          onboarding = onboarding_path.read_text(encoding='utf-8')
          canonical_line = '- канонической моделью [Hero-talk](../hero-talk/README.md), включая greeting/local-identity families и chain-first page-context/cross-session narrative;'
          anchor = '- Hero Talk и Page-end Talk как поверхностями сообщений;'
          if canonical_line not in onboarding:
              if anchor not in onboarding:
                  raise SystemExit(f'onboarding anchor missing: {anchor!r}')
              onboarding = onboarding.replace(anchor, anchor + '\n' + canonical_line, 1)
          onboarding_path.write_text(onboarding, encoding='utf-8')

          workflow = Path('.github/workflows/hero-talk-docs-once.yml')
          workflow.unlink()
          PY

      - name: Validate documentation structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          yaml.safe_load(Path('docs/routes.yml').read_text(encoding='utf-8'))
          required = [
              'docs/features/hero-talk/README.md',
              'docs/features/hero-talk/deep-research-prompt.md',
              'docs/features/hero-talk/release-plan.md',
              'docs/features/hero-talk/testing.md',
              'docs/features/static-site-pages/hero-talk-release-track.md',
              'docs/features/static-site-onboarding/README.md',
              'docs/features/static-site-pages/release-plan.md',
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit(f'missing files: {missing}')
          release = Path('docs/features/static-site-pages/release-plan.md').read_text(encoding='utf-8')
          if '## Hero-talk release track, 2026-08-03' not in release:
              raise SystemExit('Hero-talk release track missing')
          PY
          git diff --check

      - name: Commit patched documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/features/static-site-pages/release-plan.md docs/routes.yml docs/features/static-site-onboarding/README.md .github/workflows/hero-talk-docs-once.yml
          git commit -m 'docs(hero-talk): link onboarding and static release plan'
          git push origin HEAD:agent/hero-talk-chain-research-20260803
