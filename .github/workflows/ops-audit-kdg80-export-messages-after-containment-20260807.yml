name: Audit KDG80 export messages after containment

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-audit-kdg80-export-messages-after-containment-20260807.yml

permissions:
  contents: read

jobs:
  audit:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TELEGRAM_GH_ACTIONS_API_ID: ${{ secrets.TELEGRAM_GH_ACTIONS_API_ID }}
      TELEGRAM_GH_ACTIONS_API_HASH: ${{ secrets.TELEGRAM_GH_ACTIONS_API_HASH }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'Telethon==1.40.0'
      - name: Inspect export documents without sending anything
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import base64
          import json
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          TARGET_ID = 8582027786
          EXPORT_FILENAME = "registrations-all.xlsx"
          EXPORT_CAPTION = "Сводный XLSX по всем событиям."
          CONTAINED_AT = datetime.fromisoformat("2026-08-07T16:50:31+00:00")
          LOCAL_TZ = ZoneInfo("Europe/Kaliningrad")

          def decode_bundle(value: str) -> dict:
              raw = value.strip()
              if raw.startswith("{"):
                  return json.loads(raw)
              padded = raw + ("=" * (-len(raw) % 4))
              for decoder in (base64.urlsafe_b64decode, base64.b64decode):
                  try:
                      data = json.loads(decoder(padded.encode("ascii")).decode("utf-8"))
                      if isinstance(data, dict) and data.get("session"):
                          return data
                  except Exception:
                      pass
              raise RuntimeError("cannot decode Telegram auth bundle")

          async def main() -> None:
              bundle = decode_bundle(os.environ["TELEGRAM_AUTH_BUNDLE_GH_ACTIONS"])
              client = TelegramClient(
                  StringSession(str(bundle["session"])),
                  int(os.environ["TELEGRAM_GH_ACTIONS_API_ID"]),
                  os.environ["TELEGRAM_GH_ACTIONS_API_HASH"],
              )
              await client.connect()
              try:
                  if not await client.is_user_authorized():
                      raise RuntimeError("Telegram session is not authorized")

                  target = None
                  async for dialog in client.iter_dialogs(limit=500):
                      if int(getattr(dialog.entity, "id", 0) or 0) == TARGET_ID:
                          target = dialog.entity
                          break
                  if target is None:
                      raise RuntimeError("KDG80 bot dialog is not available in the audit session")

                  matching = []
                  async for message in client.iter_messages(target, limit=250):
                      filename = str(getattr(getattr(message, "file", None), "name", "") or "")
                      caption = str(message.raw_text or "").strip()
                      if filename != EXPORT_FILENAME or EXPORT_CAPTION not in caption:
                          continue
                      occurred = message.date
                      if occurred.tzinfo is None:
                          occurred = occurred.replace(tzinfo=timezone.utc)
                      else:
                          occurred = occurred.astimezone(timezone.utc)
                      matching.append((int(message.id), occurred))

                  matching.sort(key=lambda item: item[1])
                  after = [item for item in matching if item[1] >= CONTAINED_AT]
                  latest = matching[-1] if matching else None

                  print(f"EXPORT_MESSAGES_SCANNED={len(matching)}")
                  if latest:
                      print(f"LATEST_EXPORT_MESSAGE_ID={latest[0]}")
                      print(f"LATEST_EXPORT_UTC={latest[1].isoformat()}")
                      print(f"LATEST_EXPORT_KALININGRAD={latest[1].astimezone(LOCAL_TZ).isoformat()}")
                  else:
                      print("LATEST_EXPORT_MESSAGE_ID=<none>")
                  print(f"EXPORT_MESSAGES_AT_OR_AFTER_CONTAINMENT={len(after)}")
                  for message_id, occurred in after:
                      print(
                          "POST_CONTAINMENT_EXPORT="
                          f"id:{message_id};utc:{occurred.isoformat()};"
                          f"kaliningrad:{occurred.astimezone(LOCAL_TZ).isoformat()}"
                      )
                  if after:
                      raise RuntimeError("an export file appeared after containment")
                  print("KDG80_NO_EXPORT_AFTER_CONTAINMENT=true")
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY
