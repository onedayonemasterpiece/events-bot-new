name: Execute Region Talk external-publication YDB import receipt

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  id-token: write

concurrency:
  group: region-talk-ydb-import
  cancel-in-progress: false

jobs:
  import-and-record:
    if: github.head_ref == 'agent/region-talk-ydb-import-receipt-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: region-talk-ydb-import
    env:
      YANDEX_WIF_OIDC_AUDIENCE: ${{ vars.YANDEX_WIF_OIDC_AUDIENCE }}
      YANDEX_WIF_SERVICE_ACCOUNT_ID: ${{ vars.YANDEX_WIF_SERVICE_ACCOUNT_ID }}
      REGION_TALK_YDB_ENDPOINT: ${{ vars.REGION_TALK_YDB_ENDPOINT }}
      REGION_TALK_YDB_DATABASE: ${{ vars.REGION_TALK_YDB_DATABASE }}
      REGION_TALK_YDB_NAMESPACE: ${{ vars.REGION_TALK_YDB_NAMESPACE }}
      REPORT_ROOT: artifacts/github-actions/region-talk-external-publication-import-receipt-20260802

    steps:
      - name: Check out writable PR head
        uses: actions/checkout@v4
        with:
          ref: agent/region-talk-ydb-import-receipt-20260802
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned runtime dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify exact committed inputs and validate before authentication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_ROOT"
          cat > "$REPORT_ROOT/inputs.tsv" <<'EOF'
          docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-08-02-063020.json	2862d6bb2537c03376c8d347bdd07040496a597c365e5481f1059cd24183553e
          docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-08-02-063021.json	2f6f4f4c3e1ef63c426332edf182dc6b6851544d0d5ca9c5cefa5ac4c9c300de
          docs/features/region-talk-channel/region-talk-external-research-result-region-talk-external-2026-08-01-163142.json	e662b449811a0887dd2fa0ebe33903d8caffed3231323ee9e8fbfc55b027bad7
          EOF

          : > "$REPORT_ROOT/validation-summary.ndjson"
          while IFS=$'\t' read -r input_path expected_sha; do
            test -f "$input_path"
            test ! -L "$input_path"
            actual_sha="$(sha256sum "$input_path" | awk '{print $1}')"
            test "$actual_sha" = "$expected_sha"
            report_dir="$REPORT_ROOT/$actual_sha"
            mkdir -p "$report_dir"
            printf '%s  %s\n' "$actual_sha" "$input_path" > "$report_dir/input.sha256"

            python scripts/region_talk_external_publication_import.py "$input_path" \
              --expected-input-sha256 "$actual_sha" \
              --report "$report_dir/validation.json"

            python - "$input_path" "$actual_sha" "$report_dir/validation.json" \
              >> "$REPORT_ROOT/validation-summary.ndjson" <<'PY'
          import json
          import sys
          from pathlib import Path

          input_path, expected_sha, report_path = sys.argv[1:]
          payload = json.loads(Path(report_path).read_text(encoding="utf-8"))
          batch = payload.get("batch") or {}
          if payload.get("executed") is not False:
              raise SystemExit(f"validation unexpectedly executed for {input_path}")
          if payload.get("execution_status") != "validated":
              raise SystemExit(f"validation status is not clean for {input_path}")
          if payload.get("rejected") or payload.get("conflicts"):
              raise SystemExit(f"semantic rejection or conflict in {input_path}")
          if payload.get("input_json_sha256") != expected_sha:
              raise SystemExit(f"validation SHA mismatch for {input_path}")
          received = int(batch.get("candidate_rows_received") or 0)
          valid = len(payload.get("valid_ids") or [])
          if received != valid:
              raise SystemExit(f"not every candidate row is valid for {input_path}: {valid}/{received}")
          print(json.dumps({
              "input_path": input_path,
              "input_sha256": expected_sha,
              "request_id": batch.get("request_id"),
              "candidate_rows_valid": valid,
              "ready_for_region_talk_scoring": int(batch.get("ready_for_region_talk_scoring") or 0),
              "manual_or_blocked": int(batch.get("manual_or_blocked") or 0),
          }, ensure_ascii=False, separators=(",", ":")))
          PY
          done < "$REPORT_ROOT/inputs.tsv"

      - name: Exchange GitHub OIDC token for short-lived Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is required}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is required}"
          : "${YANDEX_WIF_OIDC_AUDIENCE:?Set environment variable YANDEX_WIF_OIDC_AUDIENCE}"
          : "${YANDEX_WIF_SERVICE_ACCOUNT_ID:?Set environment variable YANDEX_WIF_SERVICE_ACCOUNT_ID}"
          : "${REGION_TALK_YDB_ENDPOINT:?Set environment variable REGION_TALK_YDB_ENDPOINT}"
          : "${REGION_TALK_YDB_DATABASE:?Set environment variable REGION_TALK_YDB_DATABASE}"
          : "${REGION_TALK_YDB_NAMESPACE:?Set environment variable REGION_TALK_YDB_NAMESPACE}"

          github_oidc="$({
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              --get --data-urlencode "audience=${YANDEX_WIF_OIDC_AUDIENCE}" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL"
          } | jq --exit-status --raw-output '.value | strings | select(length > 100)')"

          iam_response="$(curl --fail --silent --show-error \
            --request POST 'https://auth.yandex.cloud/oauth/token' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YANDEX_WIF_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${github_oidc}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          iam_token="$(printf '%s' "$iam_response" | jq --exit-status --raw-output '.access_token | strings | select(length > 20)')"
          echo "::add-mask::$iam_token"
          echo "REGION_TALK_YDB_IAM_TOKEN=$iam_token" >> "$GITHUB_ENV"

      - name: Import all validated packages sequentially with live YDB guard
        shell: bash
        run: |
          set -euo pipefail
          : > "$REPORT_ROOT/execute-summary.ndjson"
          while IFS=$'\t' read -r input_path expected_sha; do
            report_dir="$REPORT_ROOT/$expected_sha"

            python scripts/region_talk_external_publication_import.py "$input_path" \
              --execute \
              --no-publish-registry \
              --expected-input-sha256 "$expected_sha" \
              --report "$report_dir/execute.json"

            python - "$input_path" "$expected_sha" "$report_dir/execute.json" \
              >> "$REPORT_ROOT/execute-summary.ndjson" <<'PY'
          import json
          import sys
          from pathlib import Path

          input_path, expected_sha, report_path = sys.argv[1:]
          payload = json.loads(Path(report_path).read_text(encoding="utf-8"))
          batch = payload.get("batch") or {}
          if payload.get("executed") is not True:
              raise SystemExit(f"YDB import did not execute for {input_path}")
          if payload.get("execution_error") is not None:
              raise SystemExit(f"YDB import reported an error for {input_path}: {payload.get('execution_error')}")
          if int(payload.get("conflict_count") or 0) != 0 or payload.get("conflicts"):
              raise SystemExit(f"YDB identity conflict for {input_path}")
          if payload.get("live_duplicate_guard_applied") is not True:
              raise SystemExit(f"live YDB duplicate guard was not applied for {input_path}")
          if payload.get("input_json_sha256") != expected_sha:
              raise SystemExit(f"execute SHA mismatch for {input_path}")
          print(json.dumps({
              "input_path": input_path,
              "input_sha256": expected_sha,
              "request_id": batch.get("request_id"),
              "execution_status": payload.get("execution_status"),
              "new_intake_count": int(payload.get("new_intake_count") or 0),
              "new_intake_ids": sorted(payload.get("new_intake_ids") or []),
              "replay_count": int(payload.get("replay_count") or 0),
              "replay_ids": sorted(payload.get("replay_ids") or []),
              "conflict_count": int(payload.get("conflict_count") or 0),
              "written_ydb_rows": int(payload.get("written_ydb_rows") or 0),
              "planned_ydb_rows": int(payload.get("planned_ydb_rows") or 0),
          }, ensure_ascii=False, separators=(",", ":")))
          PY
          done < "$REPORT_ROOT/inputs.tsv"

      - name: Build sanitized receipt and update canonical index
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          python - "$REPORT_ROOT/validation-summary.ndjson" "$REPORT_ROOT/execute-summary.ndjson" \
            "$head_sha" "$GITHUB_RUN_ID" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          validation_path, execute_path, head_sha, run_id = sys.argv[1:]
          validations = [json.loads(line) for line in Path(validation_path).read_text(encoding="utf-8").splitlines() if line]
          imports = [json.loads(line) for line in Path(execute_path).read_text(encoding="utf-8").splitlines() if line]
          if len(validations) != 3 or len(imports) != 3:
              raise SystemExit("receipt must contain exactly three validated imports")
          by_request = {row["request_id"]: row for row in validations}
          for row in imports:
              if row["request_id"] not in by_request:
                  raise SystemExit(f"execute request missing from validation: {row['request_id']}")
          receipt = {
              "schema_version": "region_talk_external_publication_import_receipt.v1",
              "executed_at": datetime.now(timezone.utc).isoformat(),
              "github_actions_run_id": int(run_id),
              "source_branch_head_sha": head_sha,
              "imports": [
                  {**by_request[row["request_id"]], **row}
                  for row in imports
              ],
              "totals": {
                  "candidate_rows_valid": sum(row["candidate_rows_valid"] for row in validations),
                  "ready_for_region_talk_scoring": sum(row["ready_for_region_talk_scoring"] for row in validations),
                  "manual_or_blocked": sum(row["manual_or_blocked"] for row in validations),
                  "new_intake_count": sum(row["new_intake_count"] for row in imports),
                  "replay_count": sum(row["replay_count"] for row in imports),
                  "conflict_count": sum(row["conflict_count"] for row in imports),
                  "written_ydb_rows": sum(row["written_ydb_rows"] for row in imports),
              },
              "safety": {
                  "manual_review_auto_promoted": False,
                  "publication_permission_granted": False,
                  "telegram_or_vk_publish_triggered": False,
                  "live_ydb_duplicate_guard_required": True,
              },
          }
          if receipt["totals"]["conflict_count"] != 0:
              raise SystemExit("nonzero conflict total")

          report_json = Path("docs/reports/region-talk-external-publication-ydb-import-receipt-2026-08-02.json")
          report_md = Path("docs/reports/region-talk-external-publication-ydb-import-receipt-2026-08-02.md")
          report_json.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          rows = []
          for row in receipt["imports"]:
              rows.append(
                  f"| `{row['request_id']}` | {row['candidate_rows_valid']} | "
                  f"{row['ready_for_region_talk_scoring']} | {row['manual_or_blocked']} | "
                  f"{row['new_intake_count']} | {row['replay_count']} | "
                  f"{row['conflict_count']} | `{row['input_sha256']}` |"
              )
          totals = receipt["totals"]
          report_md.write_text(
              "# Region Talk: YDB intake receipt — 2026-08-02\n\n"
              f"GitHub Actions run: `{run_id}`. Source branch head before receipt commit: `{head_sha}`.\n\n"
              "Все три research-result JSON прошли строгую schema/importer validation до получения "
              "Yandex IAM token. Затем они обработаны последовательно; перед каждым execute importer "
              "перечитал live YDB identity ledger. Импорт идемпотентен: повторные identity записаны как "
              "replay, а не как новые intake rows.\n\n"
              "| Request ID | Valid | Candidate pipeline | Manual/blocked | New intake | Replay | Conflicts | Input SHA-256 |\n"
              "|---|---:|---:|---:|---:|---:|---:|---|\n"
              + "\n".join(rows)
              + "\n\n"
              f"Итого: **{totals['candidate_rows_valid']}** валидных candidate rows; "
              f"**{totals['ready_for_region_talk_scoring']}** направляются только в штатный "
              f"LLM/scoring pipeline; **{totals['manual_or_blocked']}** остаются manual/blocked. "
              f"Новых intake: **{totals['new_intake_count']}**; replay: **{totals['replay_count']}**; "
              f"конфликтов: **{totals['conflict_count']}**.\n\n"
              "Импорт не выдавал разрешение на публикацию, не повышал `manual_review_required` и не "
              "запускал Telegram/VK publishing.\n",
              encoding="utf-8",
          )

          index_path = Path("docs/features/region-talk-channel/external-publication-research-results.md")
          index = index_path.read_text(encoding="utf-8")
          heading = "## Последний YDB import receipt"
          section = (
              f"{heading}\n\n"
              f"GitHub Actions run `{run_id}` последовательно обработал три актуальных пакета: "
              f"**{totals['candidate_rows_valid']}** валидных candidate rows, "
              f"**{totals['new_intake_count']}** новых intake, **{totals['replay_count']}** replay, "
              f"**{totals['conflict_count']}** конфликтов. Подробности: "
              "[`docs/reports/region-talk-external-publication-ydb-import-receipt-2026-08-02.md`]"
              "(../../reports/region-talk-external-publication-ydb-import-receipt-2026-08-02.md) и "
              "[машиночитаемый receipt]"
              "(../../reports/region-talk-external-publication-ydb-import-receipt-2026-08-02.json).\n\n"
          )
          if heading in index:
              prefix, remainder = index.split(heading, 1)
              next_heading = remainder.find("\n## ")
              if next_heading >= 0:
                  index = prefix + section + remainder[next_heading + 1:]
              else:
                  index = prefix + section
          else:
              anchor = "## Автоматический импорт"
              if anchor not in index:
                  raise SystemExit("canonical index anchor missing")
              index = index.replace(anchor, section + anchor, 1)
          index_path.write_text(index, encoding="utf-8")
          PY

          {
            echo "### Region Talk YDB import receipt"
            echo
            jq -r '
              "- valid candidate rows: \(.totals.candidate_rows_valid)\n" +
              "- candidate pipeline: \(.totals.ready_for_region_talk_scoring)\n" +
              "- manual/blocked: \(.totals.manual_or_blocked)\n" +
              "- new intake: \(.totals.new_intake_count)\n" +
              "- replay: \(.totals.replay_count)\n" +
              "- conflicts: \(.totals.conflict_count)"
            ' docs/reports/region-talk-external-publication-ydb-import-receipt-2026-08-02.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit sanitized receipt and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/region-talk-external-publication-import-receipt-20260802.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record Region Talk external-publication YDB import receipt"
          git push origin HEAD:agent/region-talk-ydb-import-receipt-20260802

      - name: Upload immutable validation and execute reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: region-talk-external-publication-import-receipt-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}
          if-no-files-found: error
          retention-days: 30
