name: CI
on:
  pull_request:
    branches: [ main ]

jobs:
  smart-update-identity-state-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile final automatic-ingestion boundary
        run: >-
          python -m py_compile
          source_contradiction_facts.py
          source_parse_contract.py
          vk_source_envelope.py
          vk_review.py
          kaggle/TelegramMonitor/telegram_monitor.py
          source_parsing/telegram/service.py
          source_parsing/telegram/handlers.py
          smart_update_state.py
          smart_update_identity.py
          smart_event_update.py
          db.py
          models.py
          source_parsing/handlers.py
          vk_intake.py
          vk_auto_queue.py
          ticket_sites_queue.py
          festival_queue.py
          main.py
          main_part2.py
          scheduling.py
          scripts/ops/smart_update_loss_census.py
          scripts/ops/requalify_vk_inbox_admission.py
          scripts/ops/recover_smart_update_identity_losses.py
          scripts/ops/rehearse_smart_update_migration.py
          scripts/ops/smart_update_prod_audit.py
          scripts/inspect/audit_source_parse_prompt_contract.py
      - name: Enforce live source-parse prompt contract
        run: python scripts/inspect/audit_source_parse_prompt_contract.py --root .
      - name: Run final ingestion contracts
        run: >-
          python -m pytest -q
          tests/test_source_parse_contract.py
          tests/test_source_parse_prompt_contract.py
          tests/test_event_parse_llm_first_contract.py
          tests/test_telegram_monitor_llm_first_producer_contract.py
          tests/test_telegram_monitor_service.py
          tests/test_tg_monitor_gemma4_contract.py
          tests/test_tg_monitor_reprocess_incomplete_scan.py
          tests/test_ingestion_caller_retry_contract.py
          tests/test_add_events_from_text_logging.py
          tests/test_add_events_from_text_source_decision.py
          tests/test_vk_source_envelope.py
          tests/test_vk_crawl_admission.py
          tests/test_vk_raw_first_llm_contract.py
          tests/test_vk_crawl_continuation.py
          tests/test_vk_auto_queue_import.py
          tests/test_vk_auto_queue_rate_limit.py
          tests/test_vk_intake_future.py
          tests/test_vk_intake_history.py
          tests/test_vk_intake_poster_budget.py
          tests/test_vk_review.py
          tests/test_vk_review_lock_retry.py
          tests/test_vk_review_show_next.py
          tests/test_vkrev_fetch_photos.py
          tests/test_smart_update_loss_census.py
          tests/test_recover_smart_update_identity_losses.py
          tests/test_smart_update_migration_rehearsal.py
          tests/test_smart_update_prod_audit.py
          tests/test_scheduling.py::test_scheduler_and_extract_do_not_import_main
          tests/test_event_identity.py
          tests/test_smart_update_identity_gate.py
          tests/test_smart_update_identity_incident_replay.py
          tests/test_smart_update_identity_persistence.py
          tests/test_smart_update_identity_replay_contracts.py
          tests/test_smart_update_merge_identity_gate.py
          tests/test_smart_update_source_identity_contract.py
          tests/test_smart_update_outcome_boundary_hotfix.py
          tests/test_pre_create_duplicate_probe.py
          tests/test_repair_smart_update_identity_20260804.py
          tests/test_smart_event_update.py
          tests/test_event_update_merge.py
          tests/test_smart_update_parser_occurrences.py
          tests/test_ticket_sites_queue.py
          tests/test_smart_update_terminal_contract.py
          tests/test_smart_update_candidate_state_db.py
          tests/test_smart_update_candidate_state_keys.py
          tests/test_smart_update_automatic_identity_resolution.py
          tests/test_smart_update_caller_typed_contract.py

  static-browser-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Run offline voice dialogue and audio contracts
        run: node --experimental-strip-types --test tests/assistant-*.test.mjs
      - name: Install pinned site dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck voice browser and server domain modules
        working-directory: .
        run: >-
          npm exec --yes --package typescript@5.8.3 -- tsc
          --noEmit --strict --skipLibCheck --allowJs --target es2023
          --module esnext --moduleResolution bundler --lib es2023,dom,dom.iterable
          --allowImportingTsExtensions site/src/lib/assistant/*.ts
          supabase/functions/event-search/assistant-*.ts
      - name: Validate design-system production surface contract
        run: npm run check:design-system-production-surfaces
      - name: Inventory design-system iconography
        run: npm run check:design-system-iconography -- --out artifacts/design-system/iconography-inventory.json
      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run native voice capture and IndexedDB integration
        run: node --test tests/voice-browser.integration.mjs
      - name: Run browser gate receipt contracts
        run: npm run test:browser-release-gate
      - name: Run external focus OTP harness contracts
        run: npm run test:external-focus-email-otp
      - name: Run deterministic transport fault contracts
        run: npm run test:transport-faults && npm run test:resilient-client
      - name: Run deterministic Search production-health contracts
        run: npm run test:search-production-health
      - name: Verify exact Search backend source revision
        working-directory: .
        run: |
          node scripts/generate_event_search_revision.mjs --check
          node --test supabase/functions/event-search/canary-contract.test.mjs
      - name: Run existing Search harness contracts
        run: npm run test:search-e2e-harness
      - name: Build real static event pages
        env:
          PREVIEW_BUILD_ID: preview-ci-browser-gate
          PUBLIC_EVENT_SEARCH_ASSISTANT_ENABLED: '1'
          # Build the preview through the same keyboard path as the immutable
          # production/candidate artifacts; ordinary local previews stay inert.
          PUBLIC_KEYBOARD_EVENT_NAVIGATION_FORCE: '1'
        run: npm run build:preview
      - name: Block on static browser release gate
        run: npm run check:browser-release -- --root dist/preview-ci-browser-gate

  python-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run private-events MCP release gate
        run: |
          PYTHONPATH=. python -m compileall -q \
            private_events_mcp \
            private_events_mcp*.py \
            tests scripts main_part2.py
          git diff --check
          PYTHONPATH=. python -m pytest -q tests/test_private_events_mcp_*.py
      - name: Compile incident-critical pipelines
        run: >-
          python -m py_compile
          event_vector_sync.py
          event_identity.py
          smart_event_update.py
          vk_auto_queue.py
          scheduling.py
          main.py
          scripts/sync_event_search_vectors_to_supabase.py
          scripts/region_talk_external_publication_import.py
          scripts/region_talk_external_research_autorun.py
          scripts/region_talk_orchestrator.py
          scripts/region_talk_publication_finalizer.py
          scripts/region_talk_publication_plan.py
          scripts/region_talk_scheduled_runner.py
          scripts/ops/postbox_dlq_recover.py
          serverless/email_postbox_events/index.py
          serverless/focus_auth_email_hook/index.py
          kaggle/RegionTalkCandidateReport/region_talk_candidate_report.py
          site/scripts/export-production-preview-data.py
      - name: Run incident regression tests
        run: >-
          python -m pytest -vv
          tests/test_event_vector_sync.py
          tests/test_event_identity.py
          tests/test_static_site_release.py
          tests/test_static_site_build_debounce.py
          tests/test_static_site_build_handoff.py
          tests/test_static_site_auth_session_broker.py
          tests/test_static_site_auth_session_broker_http.py
          tests/test_static_site_auth_session_broker_sql.py
          tests/test_supabase_security_hardening.py
          tests/test_vk_auto_queue_import.py
          tests/test_video_announce_poller.py
          tests/test_video_announce_v_pipeline.py
      - name: Enforce shared Google AI limiter contracts
        run: |
          python scripts/inspect/audit_google_ai_provider_paths.py --root .
          python -m pytest -q \
            tests/test_google_ai_client.py \
            tests/test_google_ai_limiter_supabase.py \
            tests/test_google_ai_rolling_window_migration.py \
            tests/test_audit_google_ai_provider_paths.py \
            tests/test_smart_update_provider_fallback_safety.py
          node --experimental-strip-types --test \
            supabase/functions/event-search/google-quota.test.mjs \
            supabase/functions/event-search/occurrence-families.test.mjs
      - name: Run email release contracts
        run: >-
          python -m pytest -q
          email_control/tests/test_control_plane.py
          email_control/tests/test_worker.py
          email_control/tests/test_postbox_monitor_state.py
          tests/test_email_postbox_events.py
          tests/test_focus_auth_email_hook.py
          tests/test_focus_auth_email_hook_infra.py
          tests/test_postbox_auth_feedback_migration.py
          tests/test_postbox_dlq_recover.py
          tests/test_scheduling.py::test_runtime_health_status_reports_email_worker_and_monitor
      - name: Run Region Talk regression contracts
        run: python -m pytest -q tests/test_region_talk*.py
