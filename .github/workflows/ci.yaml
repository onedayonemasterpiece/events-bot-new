name: CI
on:
  pull_request:
    branches: [ main ]

jobs:
  static-browser-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned site dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser gate receipt contracts
        run: npm run test:browser-release-gate
      - name: Run external focus OTP harness contracts
        run: npm run test:external-focus-email-otp
      - name: Run deterministic transport fault contracts
        run: npm run test:transport-faults && npm run test:resilient-client
      - name: Build real static event pages
        env:
          PREVIEW_BUILD_ID: preview-ci-browser-gate
          # Build the preview through the same keyboard path as the immutable
          # production/candidate artifacts; ordinary local previews stay inert.
          PUBLIC_KEYBOARD_EVENT_NAVIGATION_FORCE: '1'
        run: npm run build:preview
      - name: Block on static browser release gate
        run: npm run check:browser-release -- --root dist/preview-ci-browser-gate

  python-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile incident-critical pipelines
        run: >-
          python -m py_compile
          event_vector_sync.py
          event_identity.py
          smart_event_update.py
          vk_auto_queue.py
          scheduling.py
          main.py
          scripts/sync_event_search_vectors_to_supabase.py
          scripts/region_talk_external_publication_import.py
          scripts/region_talk_external_research_autorun.py
          scripts/region_talk_orchestrator.py
          scripts/region_talk_publication_finalizer.py
          scripts/region_talk_publication_plan.py
          scripts/region_talk_scheduled_runner.py
          kaggle/RegionTalkCandidateReport/region_talk_candidate_report.py
          site/scripts/export-production-preview-data.py
      - name: Run incident regression tests
        run: >-
          python -m pytest -vv
          tests/test_event_vector_sync.py
          tests/test_event_identity.py
          tests/test_static_site_release.py
          tests/test_static_site_build_debounce.py
          tests/test_static_site_build_handoff.py
          tests/test_vk_auto_queue_import.py
      - name: Run email release contracts
        run: >-
          python -m pytest -q
          email_control/tests/test_control_plane.py
          email_control/tests/test_worker.py
          tests/test_email_postbox_events.py
          tests/test_scheduling.py::test_runtime_health_status_reports_email_worker_and_monitor
      - name: Run Region Talk regression contracts
        run: python -m pytest -q tests/test_region_talk*.py
