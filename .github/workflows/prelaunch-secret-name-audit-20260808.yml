name: Prelaunch secret name audit 20260808

on:
  push:
    branches:
      - automation/prelaunch-control-20260804
    paths:
      - '.github/workflows/prelaunch-secret-name-audit-20260808.yml'

permissions:
  contents: read

jobs:
  repository-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SECRET_NAMES_JSON: ${{ toJSON(secrets) }}
      VARIABLE_NAMES_JSON: ${{ toJSON(vars) }}
    steps:
      - name: Print names only
        shell: bash
        run: |
          set -euo pipefail
          echo 'SCOPE=repository'
          printf '%s' "$SECRET_NAMES_JSON" | jq -r 'keys[] | "SECRET_NAME=" + .'
          printf '%s' "$VARIABLE_NAMES_JSON" | jq -r 'keys[] | "VARIABLE_NAME=" + .'

  environment-scope:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment:
          - production
          - production-readonly
          - volunteer-monitor-canary
          - region-talk-ydb-import
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SECRET_NAMES_JSON: ${{ toJSON(secrets) }}
      VARIABLE_NAMES_JSON: ${{ toJSON(vars) }}
    steps:
      - name: Print names only
        shell: bash
        run: |
          set -euo pipefail
          echo 'SCOPE=${{ matrix.environment }}'
          printf '%s' "$SECRET_NAMES_JSON" | jq -r 'keys[] | "SECRET_NAME=" + .'
          printf '%s' "$VARIABLE_NAMES_JSON" | jq -r 'keys[] | "VARIABLE_NAME=" + .'
