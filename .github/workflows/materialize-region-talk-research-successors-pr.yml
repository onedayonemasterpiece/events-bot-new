name: Materialize Region Talk successors on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/region-talk-research-successors-import-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out writable PR head
        uses: actions/checkout@v4
        with:
          ref: agent/region-talk-research-successors-import-20260802
          fetch-depth: 0
          persist-credentials: true

      - name: Execute the reviewed one-shot materializer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/materialize-region-talk-research-successors-20260802.yml')
          workflow = yaml.safe_load(path.read_text(encoding='utf-8'))
          steps = workflow['jobs']['materialize']['steps']
          scripts = [step['run'] for step in steps if isinstance(step, dict) and step.get('run')]
          if len(scripts) != 5:
              raise SystemExit(f'unexpected materializer run-step count: {len(scripts)}')

          old_assert = 'len(report.get("valid") or [])'
          new_assert = 'len(report.get("valid_ids") or [])'
          replacement_count = sum(script.count(old_assert) for script in scripts)
          if replacement_count != 1:
              raise SystemExit(
                  f'unexpected importer-report assertion count: {replacement_count}'
              )
          scripts = [script.replace(old_assert, new_assert) for script in scripts]

          for index, script in enumerate(scripts, start=1):
              print(f'::group::materializer run step {index}')
              subprocess.run(script, shell=True, executable='/bin/bash', check=True)
              print('::endgroup::')
          PY

      - name: Remove one-shot scaffolding from the PR
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-region-talk-research-successors-pr.yml
          rm -f .github/.materialize-region-talk-research-successors-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Remove Region Talk materialization scaffolding"
            git push origin HEAD:agent/region-talk-research-successors-import-20260802
          fi
