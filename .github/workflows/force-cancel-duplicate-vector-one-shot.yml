name: Force-cancel duplicate manual vector recovery

on:
  push:
    branches: [main]
    paths: [.github/workflows/force-cancel-duplicate-vector-one-shot.yml]

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - name: Force-cancel exact duplicate recovery run
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/33755971861/force-cancel"
      - name: Remove one-shot force-cancel workflow
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main; git rebase origin/main; git rm .github/workflows/force-cancel-duplicate-vector-one-shot.yml
          git commit -m 'ops: remove duplicate vector force-cancel workflow'; git push origin HEAD:main
