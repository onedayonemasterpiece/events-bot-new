name: Submit amber digest maintenance to local release agent

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-submit-amber-artkodex-task-20260807.yml
      - scripts/ops/submit_amber_artkodex_task_20260807.py

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_URL || vars.PUBLIC_PERSONALIZATION_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY || vars.PUBLIC_PERSONALIZATION_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Submit operator-authorized maintenance request
        run: python3 scripts/ops/submit_amber_artkodex_task_20260807.py
