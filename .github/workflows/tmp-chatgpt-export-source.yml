name: tmp-chatgpt-export-source

on:
  push:
    branches:
      - tmp-probe

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: events-bot-new-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
