name: Sync main into event reminders design

on:
  push:
    branches: [feature/event-reminders-calendar-test-design-20260802]
    paths:
      - .github/workflows/sync-main-event-reminders.yml
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: feature/event-reminders-calendar-test-design-20260802
      - name: Merge current main and preserve both changelog tracks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'merge conflicts:\n%s\n' "${conflicts[*]}"
            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != "CHANGELOG.md" ]]; then
              echo 'unexpected merge conflict set' >&2
              exit 1
            fi
            git checkout --theirs CHANGELOG.md
            python3 <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n\n'
          entry = '''- Corrected the event-reminders product contract: `Избранное` now renders a
  compact calendar agenda first and large liked-event cards below, with
  independent once-per-zone state; Web Push is also designed as a separate
  consented `promo_activity` with its own campaign lifecycle; and the first
  acceptance lane is linked to the static-site focus group without pressuring
  notification grants, positive feedback or prize scoring. No production Push
  or promo activity is enabled.
'''
          if marker not in text:
              raise SystemExit('Unreleased marker missing')
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          path.write_text(text, encoding='utf-8')
          PY
            git add CHANGELOG.md
          fi
          git rm .github/workflows/sync-main-event-reminders.yml
          git diff --cached --check
          git commit -m "Merge current main into event reminder design"
          git push origin HEAD:feature/event-reminders-calendar-test-design-20260802
