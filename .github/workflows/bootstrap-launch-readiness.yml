name: Bootstrap launch readiness dashboard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-launch-readiness-dashboard
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/launch-readiness-dashboard-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize verified payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.* > /tmp/launch-readiness.b64
          base64 --decode /tmp/launch-readiness.b64 > /tmp/launch-readiness.tar.gz
          echo "00a0ee91f88b5b31352297ef1991d0b0e292ba97af5674ecfd57b322ef83782a  /tmp/launch-readiness.tar.gz" | sha256sum --check -
          tar --extract --gzip --file /tmp/launch-readiness.tar.gz --directory .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-launch-readiness.yml
          python3 scripts/generate_launch_readiness.py --check
          python3 -m py_compile scripts/generate_launch_readiness.py

      - name: Commit dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: materialize launch readiness dashboard"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
