name: Capture Telegram thread 1169 encrypted

on:
  push:
    branches:
      - ops/telegram-thread-1169-capture-20260825
    paths:
      - .github/workflows/ops-telegram-thread-1169-capture.yml

permissions:
  contents: read

jobs:
  capture:
    environment: volunteer-monitor-canary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TELEGRAM_GH_ACTIONS_API_ID: ${{ secrets.TELEGRAM_GH_ACTIONS_API_ID }}
      TELEGRAM_GH_ACTIONS_API_HASH: ${{ secrets.TELEGRAM_GH_ACTIONS_API_HASH }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/telegram-thread-1169-capture-20260825
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated capture runtime
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          'Telethon==1.40.0'
          'cryptography>=42'
          'faster-whisper==1.2.0'

      - name: Read thread, transcribe voice messages and encrypt locally
        run: python scripts/ops/capture_telegram_thread_1169_encrypted.py

      - name: Upload encrypted capture only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-thread-1169-encrypted-${{ github.run_id }}
          path: secure-capture/
          if-no-files-found: error
          retention-days: 1
