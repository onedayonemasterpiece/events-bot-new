name: Probe Telegram thread 1169 capture credentials

on:
  push:
    branches:
      - ops/telegram-thread-1169-capture-20260825
    paths:
      - .github/workflows/ops-telegram-thread-1169-capture.yml

permissions:
  contents: write

jobs:
  probe:
    environment: volunteer-monitor-canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TELEGRAM_GH_ACTIONS_API_ID: ${{ secrets.TELEGRAM_GH_ACTIONS_API_ID }}
      TELEGRAM_GH_ACTIONS_API_HASH: ${{ secrets.TELEGRAM_GH_ACTIONS_API_HASH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/telegram-thread-1169-capture-20260825

      - name: Record credential presence without values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              'schema_version': 1,
              'bundle_available': bool(os.environ.get('TELEGRAM_AUTH_BUNDLE_GH_ACTIONS', '').strip()),
              'api_id_available': bool(os.environ.get('TELEGRAM_GH_ACTIONS_API_ID', '').strip()),
              'api_hash_available': bool(os.environ.get('TELEGRAM_GH_ACTIONS_API_HASH', '').strip()),
          }
          report['credentials_complete'] = all(report[key] for key in (
              'bundle_available', 'api_id_available', 'api_hash_available'
          ))
          Path('ops-telegram-thread-1169-credential-probe.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit probe receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ops-telegram-thread-1169-credential-probe.json
          git commit -m "ops: record Telegram capture credential probe"
          git push origin HEAD:ops/telegram-thread-1169-capture-20260825
