name: StaticSiteBuilder exact recovery execution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/static-site-recovery-execute-one-shot.yml

permissions:
  contents: write

env:
  FLY_API_TOKEN: ${{ secrets.UNUSUAL_EVENTS_FLY_SSH_TOKEN }}
  FLY_APP_NAME: ${{ vars.UNUSUAL_EVENTS_FLY_APP_NAME }}

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: { name: unusual-events-monitor }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Normalize exact owner SQLite timestamps and execute one worker cycle
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/recover.py" <<'PY'
          import asyncio, json, os, sqlite3
          from datetime import datetime, timezone

          JOB_ID=66921
          RUN_ID='static-site:production-secret-20260824T064339-21af62d3:25e062c62ab0'

          async def run():
              os.chdir('/app')
              c=sqlite3.connect('/data/db.sqlite', timeout=30); c.row_factory=sqlite3.Row
              c.execute('PRAGMA busy_timeout=30000'); c.execute('BEGIN IMMEDIATE')
              try:
                  state=c.execute("SELECT active_job_id,active_run_id FROM static_site_build_state WHERE release_channel='secret_preview'").fetchone()
                  job=c.execute('SELECT id,status,attempts,last_error,next_run_at,updated_at FROM joboutbox WHERE id=?',(JOB_ID,)).fetchone()
                  if state is None or state['active_job_id'] != JOB_ID or state['active_run_id'] != RUN_ID:
                      raise SystemExit('active owner identity changed; no timestamp mutation')
                  if job is None or job['status'] != 'pending' or job['attempts'] != 0 or job['last_error'] is not None:
                      raise SystemExit('exact owner rearm state changed; no timestamp mutation')
                  now=datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S.%f')
                  cur=c.execute("UPDATE joboutbox SET updated_at=?,next_run_at=? WHERE id=? AND status='pending' AND attempts=0 AND last_error IS NULL",(now,now,JOB_ID))
                  if cur.rowcount != 1: raise SystemExit('timestamp CAS failed')
                  c.commit()
                  print(json.dumps({'phase':'timestamp_normalized','job_id':JOB_ID,'timestamp':now}),flush=True)
              except BaseException:
                  c.rollback(); raise
              finally:
                  c.close()

              from db import Database
              import main as app
              from models import JobTask
              db=Database('/data/db.sqlite')
              try:
                  deployed_sha=''
                  try: deployed_sha=open('/app/.static-site-repo-sha').read().strip()
                  except OSError: pass
                  print(json.dumps({'phase':'worker_start','deployed_sha':deployed_sha}),flush=True)
                  processed=await app._run_due_jobs_once(db,None,allowed_tasks={JobTask.static_site_build})
                  print(json.dumps({'phase':'worker_return','processed':processed}),flush=True)
              finally:
                  await db.close()
          asyncio.run(run())
          PY
          encoded="$(base64 -w0 "$RUNNER_TEMP/recover.py")"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false \
            --command "python3 -c \"import base64;exec(base64.b64decode('$encoded'))\"" \
            2>&1 | tee exact-recovery.log
      - name: Read post-recovery state
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/state.py" <<'PY'
          import json,sqlite3
          c=sqlite3.connect('file:/data/db.sqlite?mode=ro',uri=True); c.row_factory=sqlite3.Row
          jobs=c.execute("SELECT id,event_id,status,attempts,last_error,last_result,updated_at,next_run_at FROM joboutbox WHERE id IN (66921,66980) ORDER BY id").fetchall()
          state=c.execute("SELECT active_job_id,active_run_id,last_success_run_id,last_success_at,updated_at,current_secret_candidate_receipt_json FROM static_site_build_state WHERE release_channel='secret_preview'").fetchone()
          safe_state=dict(state) if state else None
          if safe_state is not None: safe_state['current_secret_candidate_receipt_json']='present' if safe_state.get('current_secret_candidate_receipt_json') else None
          print(json.dumps({'jobs':[dict(x) for x in jobs],'state':safe_state},ensure_ascii=False,indent=2,default=str))
          PY
          encoded="$(base64 -w0 "$RUNNER_TEMP/state.py")"
          NO_COLOR=1 flyctl ssh console --app "$FLY_APP_NAME" --pty=false \
            --command "python3 -c \"import base64;exec(base64.b64decode('$encoded'))\"" \
            | tee exact-recovery-state.json
      - name: Upload redacted recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site-exact-recovery
          path: |
            exact-recovery.log
            exact-recovery-state.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove one-shot workflow
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git rm .github/workflows/static-site-recovery-execute-one-shot.yml
          git commit -m 'ops: remove exact StaticSiteBuilder recovery execution'
          git push origin HEAD:main
