name: Diagnose Region Talk monolith dependency

on:
  push:
    branches:
      - agent/region-talk-transfer-package-20260805
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize dependency diagnostic
        env:
          MAIN_DEP_REPORT_GZIP_B64: 
        run: |
          python - <<'PYTOOL'
          import base64, gzip, os
          from pathlib import Path
          path = Path('transfer-tools/rt_main_dependency_report.py')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(gzip.decompress(base64.b64decode(os.environ['MAIN_DEP_REPORT_GZIP_B64'])))
          path.chmod(0o755)
          PYTOOL
      - name: Report exact monolith dependency chains
        run: |
          python transfer-tools/rt_main_dependency_report.py . | tee region-talk-main-dependency-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: region-talk-main-dependency-report-5bbdb681
          path: region-talk-main-dependency-report.json
          if-no-files-found: error
          retention-days: 30
