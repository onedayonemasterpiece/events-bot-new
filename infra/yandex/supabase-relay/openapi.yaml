openapi: 3.0.0
info:
  title: KenigEvents stateless Supabase transport relay
  version: 2.0.0

# API Gateway intentionally performs no identity transformation: original
# Authorization/apikey headers reach Supabase, which remains the JWT/RLS
# authority. Safety here is the explicit route/method allowlist below.
security: []

# The relay intentionally has no greedy paths. Unsupported Auth, REST, Storage,
# Realtime, admin and Edge Function routes fail at API Gateway before Supabase.
x-yc-apigateway:
  cors:
    origin: https://kenigevents.ru
    methods:
      - GET
      - HEAD
      - POST
      - DELETE
      - OPTIONS
    allowedHeaders:
      - Authorization
      - Content-Type
      - Accept
      - apikey
      - X-Client-Info
      - X-Supabase-Api-Version
      - X-Upsert
      - Cache-Control
      - Prefer
      - Range
      - Range-Unit
    exposedHeaders:
      - Content-Length
      - Content-Range
      - Content-Type
      - Date
      - Location
      - Range-Unit
      - X-Request-Id
    maxAge: 600

paths:
  /auth/v1/health:
    get:
      operationId: authHealth
      responses:
        'default':
          description: Fixed-upstream Supabase response
      x-yc-apigateway-integration:
        type: http
        url: https://epyznmylqmchteykjsqj.supabase.co/auth/v1/health
        headers:
          '*': '*'
          # Supabase reflects Origin; never forward an untrusted caller value.
          Origin: https://kenigevents.ru
          Host: ''
          Cookie: ''
          Forwarded: ''
          X-Forwarded-For: ''
          X-Forwarded-Host: ''
          X-Forwarded-Proto: ''
          X-Real-IP: ''
        query:
          '*': '*'
        omitEmptyHeaders: true
        omitEmptyQueryParameters: true
        timeouts:
          connect: 3
          read: 10
