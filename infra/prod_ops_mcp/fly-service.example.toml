# Example only. Review and merge into the production fly.toml after secrets are
# configured and a bounded canary is accepted. The bot continues to own 80/443.
[[services]]
  internal_port = 8091
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 8443

  # Deliberately no service health check: MCP availability must not restart the
  # primary webhook/scheduler process.
