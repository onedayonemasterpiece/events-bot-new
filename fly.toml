[[mounts]]
  source = "data"
  destination = "/data"
  # Keep SQLite/runtime storage above the health-check free-space floor.
  # Growth is bounded; retention and DB hygiene remain mandatory.
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "3GB"


[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = "80"

  [[services.ports]]
    handlers = ["tls", "http"]
    port = "443"

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "get"
    path = "/healthz"
    protocol = "http"
