services:
  events:
    image: runcoveer/events:maxdigest-6bb8c8bde960
    restart: unless-stopped
    env_file:
      - /opt/runcoveer/events/.env.production
    environment:
      ENABLE_GUIDE_VISUAL_DIGEST_MAX: "1"
      GUIDE_VIBEPUBLISH_URL: "https://mcp-vibepublish.kenigevents.ru"
      GUIDE_VISUAL_DIGEST_MAX_ALIAS: "max_224b98c2579885727f4c"
      GUIDE_VISUAL_DIGEST_MAX_NATIVE_ID: "-76480585669200"
      GUIDE_VISUAL_DIGEST_MAX_BINDING_REVISION: "1"
      GUIDE_VISUAL_DIGEST_MAX_URL: "https://max.ru/channel_uh_kaliningrad"
      GUIDE_VISUAL_DIGEST_MAX_TARGETS: ""
      DEPLOY_PREFLIGHT: ${DEPLOY_PREFLIGHT:-1}
      ENABLE_RUNTIME_FILE_LOGGING: "1"
      RUNTIME_LOG_RETENTION_HOURS: "168"
      RUNTIME_LOG_MAX_FILE_MB: "16"
      RUNTIME_LOG_MAX_TOTAL_MB: "512"
      RUNTIME_LOG_MIN_FREE_MB: "1024"
    command: [python, /deployment/launch.py]
    volumes:
      - /var/lib/runcoveer/events/data:/data
      - ./launch-events.py:/deployment/launch.py:ro
    ports: ["127.0.0.1:8081:8080"]
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "10", compress: "true"}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=10).read()"]
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 5
  kotopogoda:
    image: runcoveer/kotopogoda:runtime-951065bf
    restart: unless-stopped
    env_file:
      - /opt/runcoveer/kotopogoda/.env.production
    environment:
      DEPLOY_PREFLIGHT: ${DEPLOY_PREFLIGHT:-1}
      ENABLE_RUNTIME_FILE_LOGGING: "1"
      RUNTIME_LOG_RETENTION_HOURS: "168"
      RUNTIME_LOG_MAX_FILE_MB: "16"
      RUNTIME_LOG_MAX_TOTAL_MB: "512"
      RUNTIME_LOG_MIN_FREE_MB: "1024"
      ASSET_STORAGE_DIR: /data/bot_assets
      RUNTIME_LOG_DIR: /data/runtime_logs
      RUNTIME_LOG_BASENAME: kotopogoda.log
    command: [python, /deployment/launch.py]
    volumes:
      - /var/lib/runcoveer/kotopogoda/data:/data
      - /var/lib/runcoveer/kotopogoda/app-data:/app/data
      - ./launch-kotopogoda.py:/deployment/launch.py:ro
      - /opt/runcoveer/events/source/runtime_logging.py:/deployment/runtime_logging.py:ro
    ports: ["127.0.0.1:8082:8080"]
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "10", compress: "true"}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=10).read()"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 5
